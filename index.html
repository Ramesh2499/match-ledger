<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Ledger — Football Research Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#11150F; --panel:#171D14; --panel2:#1D2519; --line:#2B3627;
  --ink:#F2F3EA; --ink-dim:#9BAA93; --ink-faint:#66735F;
  --accent:#74B65E; --accent-dim:#3A5227; --amber:#D9A441; --red:#C1443B; --blue:#5B93C9;
  --shadow-1:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 6px 20px -6px rgba(0,0,0,.5);
  --df:'Oswald','Arial Narrow',sans-serif; --bf:'Inter','Helvetica Neue',sans-serif; --mf:'IBM Plex Mono','SF Mono','Menlo',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--bf);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}
a{color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.shell{display:flex;min-height:100vh;}

/* SIDEBAR — a ledger-lined panel: the brand mark and nav sit on faint ruled lines, echoing the
   product's own name ("Ledger"), rather than a flat, undifferentiated dark rectangle. */
.sidebar{
  width:208px;flex-shrink:0;background:#0D110C;border-right:1px solid var(--line);padding:20px 12px;
  background-image:repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(116,182,94,.05) 27px, rgba(116,182,94,.05) 28px);
}
.brand{padding:0 8px 20px 8px;margin-bottom:6px;position:relative;}
.brand::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--accent);box-shadow:0 3px 0 -1.5px var(--line);}
.brand-title{font-family:var(--df);font-size:30px;font-weight:600;letter-spacing:.03em;color:var(--ink);}
.brand-sub{font-family:var(--mf);font-size:16px;color:var(--accent);letter-spacing:.12em;margin-top:3px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;cursor:pointer;margin-bottom:2px;border-left:2px solid transparent;color:var(--accent);font-size:19.5px;transition:background .12s,color .12s;}
.nav-item:hover{background:var(--panel);color:var(--accent);}
.nav-item.active{background:var(--panel2);border-left:2px solid var(--accent);color:var(--accent);font-weight:600;}
.nav-item svg{flex-shrink:0;}
.side-note{margin-top:20px;padding:11px 11px;background:var(--panel);border-radius:6px;border:1px solid var(--line);font-size:14.4px;color:#FFFFFF;font-weight:700;line-height:1.55;}

/* MAIN */
.main{flex:1;min-width:0;padding:24px 30px;max-height:100vh;overflow-y:auto;}
.section-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.section-title{font-family:var(--df);font-size:25px;font-weight:600;color:var(--ink);letter-spacing:.005em;}
.section-sub{font-family:var(--bf);font-size:19px;color:var(--ink-dim);margin-top:4px;}

/* PRIMITIVES */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-1);}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.stat-block{padding:15px 18px;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:7px;transition:border-color .15s;}
.stat-block:hover{border-color:var(--ink-faint);}
.stat-label{font-family:var(--bf);font-size:16.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
.stat-value{font-family:var(--df);font-size:30px;font-weight:600;color:var(--ink);line-height:1.18;font-variant-numeric:tabular-nums;}
.stat-value.accent{color:var(--accent);}
.stat-value.warn{color:var(--amber);}
.stat-value.bad{color:var(--red);}
.stat-sub{font-family:var(--bf);font-size:16.5px;color:var(--ink-dim);margin-top:2px;}
.pill{font-family:var(--mf);font-size:14.5px;padding:3px 8px;border-radius:4px;letter-spacing:.02em;display:inline-block;white-space:nowrap;}
.pill-neutral{background:var(--panel2);color:var(--ink-dim);border:1px solid var(--line);}
.pill-good{background:#1C2A16;color:var(--accent);border:1px solid var(--accent-dim);}
.pill-warn{background:#2E2717;color:var(--amber);border:1px solid #4A3D1F;}
.pill-bad{background:#2E1917;color:var(--red);border:1px solid #4A231F;}
.btn{font-family:var(--bf);font-size:19.5px;font-weight:500;padding:8px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--panel2);color:var(--ink);transition:filter .12s,transform .12s,box-shadow .12s;}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px);box-shadow:var(--shadow-1);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-accent{background:var(--accent);color:#101710;border-color:var(--accent);font-weight:600;}
.btn-accent:hover{box-shadow:0 4px 16px -4px rgba(116,182,94,.5);}
.btn-danger{background:transparent;color:var(--red);border-color:#4A2622;}
.btn-ghost{background:transparent;color:var(--ink-dim);border-color:transparent;}
select,input[type=text],input[type=number],input[type=date],input[type=file]{
  font-family:var(--bf);font-size:19.5px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none;transition:border-color .12s;
}
select:focus,input:focus{border-color:var(--accent);}
optgroup{color:var(--accent);font-weight:600;}
optgroup option{color:var(--ink);font-weight:400;}
label.field-label{font-family:var(--bf);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:4px;}
.field-note{font-family:var(--bf);font-size:16.5px;color:var(--ink-faint);}
.warn-note{font-family:var(--bf);font-size:17px;color:var(--amber);display:flex;align-items:center;gap:5px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.chart-title{font-family:var(--df);font-size:21px;font-weight:500;color:var(--ink);margin-bottom:10px;letter-spacing:.01em;}
.empty-state{padding:40px;text-align:center;color:var(--ink-faint);font-family:var(--bf);font-size:19.5px;border:1px dashed var(--line);border-radius:8px;}

table{border-collapse:collapse;width:100%;}
th{text-align:left;font-family:var(--bf);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);}
td{font-family:var(--mf);font-size:17px;padding:10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top;}
tr.clickable{cursor:pointer;transition:background .1s;}
tr.clickable:hover td{background:var(--panel2);}
.table-scroll{max-height:560px;overflow-y:auto;}
.table-scroll.short{max-height:400px;}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);}
.pager-info{font-family:var(--mf);font-size:16.5px;color:var(--ink-faint);}

.dataset-row-head{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .1s;}
.dataset-row-head:hover{background:var(--panel2);}
.dataset-title{font-family:var(--bf);font-size:20px;font-weight:600;color:var(--ink);}
.dataset-sub{font-family:var(--mf);font-size:16.5px;color:var(--ink-dim);}
.chev{transition:transform .15s;display:inline-block;}
.chev.open{transform:rotate(90deg);}
.report-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;font-family:var(--mf);font-size:18px;}
.report-cell{background:var(--panel2);border-radius:5px;padding:7px 9px;}
.report-cell .rl{color:var(--ink-faint);font-size:15px;}
.report-cell .rv{color:var(--ink);font-size:19.5px;}

.stat-cell{background:var(--panel2);border-radius:5px;padding:8px 10px;}

.toast{position:fixed;top:18px;right:18px;z-index:60;padding:10px 16px;border-radius:7px;border:1px solid var(--line);font-family:var(--bf);font-size:19.5px;max-width:420px;box-shadow:var(--shadow-2);}
.toast-good{background:#1C2A16;color:var(--accent);}
.toast-warn{background:#2E2717;color:var(--amber);}
.toast-bad{background:#2E1917;color:var(--red);}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal-box{width:640px;max-width:92vw;max-height:85vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-family:var(--df);font-size:27px;color:var(--ink);}
.modal-body{padding:20px;}
.close-x{cursor:pointer;color:var(--ink-dim);transition:color .12s;}
.close-x:hover{color:var(--ink);}

.chip-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.chip{display:flex;align-items:center;gap:5px;font-size:16.5px;font-family:var(--mf);color:var(--ink-dim);}
.chip-dot{width:8px;height:8px;border-radius:2px;display:inline-block;}

.svg-chart{width:100%;height:auto;}
/* ===== Auth screen ===== */
#auth-root{
  position:fixed; inset:0; background:var(--bg); z-index:9999;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.auth-card{
  width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; padding:32px 28px;
}
.auth-title{ font-family:var(--df); font-size:26px; color:var(--accent); letter-spacing:0.5px; margin-bottom:4px; }
.auth-sub{ font-family:var(--bf); font-size:14px; color:var(--ink-dim); margin-bottom:22px; }
.auth-field{ margin-bottom:14px; }
.auth-field label{ display:block; font-family:var(--mf); font-size:11px; color:var(--ink-faint); letter-spacing:0.05em; margin-bottom:5px; }
.auth-field input{
  width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
  font-family:var(--bf); font-size:15px; padding:9px 11px; border-radius:4px;
}
.auth-field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.auth-error{ color:var(--red); font-family:var(--bf); font-size:13px; margin-bottom:12px; }
.auth-toggle{ margin-top:18px; text-align:center; font-family:var(--bf); font-size:13px; color:var(--ink-dim); }
.auth-toggle a{ color:var(--accent); cursor:pointer; text-decoration:underline; }
.account-box{ font-family:var(--bf); font-size:13px; color:var(--ink-dim); padding:10px 0; border-top:1px solid var(--line); margin-top:10px; }
.account-box .email{ color:var(--ink); font-size:12px; word-break:break-all; margin-bottom:6px; }
.account-box button{ background:none; border:1px solid var(--line); color:var(--ink-dim); font-family:var(--bf); font-size:12px; padding:5px 10px; border-radius:4px; cursor:pointer; }
.account-box button:hover{ border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<div id="auth-root"></div>
<div class="shell" id="app-shell" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">MATCH LEDGER</div>
      <div class="brand-sub">RESEARCH LAB · v0.2</div>
    </div>
    <div id="nav"></div>
    <div class="side-note">All data stored locally in your browser session. No results are simulated — every figure traces back to an imported CSV row.</div>
    <div class="account-box" id="account-box"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
/* ============================================================================
   ICONS (tiny inline SVGs — no external icon lib)
============================================================================ */
const ICONS = {
  dashboard: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  db: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>',
  search: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  flask: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6L4.5 18a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/></svg>',
  list: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  download: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>',
  trash: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
  warn: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  chev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
  layers: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  info: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>',
  plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  play: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v18l16-9L6 3Z"/></svg>',
  upload: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0-5 5m5-5 5 5M4 21h16"/></svg>',
  calc: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>',
  target: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
};

/* ============================================================================
   STORAGE (personal, per-user — real browser storage, not Claude's window.storage)
   Uses IndexedDB directly so this works as a genuine standalone file opened in any
   real browser (Chrome, Firefox, Safari, Edge) — not just inside a Claude.ai preview,
   where the previous window.storage-based implementation only worked. Falls back to
   localStorage if IndexedDB is unavailable (e.g. very old browsers, strict privacy
   modes), and to an in-memory Map as a last resort so the app never crashes even if
   neither is available — it just won't persist across a reload in that rare case.
============================================================================ */
const MLRL_IDB_NAME = "match_ledger_research_lab";
const MLRL_IDB_STORE = "kv";
const _mlrlMemoryFallback = new Map();
let _mlrlIdbPromise = null;
function openMlrlIDB(){
  if(_mlrlIdbPromise) return _mlrlIdbPromise;
  _mlrlIdbPromise = new Promise((resolve, reject)=>{
    if(typeof indexedDB==="undefined"){ reject(new Error("IndexedDB not available in this browser")); return; }
    const req = indexedDB.open(MLRL_IDB_NAME, 1);
    req.onupgradeneeded = (e)=>{ const db = e.target.result; if(!db.objectStoreNames.contains(MLRL_IDB_STORE)) db.createObjectStore(MLRL_IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _mlrlIdbPromise;
}
async function saveKV(key, value){
  try{
    const db = await openMlrlIDB();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(MLRL_IDB_STORE, "readwrite");
      tx.objectStore(MLRL_IDB_STORE).put(value, key);
      tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error);
    });
    return;
  }catch(e){ console.error("IndexedDB save failed, falling back", key, e); }
  try{ localStorage.setItem("mlrl_"+key, JSON.stringify(value)); return; }
  catch(e2){ console.error("localStorage save also failed, falling back to in-memory only", key, e2); }
  _mlrlMemoryFallback.set(key, value);
}
async function loadKV(key, fallback){
  try{
    const db = await openMlrlIDB();
    const val = await new Promise((resolve,reject)=>{
      const tx = db.transaction(MLRL_IDB_STORE, "readonly");
      const req = tx.objectStore(MLRL_IDB_STORE).get(key);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
    if(val!==undefined) return val;
    return fallback;
  }catch(e){ /* fall through */ }
  try{
    const raw = localStorage.getItem("mlrl_"+key);
    if(raw!==null) return JSON.parse(raw);
  }catch(e2){ /* fall through */ }
  if(_mlrlMemoryFallback.has(key)) return _mlrlMemoryFallback.get(key);
  return fallback;
}

/* ============================================================================
   CSV NORMALIZATION / VALIDATION ENGINE
============================================================================ */
const REQUIRED_FIELDS = ["HomeTeam","AwayTeam","FTHG","FTAG","FTR"];
const KNOWN_FIELDS = ["Div","Date","Time","HomeTeam","AwayTeam","FTHG","FTAG","FTR","HTHG","HTAG","HTR","Referee",
  "HS","AS","HST","AST","HF","AF","HC","AC","HY","AY","HR","AR","B365H","B365D","B365A"];

function parseDateFlexible(raw){
  if(!raw) return {iso:null, raw:"", valid:false};
  const s = String(raw).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    let [,d,mo,y] = m;
    if(y.length===2) y = (parseInt(y,10)<50 ? "20" : "19") + y;
    const iso = `${y.padStart(4,"0")}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;
    const dt = new Date(iso+"T00:00:00");
    if(!isNaN(dt.getTime())) return {iso, raw:s, valid:true};
  }
  const dt2 = new Date(s);
  if(!isNaN(dt2.getTime())) return {iso: dt2.toISOString().slice(0,10), raw:s, valid:true};
  return {iso:null, raw:s, valid:false};
}
function isNum(v){ return v!==undefined && v!==null && v!=="" && !isNaN(Number(v)); }
function expectedFTR(h,a){ return h>a ? "H" : h<a ? "A" : "D"; }
// picks the first numeric value found among candidate column names, in priority order
function pickOdds(row, candidates){ for(const k of candidates){ if(isNum(row[k])) return Number(row[k]); } return null; }

function normalizeRow(row, idx, meta){
  const issues = [];
  const home = (row.HomeTeam||"").trim();
  const away = (row.AwayTeam||"").trim();
  const dateInfo = parseDateFlexible(row.Date);

  for(const f of REQUIRED_FIELDS){
    if(row[f]===undefined||row[f]===null||String(row[f]).trim()===""){
      issues.push({code:"MISSING_FIELD", field:f, message:`Required field ${f} is missing`});
    }
  }
  if(home && away && home===away) issues.push({code:"INVALID_TEAMS", message:"HomeTeam and AwayTeam are identical"});
  if(row.Date && !dateInfo.valid) issues.push({code:"INVALID_DATE", message:`Date "${row.Date}" could not be parsed`});

  const fthg = isNum(row.FTHG) ? Number(row.FTHG) : null;
  const ftag = isNum(row.FTAG) ? Number(row.FTAG) : null;
  if(row.FTHG!==undefined && row.FTHG!=="" && !isNum(row.FTHG)) issues.push({code:"NON_NUMERIC", field:"FTHG", message:"FTHG is not numeric"});
  if(row.FTAG!==undefined && row.FTAG!=="" && !isNum(row.FTAG)) issues.push({code:"NON_NUMERIC", field:"FTAG", message:"FTAG is not numeric"});
  if(fthg!==null && fthg<0) issues.push({code:"NEGATIVE_GOALS", field:"FTHG", message:"Negative goal count"});
  if(ftag!==null && ftag<0) issues.push({code:"NEGATIVE_GOALS", field:"FTAG", message:"Negative goal count"});

  let resultConflict = false;
  if(fthg!==null && ftag!==null && row.FTR){
    const exp = expectedFTR(fthg, ftag);
    if(String(row.FTR).trim().toUpperCase()!==exp){
      resultConflict = true;
      issues.push({code:"RESULT_CONFLICT", message:`FTR="${row.FTR}" conflicts with FTHG=${fthg}, FTAG=${ftag} (expected ${exp})`});
    }
  }
  for(const of_ of ["B365H","B365D","B365A"]){
    if(row[of_]!==undefined && row[of_]!==""){
      if(!isNum(row[of_])) issues.push({code:"NON_NUMERIC", field:of_, message:`${of_} is not numeric`});
      else if(Number(row[of_])<=0) issues.push({code:"INVALID_ODDS", field:of_, message:`${of_} must be greater than zero`});
    }
  }
  const fatal = issues.some(i => ["MISSING_FIELD","INVALID_TEAMS"].includes(i.code));

  return {
    match_id: `${meta.importId}_${idx}`, import_id: meta.importId,
    source_file: meta.filename, source_row: idx+2,
    league: meta.league, season: meta.season,
    date: dateInfo.valid ? dateInfo.iso : null, date_raw: row.Date || null, time: row.Time || null,
    home_team: home, away_team: away,
    home_goals: fthg, away_goals: ftag,
    full_time_result: row.FTR ? String(row.FTR).trim().toUpperCase() : null,
    half_time_goals: (isNum(row.HTHG) && isNum(row.HTAG)) ? `${row.HTHG}-${row.HTAG}` : null,
    half_time_result: row.HTR || null, referee: row.Referee || null,
    home_shots: isNum(row.HS)?Number(row.HS):null, away_shots: isNum(row.AS)?Number(row.AS):null,
    home_shots_on_target: isNum(row.HST)?Number(row.HST):null, away_shots_on_target: isNum(row.AST)?Number(row.AST):null,
    home_fouls: isNum(row.HF)?Number(row.HF):null, away_fouls: isNum(row.AF)?Number(row.AF):null,
    home_corners: isNum(row.HC)?Number(row.HC):null, away_corners: isNum(row.AC)?Number(row.AC):null,
    home_yellow: isNum(row.HY)?Number(row.HY):null, away_yellow: isNum(row.AY)?Number(row.AY):null,
    home_red: isNum(row.HR)?Number(row.HR):null, away_red: isNum(row.AR)?Number(row.AR):null,
    odds_B365H: isNum(row.B365H)?Number(row.B365H):null, odds_B365D: isNum(row.B365D)?Number(row.B365D):null, odds_B365A: isNum(row.B365A)?Number(row.B365A):null,
    odds_available: isNum(row.B365H) && isNum(row.B365D) && isNum(row.B365A),
    // Opening/closing odds across 1X2, Over/Under 2.5, and Asian Handicap —
    // priority: Bet365 > Pinnacle > Market Average, per football-data.co.uk's own convention
    // (closing = same bookmaker code with "C" inserted, e.g. B365H -> B365CH).
    odds_open: {
      H: pickOdds(row, ["B365H","PSH","PH","AvgH"]),
      D: pickOdds(row, ["B365D","PSD","PD","AvgD"]),
      A: pickOdds(row, ["B365A","PSA","PA","AvgA"]),
      Over25: pickOdds(row, ["B365>2.5","P>2.5","Avg>2.5"]),
      Under25: pickOdds(row, ["B365<2.5","P<2.5","Avg<2.5"]),
      AHH: pickOdds(row, ["B365AHH","PAHH","AvgAHH"]),
      AHA: pickOdds(row, ["B365AHA","PAHA","AvgAHA"]),
    },
    odds_close: {
      H: pickOdds(row, ["B365CH","PSCH","AvgCH"]),
      D: pickOdds(row, ["B365CD","PSCD","AvgCD"]),
      A: pickOdds(row, ["B365CA","PSCA","AvgCA"]),
      Over25: pickOdds(row, ["B365C>2.5","PC>2.5","AvgC>2.5"]),
      Under25: pickOdds(row, ["B365C<2.5","PC<2.5","AvgC<2.5"]),
      AHH: pickOdds(row, ["B365CAHH","AvgCAHH"]),
      AHA: pickOdds(row, ["B365CAHA","AvgCAHA"]),
    },
    // Football-Data.co.uk publishes one Asian Handicap line per match (AHh), not
    // separate opening/closing lines — only the price moves, per their notes.txt.
    ah_line: pickOdds(row, ["AHh","B365AH"]),
    raw: row, issues, result_conflict: resultConflict, invalid: fatal,
    quality: fatal ? "INVALID" : resultConflict ? "CONFLICT" : (issues.length>0 ? "PARTIAL" : "COMPLETE"),
  };
}
function detectColumns(fields){
  const missingRequired = REQUIRED_FIELDS.filter(f => !fields.includes(f));
  return {missingRequired, hasOdds: ["B365H","B365D","B365A"].every(f => fields.includes(f))};
}

// Combines two REAL observed bookmaker prices into the single "effective odds" a customer
// would get by backing both outcomes in the correct dutching proportions (equal profit
// whichever of the two occurs) — the standard, real-price way to construct a "lay X" or
// "double chance" position without genuine exchange lay data. Not identical to a true
// exchange lay (no commission modeled, and it inherits this bookmaker's built-in margin on
// both legs), which is disclosed in the market's own label/description in the UI.
function dutchTwoOutcomes(oddsA, oddsB){
  if(oddsA===null || oddsA===undefined || oddsB===null || oddsB===undefined || oddsA<=1 || oddsB<=1) return null;
  return 1/(1/oddsA + 1/oddsB);
}

// At least 10 past seasons + 5 future seasons, always computed relative to today rather than
// hard-coded, so this list never goes stale. A season "starting" in July or later of a given
// year is treated as that year's season (matches how football-data.co.uk itself labels seasons).
function buildFootballSeasonOptions(now = new Date()){
  const label = y => `${y}/${String(y+1).slice(-2)}`;
  const currentStartYear = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
  const past = [];
  for(let y = currentStartYear; y >= currentStartYear - 10; y--) past.push(label(y));
  const future = [];
  for(let y = currentStartYear + 1; y <= currentStartYear + 5; y++) future.push(label(y));
  return { past, future, current: label(currentStartYear) };
}

// Builds the exact real download URL football-data.co.uk uses for a given league+season, per
// their own documented URL pattern (confirmed against real fetched examples, not guessed):
// https://www.football-data.co.uk/mmz4281/{2-digit-start-year}{2-digit-end-year}/{code}.csv
// Only supported for "main" leagues (one file per season) — the "extra" leagues publish a single
// all-seasons file at a URL shape this app hasn't independently confirmed, so those return null
// rather than risk pointing at a made-up address.
function getFootballDataDownloadUrl(leagueName, season){
  const league = FOOTBALL_DATA_LEAGUES.main.find(l=>l.name===leagueName);
  if(!league) return null;
  const m = /^(\d{4})\/(\d{2})$/.exec(season||"");
  if(!m) return null;
  const seasonCode = m[1].slice(2) + m[2]; // "2025/26" -> "2526"
  return `https://www.football-data.co.uk/mmz4281/${seasonCode}/${league.code}.csv`;
}

// Shared by both the manual file-upload path (doImport) and the automatic refresh path
// (refreshDataset) so the two never quietly drift into different validation/counting behavior.
function buildDatasetFromCsvResults(results, filename, league, season, existingId){
  const fields = results.meta.fields || [];
  const colCheck = detectColumns(fields);
  const importId = "imp_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const seen = new Set();
  let dup=0, invalidCount=0, conflictCount=0, missingHome=0, missingAway=0, missingFTR=0, missingFTHG=0, missingFTAG=0;
  const matches = results.data.map((row, idx)=>{
    const m = normalizeRow(row, idx, {importId, filename, league, season});
    const key = `${m.date_raw}|${m.home_team}|${m.away_team}`;
    if(seen.has(key)){ m.duplicate=true; dup++; } else seen.add(key);
    if(m.invalid) invalidCount++;
    if(m.result_conflict) conflictCount++;
    if(!row.HomeTeam) missingHome++;
    if(!row.AwayTeam) missingAway++;
    if(!row.FTR) missingFTR++;
    if(row.FTHG===undefined||row.FTHG==="") missingFTHG++;
    if(row.FTAG===undefined||row.FTAG==="") missingFTAG++;
    return m;
  });
  const report = {
    filename, rows:results.data.length, validRows: matches.length-invalidCount-dup,
    duplicateRows:dup, invalidRows:invalidCount, conflictRows:conflictCount,
    missingHome, missingAway, missingFTR, missingFTHG, missingFTAG,
    missingRequiredColumns: colCheck.missingRequired, oddsAvailable: colCheck.hasOdds,
    importedAt: new Date().toISOString(),
  };
  return { id: existingId || importId, filename, league, season, importedAt:report.importedAt, report, matches };
}

function evaluateBet(match, marketId){
  const h = match.home_goals, a = match.away_goals, ftr = match.full_time_result;
  if(h===null || a===null || !ftr || match.invalid || match.result_conflict){
    return {won:null, oddsUsed:null, reason:"OUTCOME_UNAVAILABLE"};
  }
  const total = h+a;
  switch(marketId){
    case "HOME_WIN": return {won: ftr==="H", oddsUsed: match.odds_B365H, needsOdds:true};
    case "DRAW": return {won: ftr==="D", oddsUsed: match.odds_B365D, needsOdds:true};
    case "AWAY_WIN": return {won: ftr==="A", oddsUsed: match.odds_B365A, needsOdds:true};
    case "HOME_WIN_CLOSE": return {won: ftr==="H", oddsUsed: match.odds_close.H, needsOdds:true};
    case "DRAW_CLOSE": return {won: ftr==="D", oddsUsed: match.odds_close.D, needsOdds:true};
    case "AWAY_WIN_CLOSE": return {won: ftr==="A", oddsUsed: match.odds_close.A, needsOdds:true};
    case "OVER_2_5": return {won: total>2.5, oddsUsed: match.odds_open.Over25, needsOdds:true};
    case "UNDER_2_5": return {won: total<2.5, oddsUsed: match.odds_open.Under25, needsOdds:true};
    case "OVER_2_5_CLOSE": return {won: total>2.5, oddsUsed: match.odds_close.Over25, needsOdds:true};
    case "UNDER_2_5_CLOSE": return {won: total<2.5, oddsUsed: match.odds_close.Under25, needsOdds:true};
    case "AH_HOME": case "AH_HOME_CLOSE": case "AH_AWAY": case "AH_AWAY_CLOSE": {
      const close = marketId.endsWith("_CLOSE");
      const side = marketId.startsWith("AH_HOME") ? "H" : "A";
      const oddsUsed = close ? (side==="H"?match.odds_close.AHH:match.odds_close.AHA) : (side==="H"?match.odds_open.AHH:match.odds_open.AHA);
      if(match.ah_line===null || match.ah_line===undefined || oddsUsed===null || oddsUsed===undefined) return {won:null, oddsUsed:null, needsOdds:true, reason:"ODDS_UNAVAILABLE"};
      // Same side/line/goalDiff convention already established and tested in the Largest
      // Percentage Drop strategy's AH settlement — line is flipped for the away side, and
      // goalDiff is computed from that side's own perspective, then handed to the existing
      // settleAH() for real win/push/half-win/half-loss settlement (not duplicated here).
      const line = side==="H" ? match.ah_line : -match.ah_line;
      const goalDiff = side==="H" ? (h-a) : (a-h);
      return {won:false, oddsUsed, needsOdds:true, isAH:true, ahLine:line, ahGoalDiff:goalDiff};
    }
    case "FAVOURITE": case "UNDERDOG": {
      const legs = [{side:"H", odds:match.odds_B365H}, {side:"D", odds:match.odds_B365D}, {side:"A", odds:match.odds_B365A}].filter(l=>l.odds!==null && l.odds!==undefined && l.odds>1);
      if(legs.length<3) return {won:null, oddsUsed:null, needsOdds:true, reason:"ODDS_UNAVAILABLE"};
      const sorted = [...legs].sort((x,y)=>x.odds-y.odds);
      const pick = marketId==="FAVOURITE" ? sorted[0] : sorted[sorted.length-1];
      return {won: ftr===pick.side, oddsUsed: pick.odds, needsOdds:true};
    }
    case "DOUBLE_CHANCE_1X": {
      const combined = dutchTwoOutcomes(match.odds_B365H, match.odds_B365D);
      if(combined===null) return {won:null, oddsUsed:null, needsOdds:true, reason:"ODDS_UNAVAILABLE"};
      return {won: ftr==="H"||ftr==="D", oddsUsed: combined, needsOdds:true};
    }
    case "DOUBLE_CHANCE_X2": {
      const combined = dutchTwoOutcomes(match.odds_B365D, match.odds_B365A);
      if(combined===null) return {won:null, oddsUsed:null, needsOdds:true, reason:"ODDS_UNAVAILABLE"};
      return {won: ftr==="D"||ftr==="A", oddsUsed: combined, needsOdds:true};
    }
    case "DOUBLE_CHANCE_12": {
      const combined = dutchTwoOutcomes(match.odds_B365H, match.odds_B365A);
      if(combined===null) return {won:null, oddsUsed:null, needsOdds:true, reason:"ODDS_UNAVAILABLE"};
      return {won: ftr==="H"||ftr==="A", oddsUsed: combined, needsOdds:true};
    }
    case "LAY_FAVOURITE": {
      const legs = [{side:"H", odds:match.odds_B365H}, {side:"D", odds:match.odds_B365D}, {side:"A", odds:match.odds_B365A}].filter(l=>l.odds!==null && l.odds!==undefined && l.odds>1);
      if(legs.length<3) return {won:null, oddsUsed:null, needsOdds:true, reason:"ODDS_UNAVAILABLE"};
      const sorted = [...legs].sort((x,y)=>x.odds-y.odds);
      const favSide = sorted[0].side;
      const others = legs.filter(l=>l.side!==favSide);
      const combined = dutchTwoOutcomes(others[0].odds, others[1].odds);
      if(combined===null) return {won:null, oddsUsed:null, needsOdds:true, reason:"ODDS_UNAVAILABLE"};
      return {won: ftr!==favSide, oddsUsed: combined, needsOdds:true};
    }
    case "BTTS_YES": return {won: h>0 && a>0, oddsUsed:null, needsOdds:false};
    case "BTTS_NO": return {won: !(h>0 && a>0), oddsUsed:null, needsOdds:false};
    case "OVER_1_5": return {won: total>1.5, oddsUsed:null, needsOdds:false};
    case "UNDER_1_5": return {won: total<1.5, oddsUsed:null, needsOdds:false};
    case "OVER_3_5": return {won: total>3.5, oddsUsed:null, needsOdds:false};
    case "UNDER_3_5": return {won: total<3.5, oddsUsed:null, needsOdds:false};
    case "OVER_4_5": return {won: total>4.5, oddsUsed:null, needsOdds:false};
    case "UNDER_4_5": return {won: total<4.5, oddsUsed:null, needsOdds:false};
    default: return {won:null, oddsUsed:null, reason:"UNKNOWN_MARKET"};
  }
}

function createStakingEngine(planId, params, baseUnit){
  const state = {
    bankroll: Number(params.startingBankroll) || 100,
    martingaleStep: 0, fibIndex: 0, fibSeq: [1,1], dalembertUnits: 1,
    labSeq: (params.labSequence ? String(params.labSequence).split(",").map(s=>Number(s.trim())).filter(n=>!isNaN(n)) : null) || [1,2,3,4],
    labSeqStart: (params.labSequence ? String(params.labSequence).split(",").map(s=>Number(s.trim())).filter(n=>!isNaN(n)) : null) || [1,2,3,4],
    paroliStep: 0, step326: 0, step12468_12: 0, wins12468_12InCycle: 0, step1to8: 0, targetRecoveryPending: null, lossLadderUnits: 1,
    lastLossAmount: 0,
  };
  function eligible(odds){
    if(planId==="ONE_2_4_6_8_12") return odds!==null && odds!==undefined && odds>2.5;
    return true;
  }
  function stakeFor(odds){
    switch(planId){
      case "FLAT": return baseUnit;
      case "PERCENT": return Math.max(0, state.bankroll * ((Number(params.percent)||0)/100));
      case "KELLY": {
        if(!odds || odds<=1) return baseUnit;
        const b = odds-1, impliedP = 1/odds, edge = (Number(params.kellyEdge)||0)/100;
        const p = Math.min(0.99, Math.max(0.01, impliedP+edge)), q = 1-p;
        const fullKelly = Math.max(0, (b*p-q)/b), frac = Number(params.kellyFraction)||0.5;
        return Math.max(0, state.bankroll*fullKelly*frac);
      }
      case "MARTINGALE": { const cap = Number(params.martingaleCap)||6; return baseUnit*Math.pow(2, Math.min(state.martingaleStep, cap)); }
      case "FIBONACCI": { while(state.fibSeq.length<=state.fibIndex+1) state.fibSeq.push(state.fibSeq[state.fibSeq.length-1]+state.fibSeq[state.fibSeq.length-2]); return baseUnit*state.fibSeq[state.fibIndex]; }
      case "DALEMBERT": return baseUnit*state.dalembertUnits;
      case "LABOUCHERE": {
        if(state.labSeq.length===0) state.labSeq = [...state.labSeqStart];
        if(state.labSeq.length===1) return baseUnit*state.labSeq[0];
        return baseUnit*(state.labSeq[0]+state.labSeq[state.labSeq.length-1]);
      }
      case "PAROLI": return baseUnit*Math.pow(2, state.paroliStep);
      case "ONE_3_2_6": { const seq=[1,3,2,6]; return baseUnit*seq[state.step326%4]; }
      case "ONE_2_4_6_8_12": { const seq=[1,2,4,6,8,12]; return baseUnit*seq[Math.min(state.step12468_12, seq.length-1)]; }
      case "ONE_TO_EIGHT": return baseUnit*(1+state.step1to8);
      case "TARGET_PROFIT_RECOVERY": {
        if(!odds || odds<=1) return baseUnit;
        const targetPct = Number(params.targetProfitPct)||0.5;
        const requiredProfit = state.targetRecoveryPending!==null ? state.targetRecoveryPending : Math.max(0.01, state.bankroll*(targetPct/100));
        const rawStake = requiredProfit/(odds-1);
        const cap = baseUnit*(Number(params.targetRecoveryCap)||50);
        return Math.min(rawStake, cap);
      }
      case "LOSS_LADDER": return baseUnit*state.lossLadderUnits;
      case "PERCENT_LOSS_RECOVERY": {
        // Faithful to the source: base stake = percent% of CURRENT bank. After a loss, add a
        // recovery portion sized so that winning this bet returns the amount lost last time
        // (lastLossAmount / odds), on top of the normal base stake — not a full doubling, but
        // still a Martingale-style escalation. This intentionally does NOT compound across
        // multiple consecutive losses (matches the source material exactly) — the source's own
        // warning is that a SECOND loss in a row still hits hard even without full compounding.
        const pct = (Number(params.percent)||2.5)/100;
        const baseStake = Math.max(0, state.bankroll*pct);
        if(state.lastLossAmount>0 && odds && odds>1){
          const recoveryPart = state.lastLossAmount/odds;
          return recoveryPart + baseStake;
        }
        return baseStake;
      }
      default: return baseUnit;
    }
  }
  function settle(won, pnlUnits){
    state.bankroll += pnlUnits;
    switch(planId){
      case "MARTINGALE": state.martingaleStep = won?0:state.martingaleStep+1; break;
      case "FIBONACCI": state.fibIndex = won?Math.max(0,state.fibIndex-2):state.fibIndex+1; break;
      case "DALEMBERT": state.dalembertUnits = won?Math.max(1,state.dalembertUnits-1):state.dalembertUnits+1; break;
      case "LABOUCHERE":
        if(won){ state.labSeq = state.labSeq.length<=2 ? [] : state.labSeq.slice(1,-1); }
        else{ const add = state.labSeq.length===1 ? state.labSeq[0] : (state.labSeq[0]+state.labSeq[state.labSeq.length-1]); state.labSeq.push(add); }
        break;
      case "PAROLI":
        if(won){ state.paroliStep++; if(state.paroliStep>=(Number(params.paroliWinsBeforeReset)||3)) state.paroliStep=0; }
        else state.paroliStep = 0;
        break;
      case "ONE_3_2_6": state.step326 = won ? (state.step326+1)%4 : 0; break;
      case "ONE_2_4_6_8_12":
        if(won){ state.wins12468_12InCycle++; if(state.wins12468_12InCycle>=2){ state.step12468_12=0; state.wins12468_12InCycle=0; } }
        else{ state.step12468_12 = Math.min(state.step12468_12+1,5); state.wins12468_12InCycle=0; }
        break;
      case "ONE_TO_EIGHT": state.step1to8 = won ? 0 : Math.min(state.step1to8+1,7); break;
      case "TARGET_PROFIT_RECOVERY":
        if(won){ state.targetRecoveryPending = null; }
        else{
          const targetPct = Number(params.targetProfitPct)||0.5;
          const currentRequired = state.targetRecoveryPending!==null ? state.targetRecoveryPending : Math.max(0.01, state.bankroll*(targetPct/100));
          state.targetRecoveryPending = currentRequired + (-pnlUnits); // add the lost stake to the next required profit
        }
        break;
      case "LOSS_LADDER": state.lossLadderUnits = won ? 1 : state.lossLadderUnits+1; break;
      case "PERCENT_LOSS_RECOVERY": state.lastLossAmount = won ? 0 : (-pnlUnits); break;
      default: break;
    }
  }
  return {eligible, stakeFor, settle, getBankroll: ()=>state.bankroll};
}

function runResearch(matches, config){
  const inScope = matches.filter(m=>{
    if(config.league && config.league!=="ALL" && m.league!==config.league) return false;
    if(config.season && config.season!=="ALL" && m.season!==config.season) return false;
    if(config.team && config.team!=="ALL" && m.home_team!==config.team && m.away_team!==config.team) return false;
    if(config.dateFrom && m.date && m.date<config.dateFrom) return false;
    if(config.dateTo && m.date && m.date>config.dateTo) return false;
    return true;
  }).slice().sort((a,b)=>(a.date||"9999-99-99").localeCompare(b.date||"9999-99-99"));

  const marketDef = MARKETS.find(mk=>mk.id===config.market);
  const stakingApplies = marketDef && marketDef.usesOdds;
  const baseUnit = Number(config.stake)||1;
  const plan = config.stakingPlan || "FLAT";
  const engine = createStakingEngine(stakingApplies?plan:"FLAT", config.stakingParams||{}, baseUnit);

  const ledger = [];
  let cumulative=0, peak=0, trough=0, maxDrawdown=0;
  let qualified=0, excluded=0, missing=0, wins=0, losses=0, pushes=0;
  const oddsSeen = [];

  for(const m of inScope){
    const evalRes = evaluateBet(m, config.market);
    let entry = {
      run_market: config.market, staking_plan: stakingApplies ? plan : "N/A (no historical odds for this market)",
      match_id: m.match_id, date: m.date, league: m.league, season: m.season,
      home_team: m.home_team, away_team: m.away_team,
      score: (m.home_goals!==null && m.away_goals!==null) ? `${m.home_goals}-${m.away_goals}` : "N/A",
      actual_result: m.full_time_result || "N/A", data_quality: m.quality,
      source_file: m.source_file, source_row: m.source_row,
    };
    if(evalRes.won===null){
      missing++;
      ledger.push({...entry, qualified_status:"MISSING_DATA", stake_units:0, units:0, cumulative_units:cumulative, bankroll:engine.getBankroll(), notes:evalRes.reason});
      continue;
    }
    const needsOdds = evalRes.needsOdds;
    const hasOdds = evalRes.oddsUsed!==null && evalRes.oddsUsed!==undefined;
    if(needsOdds && !hasOdds){
      excluded++;
      ledger.push({...entry, qualified_status:"ODDS_UNAVAILABLE", stake_units:0, units:0, cumulative_units:cumulative, bankroll:engine.getBankroll(), notes:"Historical odds not present in source data — excluded from unit calculation"});
      continue;
    }
    if(needsOdds && stakingApplies && !engine.eligible(evalRes.oddsUsed)){
      excluded++;
      ledger.push({...entry, qualified_status:"PLAN_ODDS_REQUIREMENT_NOT_MET", stake_units:0, units:0, cumulative_units:cumulative, bankroll:engine.getBankroll(), notes:`Staking plan "${plan}" requires odds > 2.50 for this bet to make sense — skipped, sequence unchanged`});
      continue;
    }
    qualified++;
    let units=0, stakeUsed=0, note="", resultLabel=null; // "WIN" | "LOSS" | "PUSH" | "HALF"
    if(needsOdds){
      oddsSeen.push(evalRes.oddsUsed);
      stakeUsed = stakingApplies ? engine.stakeFor(evalRes.oddsUsed) : baseUnit;
      if(evalRes.isAH){
        // Real Asian Handicap settlement (win/push/half-win/half-loss on quarter lines) —
        // reuses the same settleAH() already used and tested by the Largest Drop strategy.
        const r = settleAH(evalRes.ahLine, evalRes.ahGoalDiff, stakeUsed, evalRes.oddsUsed);
        units = r.pnl; resultLabel = r.state;
        if(stakingApplies && resultLabel!=="PUSH") engine.settle(resultLabel==="WIN" || (resultLabel==="HALF" && units>0), units);
        note = resultLabel==="PUSH" ? `Push — stake returned (staked ${stakeUsed.toFixed(2)}u)`
          : resultLabel==="HALF" ? `Half win/loss on a quarter handicap line (net ${units>=0?"+":""}${units.toFixed(2)}u, staked ${stakeUsed.toFixed(2)}u, plan: ${plan})`
          : resultLabel==="WIN" ? `Won @ ${evalRes.oddsUsed} (staked ${stakeUsed.toFixed(2)}u, plan: ${plan})`
          : `Lost (staked ${stakeUsed.toFixed(2)}u, plan: ${plan})`;
      } else {
        units = evalRes.won ? (evalRes.oddsUsed-1)*stakeUsed : -stakeUsed;
        resultLabel = evalRes.won ? "WIN" : "LOSS";
        if(stakingApplies) engine.settle(evalRes.won, units);
        note = evalRes.won ? `Won @ ${evalRes.oddsUsed} (staked ${stakeUsed.toFixed(2)}u, plan: ${plan})` : `Lost (staked ${stakeUsed.toFixed(2)}u, plan: ${plan})`;
      }
    } else {
      units = 0;
      resultLabel = evalRes.won ? "WIN" : "LOSS";
      note = "No unit P&L — market has no historical odds column in source data; staking plans do not apply";
    }
    if(resultLabel==="WIN") wins++;
    else if(resultLabel==="LOSS") losses++;
    else if(resultLabel==="PUSH") pushes++;
    else { if(units>0) wins++; else if(units<0) losses++; else pushes++; } // HALF with net-zero (rare) counts as a push
    cumulative += units;
    peak = Math.max(peak, cumulative);
    trough = Math.min(trough, cumulative);
    maxDrawdown = Math.min(maxDrawdown, cumulative-peak);
    ledger.push({...entry, qualified_status:"QUALIFIED", won: resultLabel==="WIN" ? true : resultLabel==="LOSS" ? false : resultLabel, odds_used: evalRes.oddsUsed ?? "N/A",
      stake_units: Number(stakeUsed.toFixed(4)), units: Number(units.toFixed(4)), cumulative_units: Number(cumulative.toFixed(4)),
      bankroll: Number(engine.getBankroll().toFixed(4)), notes: note});
  }
  const avgOdds = oddsSeen.length ? oddsSeen.reduce((a,b)=>a+b,0)/oddsSeen.length : null;
  return {
    scopeCount: inScope.length, qualified, excluded, missing, wins, losses, pushes,
    finalUnits: Number(cumulative.toFixed(4)), maxDrawdown: Number(maxDrawdown.toFixed(4)),
    peakUnits: Number(peak.toFixed(4)), lowestUnits: Number(trough.toFixed(4)), avgOdds,
    stakingPlan: stakingApplies ? plan : "N/A", ledger,
  };
}

/* ============================================================================
   ASIAN HANDICAP SETTLEMENT (with quarter-line splitting + pushes)
   Standard, well-documented AH mechanics — not fabricated. A quarter line
   (e.g. -0.25, -0.75) is two adjacent half/whole lines, each settled on half
   the stake; whole/half lines settle as a single bet with pushes at exactly 0.
============================================================================ */
function settleWholeOrHalfAH(line, goalDiff, stakePortion, odds){
  const adjusted = goalDiff + line;
  if(adjusted > 0) return { pnl: stakePortion*(odds-1), state: "WIN" };
  if(adjusted < 0) return { pnl: -stakePortion, state: "LOSS" };
  return { pnl: 0, state: "PUSH" };
}
function settleAH(line, goalDiff, stake, odds){
  const isQuarter = Math.abs((line*2) % 1) !== 0; // *2 not integer => quarter line (e.g. -0.25, -0.75)
  if(isQuarter){
    const lower = Math.floor(line*2)/2;
    const upper = lower + 0.5;
    const r1 = settleWholeOrHalfAH(lower, goalDiff, stake/2, odds);
    const r2 = settleWholeOrHalfAH(upper, goalDiff, stake/2, odds);
    const pnl = r1.pnl + r2.pnl;
    const state = (r1.state==="WIN"&&r2.state==="WIN") ? "WIN" : (r1.state==="LOSS"&&r2.state==="LOSS") ? "LOSS" : (r1.state==="PUSH"&&r2.state==="PUSH") ? "PUSH" : "HALF";
    return { pnl, state };
  }
  return settleWholeOrHalfAH(line, goalDiff, stake, odds);
}

/* ============================================================================
   STRATEGY MODULE: #1 — LARGEST PERCENTAGE DROP
   Spans 1X2, Over/Under 2.5, and Asian Handicap in one evaluation per match.
   Selects the single outcome with the largest opening->closing odds drop,
   requires drop >= threshold and closing odds >= price floor, then settles
   against the actual recorded result. No exclusions beyond those two rules.
============================================================================ */
function evaluateLargestDropStrategy(matches, params){
  const inScope = matches.filter(m=>{
    if(params.league && params.league!=="ALL" && m.league!==params.league) return false;
    if(params.season && params.season!=="ALL" && m.season!==params.season) return false;
    if(params.dateFrom && m.date && m.date<params.dateFrom) return false;
    if(params.dateTo && m.date && m.date>params.dateTo) return false;
    return true;
  }).slice().sort((a,b)=>(a.date||"9999-99-99").localeCompare(b.date||"9999-99-99"));

  const threshold = Number(params.threshold)||10;
  const priceFloor = Number(params.priceFloor)||1.5;
  const stake = Number(params.stake)||10;

  const ledger = [];
  let cumulative=0, peak=0, trough=0, maxDrawdown=0;
  let qualified=0, notTriggered=0, priceExcluded=0, missing=0, wins=0, losses=0, pushes=0;
  const byMarket = { "1X2":{bets:0,pnl:0,wins:0,losses:0}, "O/U 2.5":{bets:0,pnl:0,wins:0,losses:0}, "AH":{bets:0,pnl:0,wins:0,losses:0} };
  const weekMap = {};

  for(const m of inScope){
    const base = {
      match_id:m.match_id, date:m.date, league:m.league, season:m.season,
      home_team:m.home_team, away_team:m.away_team,
      score:(m.home_goals!==null&&m.away_goals!==null)?`${m.home_goals}-${m.away_goals}`:"N/A",
      actual_result:m.full_time_result||"N/A", source_file:m.source_file, source_row:m.source_row,
    };
    if(m.home_goals===null || m.away_goals===null || !m.full_time_result || m.invalid || m.result_conflict){
      missing++;
      ledger.push({...base, market:"N/A", selection:"N/A", open_odds:"N/A", close_odds:"N/A", drop_pct:"N/A", status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Outcome unavailable in source data"});
      continue;
    }

    const candidates = [];
    const add = (market, selection, open, close, extra) => {
      if(open===null || close===null || open<=0 || close<=0) return;
      const dropPct = ((open-close)/open)*100;
      candidates.push({market, selection, open, close, dropPct, extra});
    };
    add("1X2","Home", m.odds_open.H, m.odds_close.H);
    add("1X2","Draw", m.odds_open.D, m.odds_close.D);
    add("1X2","Away", m.odds_open.A, m.odds_close.A);
    add("O/U 2.5","Over 2.5", m.odds_open.Over25, m.odds_close.Over25);
    add("O/U 2.5","Under 2.5", m.odds_open.Under25, m.odds_close.Under25);
    if(m.ah_line!==null){
      add("AH", `Home (${m.ah_line>0?'+':''}${m.ah_line})`, m.odds_open.AHH, m.odds_close.AHH, {side:"H", line:m.ah_line});
      add("AH", `Away (${-m.ah_line>0?'+':''}${-m.ah_line})`, m.odds_open.AHA, m.odds_close.AHA, {side:"A", line:-m.ah_line});
    }

    if(candidates.length===0){
      missing++;
      ledger.push({...base, market:"N/A", selection:"N/A", open_odds:"N/A", close_odds:"N/A", drop_pct:"N/A", status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"No opening/closing odds columns present for this match — needs football-data.co.uk's extended odds file"});
      continue;
    }
    const drops = candidates.filter(c=>c.dropPct>0).sort((a,b)=>b.dropPct-a.dropPct);
    if(drops.length===0){
      notTriggered++;
      ledger.push({...base, market:"N/A", selection:"N/A", open_odds:"N/A", close_odds:"N/A", drop_pct:0, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"No selection drifted downward from open to close"});
      continue;
    }
    const best = drops[0];
    if(best.dropPct < threshold){
      notTriggered++;
      ledger.push({...base, market:best.market, selection:best.selection, open_odds:best.open, close_odds:best.close, drop_pct:Number(best.dropPct.toFixed(2)), status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Largest drop ${best.dropPct.toFixed(2)}% below ${threshold}% threshold`});
      continue;
    }
    if(best.close < priceFloor){
      priceExcluded++;
      ledger.push({...base, market:best.market, selection:best.selection, open_odds:best.open, close_odds:best.close, drop_pct:Number(best.dropPct.toFixed(2)), status:"PRICE_FLOOR_EXCLUDED", pnl:0, cumulative_units:cumulative, notes:`Closing odds ${best.close} below floor of ${priceFloor}`});
      continue;
    }

    // Settle against actual result
    let pnl = 0, state = "LOSS";
    if(best.market==="1X2"){
      const won = (best.selection==="Home" && m.full_time_result==="H") || (best.selection==="Draw" && m.full_time_result==="D") || (best.selection==="Away" && m.full_time_result==="A");
      state = won ? "WIN" : "LOSS";
      pnl = won ? stake*(best.close-1) : -stake;
    } else if(best.market==="O/U 2.5"){
      const totalGoals = m.home_goals + m.away_goals;
      const won = best.selection.startsWith("Over") ? totalGoals>2.5 : totalGoals<2.5;
      state = won ? "WIN" : "LOSS";
      pnl = won ? stake*(best.close-1) : -stake;
    } else if(best.market==="AH"){
      const goalDiff = best.extra.side==="H" ? (m.home_goals-m.away_goals) : (m.away_goals-m.home_goals);
      const r = settleAH(best.extra.line, goalDiff, stake, best.close);
      pnl = r.pnl; state = r.state;
    }

    qualified++;
    if(state==="WIN") wins++; else if(state==="LOSS") losses++; else pushes++;
    cumulative += pnl; peak = Math.max(peak,cumulative); trough = Math.min(trough,cumulative); maxDrawdown = Math.min(maxDrawdown, cumulative-peak);
    const bm = byMarket[best.market]; bm.bets++; bm.pnl += pnl; if(state==="WIN") bm.wins++; else if(state==="LOSS") bm.losses++;
    if(m.date){ const wk = isoWeekKey(m.date); weekMap[wk] = (weekMap[wk]||0)+1; }

    ledger.push({...base, market:best.market, selection:best.selection, open_odds:best.open, close_odds:best.close,
      drop_pct:Number(best.dropPct.toFixed(2)), status:state==="PUSH"?"PUSH":(state==="HALF"?"HALF_WIN_LOSS":"QUALIFIED"),
      pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)),
      notes: `${state} — staked ${stake}u @ ${best.close}`});
  }

  const totalStaked = qualified*stake;
  const netPnl = Number(cumulative.toFixed(4));
  const decided = wins+losses;
  return {
    scopeCount: inScope.length, qualified, notTriggered, priceExcluded, missing, wins, losses, pushes,
    totalStaked, netPnl, winRate: decided ? Number((wins/decided*100).toFixed(2)) : null,
    roi: totalStaked ? Number((netPnl/totalStaked*100).toFixed(2)) : null,
    maxDrawdown: Number(maxDrawdown.toFixed(4)), peakUnits: Number(peak.toFixed(4)),
    byMarket, weekMap, ledger,
  };
}
function isoWeekKey(iso){
  const d = new Date(iso+"T00:00:00");
  const target = new Date(d.valueOf());
  const dayNr = (d.getUTCDay()+6)%7;
  target.setUTCDate(target.getUTCDate()-dayNr+3);
  const firstThursday = new Date(Date.UTC(target.getUTCFullYear(),0,4));
  const weekNum = 1+Math.round(((target-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return `${target.getUTCFullYear()}-W${String(weekNum).padStart(2,"0")}`;
}

/* ============================================================================
   LEAGUE TABLE ENGINE (shared by standings-based strategies)
   Standings are computed strictly from matches ALREADY COMPLETED before the
   cutoff date — no lookahead into the result being bet on. "Gameweek" is
   approximated as one calendar week of fixtures per league, since football-
   data.co.uk files carry no explicit matchday number — a standard, disclosed
   backtesting approximation, not a fabricated field.
============================================================================ */
function computeLeagueTable(matches, league, season, beforeDateExclusive){
  const table = {};
  const relevant = matches.filter(m=>m.league===league && m.season===season && m.date && m.date<beforeDateExclusive && m.home_goals!==null && m.away_goals!==null && m.full_time_result && !m.invalid && !m.result_conflict);
  function ensure(team){ if(!table[team]) table[team]={team,played:0,wins:0,draws:0,losses:0,gf:0,ga:0,pts:0}; return table[team]; }
  for(const m of relevant){
    const h=ensure(m.home_team), a=ensure(m.away_team);
    h.played++; a.played++; h.gf+=m.home_goals; h.ga+=m.away_goals; a.gf+=m.away_goals; a.ga+=m.home_goals;
    if(m.full_time_result==="H"){ h.wins++; h.pts+=3; a.losses++; }
    else if(m.full_time_result==="A"){ a.wins++; a.pts+=3; h.losses++; }
    else { h.draws++; a.draws++; h.pts+=1; a.pts+=1; }
  }
  return Object.values(table).map(t=>({...t, gd:t.gf-t.ga}));
}
function rankTeams(table, mode){
  const rows = table.slice();
  if(mode==="TOP") rows.sort((x,y)=> y.pts-x.pts || y.gd-x.gd || y.gf-x.gf || x.team.localeCompare(y.team));
  else rows.sort((x,y)=> x.pts-y.pts || x.gd-y.gd || x.gf-y.gf || y.losses-x.losses || x.team.localeCompare(y.team));
  return rows;
}
function groupMatchesByWeek(matches){
  const map = {};
  matches.filter(m=>m.date).forEach(m=>{ const wk=isoWeekKey(m.date); (map[wk]=map[wk]||[]).push(m); });
  return map;
}
function emptyStrategyResult(message){
  return { scopeCount:0, qualified:0, notTriggered:0, priceExcluded:0, missing:0, wins:0, losses:0, pushes:0,
    totalStaked:0, netPnl:0, winRate:null, roi:null, maxDrawdown:0, peakUnits:0, byMarket:null, weekMap:{},
    ledger:[{status:"ERROR", notes:message}] };
}
function finalizeStrategyResult({scopeCount, qualified, notTriggered, missing, wins, losses, pushes, cumulative, maxDrawdown, peak, ledger, weekMap, fixedStake}){
  // Total staked has two valid ways to compute it: strategies using a staking PLAN record their
  // actual per-bet stake on every ledger row (stake_units), so summing those is correct. But
  // fixed-$-stake strategies (Largest Percentage Drop and its siblings) never recorded a
  // stake_units field at all — they staked the exact same fixed amount on every qualifying bet,
  // so total staked is simply qualified bets × that fixed amount. Without this, ROI silently
  // came back null for every fixed-stake strategy (including the original Largest Percentage
  // Drop), which in turn broke "rank by real profit" sorting wherever ROI was the sort key.
  const totalStaked = fixedStake ? (qualified*fixedStake) : ledger.reduce((s,r)=> s + (r.stake_units||0), 0);
  const decided = wins+losses;
  return {
    scopeCount, qualified, notTriggered, priceExcluded:0, missing, wins, losses, pushes,
    totalStaked: Number(totalStaked.toFixed(4)), netPnl: Number(cumulative.toFixed(4)),
    winRate: decided ? Number((wins/decided*100).toFixed(2)) : null,
    roi: totalStaked ? Number((cumulative/totalStaked*100).toFixed(2)) : null,
    maxDrawdown: Number(maxDrawdown.toFixed(4)), peakUnits: Number(peak.toFixed(4)),
    byMarket:null, weekMap, ledger,
  };
}

// Simulates a real client walking away once their own personal maximum acceptable drawdown is
// reached — "I'd stop betting once I'm down X units." Deliberately built as a single, generic
// post-processing step over any strategy's already-finished result, rather than adding this
// logic separately inside all ~101 individual strategy functions: every ledger row already
// carries its own real pnl, win/loss/push status, and (for staking-plan strategies) its own
// stake_units, which is everything needed to replay the exact same sequence of real bets and
// stop it partway through. Fixed-stake strategies never recorded a per-row stake_units field
// (same reasoning as totalStaked above), so their per-bet stake is inferred once as
// totalStaked/qualified, which is exact since every one of their bets used the identical amount.
function applyDrawdownStopLoss(result, capUnits){
  if(capUnits===null || capUnits===undefined || capUnits==="" || isNaN(Number(capUnits)) || Number(capUnits)<=0) return result;
  if(!result || !result.ledger || !result.ledger.length) return result;
  const cap = Number(capUnits);
  const BET_STATUSES = new Set(["WIN","LOSS","PUSH","HALF"]);
  const impliedFixedStake = (result.qualified>0 && !result.ledger.some(r=>typeof r.stake_units==="number"))
    ? result.totalStaked/result.qualified : null;
  const ledger = result.ledger.map(e=>({...e}));
  let peak=0, cumulative=0, maxDrawdown=0, stopped=false, stoppedAfter=0;
  let qualified=0, wins=0, losses=0, pushes=0, totalStakedKept=0;
  for(const e of ledger){
    const isBet = BET_STATUSES.has(e.status);
    if(stopped){
      if(isBet){
        e.status = "STOPPED_DRAWDOWN_CAP";
        e.pnl = 0;
        e.notes = `${e.notes||""} — Not placed: your ${cap}u maximum drawdown was already reached earlier in this run.`.trim();
      }
      e.cumulative_units = Number(cumulative.toFixed(4));
      continue;
    }
    if(isBet){
      qualified++;
      if(e.status==="WIN") wins++;
      else if(e.status==="LOSS") losses++;
      else if(e.status==="PUSH") pushes++;
      else wins++; // HALF (partial AH win) counted in the wins bucket, matching this app's existing convention elsewhere
      const stake = (typeof e.stake_units==="number") ? e.stake_units : (impliedFixedStake||0);
      totalStakedKept += stake;
      cumulative += (e.pnl||0);
      peak = Math.max(peak, cumulative);
      maxDrawdown = Math.min(maxDrawdown, cumulative-peak);
      e.cumulative_units = Number(cumulative.toFixed(4));
      if((peak-cumulative) >= cap){ stopped = true; stoppedAfter = qualified; }
    }
  }
  const decided = wins+losses;
  return {
    ...result, ledger, qualified, wins, losses, pushes,
    totalStaked: Number(totalStakedKept.toFixed(4)), netPnl: Number(cumulative.toFixed(4)),
    winRate: decided ? Number((wins/decided*100).toFixed(2)) : null,
    roi: totalStakedKept ? Number((cumulative/totalStakedKept*100).toFixed(2)) : null,
    maxDrawdown: Number(maxDrawdown.toFixed(4)), peakUnits: Number(peak.toFixed(4)),
    drawdownCapApplied: cap, stoppedEarly: stopped, stoppedAfterBets: stoppedAfter,
    originalQualified: result.qualified,
  };
}

/* ============================================================================
   AUTO-OPTIMIZATION ENGINE
   Sweeps a strategy's own tunable parameters + (where applicable) every
   staking plans, ranks by tuning-window ROI, then re-checks the top
   candidates against a held-out chronological validation window they never
   saw during tuning. Only strategies that produce real P&L
   (pnlUnavailable !== true) are eligible — there is no ROI to optimize
   toward for hit-rate-only strategies. Built entirely on top of each
   strategy's existing run(matches, params) function and
   finalizeStrategyResult()'s uniform return shape (netPnl/roi/maxDrawdown/
   qualified/wins/losses) — no strategy logic is duplicated or modified here.

   Terminology: "tuning window" = the older portion of real imported match
   data used to search for parameter values. "Validation window" = the
   newer portion, held back and never used while searching, used only to
   check the tuning held up. Every match in both windows is a real row from
   an imported CSV — nothing here is simulated.

   Sweep policy (disclosed to the user in the UI, not silently applied):
   - Only paramSchema fields of type "number" (excluding scope/identity
     fields: league, season, dateFrom, dateTo, team, leagues, baseUnit,
     stake, market), plus "select"/"choice" fields with an explicit,
     already-enumerated option list, are eligible for sweeping.
   - Numeric fields are swept at 0.5x/0.75x/1x/1.25x/1.5x of the strategy's
     own default value (rounded appropriately); a default of exactly 0 uses
     an additive grid [0,1,2,3,5] instead since a ratio of 0 is degenerate.
   - To keep the grid size sane, at most the first 2 eligible fields (in the
     strategy's own paramSchema order) are swept per run; any remaining
     eligible fields are held at their default and this is disclosed.
   - Staking-plan sweep only applies to strategies whose defaultParams
     already include "stakingPlan" (i.e. they route through the shared
     createStakingEngine). Strategies with a fixed stake by design
     (LARGEST_DROP, CROSS_BOOKMAKER_ARB) sweep their own params only.
   - Any (params, plan) combination whose tuning-window qualified-bet count
     is below the configured minimum is discarded from ranking — a strategy
     that "wins" on 3 bets is not evidence of anything.
============================================================================ */
