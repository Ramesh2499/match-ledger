/* ---------------- STRATEGY: CLOSE ENCOUNTER METHOD (hit-rate only) ---------------- */
function evaluateCloseEncounterMethod(matches, params){
  return evaluateHitRateStrategy(matches, params, {
    trigger(m, allMatches, p){
      const H=m.odds_open.H, A=m.odds_open.A;
      if(H===null||A===null) return {dataMissing:true, reason:"Home/Away odds not available"};
      const floor = Number(p.oddsFloor)||2.0;
      const evenlyMatched = H>=floor && A>=floor;
      if(!evenlyMatched) return {ok:false, reason:`Not evenly matched — both H and A odds need to be ≥${floor}`, cols:{home_odds:H, away_odds:A}};
      const firstHalfGoals = (m.half_time_goals||"0-0").split("-").map(Number).reduce((a,b)=>a+(isNaN(b)?0:b),0);
      if(firstHalfGoals===0) return {ok:false, reason:"No first-half goal (proxy for 'goal within the first 20 minutes' — exact minute isn't recorded in this data)", cols:{home_odds:H, away_odds:A}};
      const fg = firstGoalSide(m);
      if(fg.side===null) return {dataMissing:true, reason:`First-half goal occurred but the scoring team isn't determinable from this data (${fg.note})`};
      return {ok:true, side:fg.side, cols:{home_odds:H, away_odds:A, first_scorer: fg.side==="H"?m.home_team:m.away_team}};
    },
    hitCheck(m, trig){
      const hit = m.full_time_result===trig.side;
      return {hit, cols:{ final_score:`${m.home_goals}-${m.away_goals}` },
        notes:(hit?"The early-scoring team went on to win outright — per the method, profit is locked in.":"The early-scoring team didn't win (draw or loss) — per the method, this is a breakeven outcome after the equalizer trade-out, not a real loss.")+
          " This data source's finest time resolution is the half-time score, not exact minutes — 'within the first 20 minutes' is approximated as 'any first-half goal', which will include some later first-half goals the real rule wouldn't. The equalizer-triggered trade-out and 'green up' adjustment aren't simulated."};
    },
  });
}

/* ---------------- STRATEGY: UNDER/OVER 2.5 EARLY-GOAL SYSTEM (hit-rate only) ---------------- */
function evaluateEarlyGoal25System(matches, params){
  return evaluateHitRateStrategy(matches, params, {

      const ok = firstHalfGoals>0;
      return {ok, reason: ok?"":"No first-half goal (proxy for 'goal within the first 15 minutes' — exact minute isn't recorded in this data)", cols:{ht_score:m.half_time_goals||"—"}};

      return {hit, cols:{ actual_total_goals:total, variant }, notes:(hit?`Final total (${total}) matches the ${variant} 2.5 target outright.`:`Final total (${total}) doesn't match the ${variant} 2.5 target.`)+zone+
        " The 5-10 minute back-then-lay window and the risk of a second goal arriving before laying off both require live in-play odds and goal timing this app doesn't have and aren't simulated — this only checks whether the real final score ended up on the safe side of 2.5 goals."};
    },
  });
}

/* ---------------- STRATEGY: 0-0 AT HT + UNDER 1.5 SCALP (hit-rate only) ---------------- */

          " Two real gaps: (1) 'HT 0-0' is used as an over-inclusive proxy for '0-0 at the 55th minute' — a match with a goal in the 46th-55th minute would still show HT 0-0 and be wrongly included here; (2) football-data.co.uk has no Under 1.5 Goals odds at any point (pre-match or in-play), so the '>1.35' entry condition and the 5-10% lock-in via laying 5-7 minutes later can't be checked at all — only the real final total decides this row."};

      const homeStats = venueGoalStatsBefore(matches, m.home_team, "H", m.date, nForm);
      const awayStats = venueGoalStatsBefore(matches, m.away_team, "A", m.date, nForm);
      if(homeStats.gfAvg===null || awayStats.gfAvg===null){ missing++; ledger.push({...base, favourite:`${m.home_team} (H)`, fav_odds:fav.favOdds, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough prior home/away matches yet to compute goal averages for the 'high-scoring expected' check"}); continue; }
      expectedTotal = Number((homeStats.gfAvg+awayStats.gfAvg).toFixed(2));
      if(!(expectedTotal>=minExpected)){ notTriggered++; ledger.push({...base, favourite:`${m.home_team} (H)`, fav_odds:fav.favOdds, expected_total_goals:expectedTotal, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Expected total goals ${expectedTotal} below the ${minExpected} 'high-scoring' threshold`}); continue; }
    }
    // Real, three-way dutch coverage: Correct Score 0-0, Correct Score 1-0 (home), and Over 1.5 Goals
    // (mathematically identical to "Two or More Goals" — reusing the real O/U market instead of inventing
    // a nonstandard "2+ goals" proposition). Structurally covers every outcome except an exact 0-1 away
    // win, a real deterministic fact, not an odds estimate. Correct Score odds do not exist in
    // football-data.co.uk at all — this needs a source like API-Football's Correct Score market, not yet
    // wired into this app's import pipeline, so it will correctly show ODDS_UNAVAILABLE until then.
    const cs00 = m.odds_open.correctScore?.["0-0"] ?? null;
    const cs10 = m.odds_open.correctScore?.["1-0"] ?? null;
    const over15 = m.odds_open.Over15 ?? null;
    if(cs00===null || cs10===null || over15===null){
      missing++; ledger.push({...base, favourite:`${m.home_team} (H)`, fav_odds:fav.favOdds, expected_total_goals:expectedTotal??"— (check disabled)", status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Real Correct Score and/or Over 1.5 Goals market odds not available in the currently imported data — needs a data source that carries these markets (e.g. API-Football), not yet wired in"}); continue;
    }
    qualified++;
    const stake = engine.stakeFor(over15); // eligibility/staking-plan progression driven by the widest-coverage leg's odds
    const dutch = calcDutching(stake, [{label:"0-0", odds:cs00}, {label:"1-0", odds:cs10}, {label:"Over 1.5", odds:over15}]);
    const awayWon01 = m.home_goals===0 && m.away_goals===1;
    const won = !awayWon01;
    const pnl = won ? dutch.profitIfAnyHit : dutch.lossIfNoneHit;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, favourite:`${m.home_team} (H)`, fav_odds:fav.favOdds, expected_total_goals:expectedTotal??"— (check disabled)", final_score:`${m.home_goals}-${m.away_goals}`, status:won?"WIN":"LOSS",
      stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`Dutched ${stake.toFixed(2)}u across real odds 0-0 @ ${cs00}, 1-0 @ ${cs10}, Over 1.5 @ ${over15}. ${won?"Covered result.":"Away won exactly 0-1 — the one gap this coverage doesn't fill."}`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

      const maxFavOdds = Number(p.maxFavOdds)||1.8;

    },

          " HT and FT results here are real recorded values. No HT/FT double-result market odds exist in football-data.co.uk (a different proposition market to the raw 1X2 odds this data does carry), so P&L, the Lucky 15/accumulator odds boost, and the described Betfair hedging (laying the HT draw, then laying the favourite if the underdog scores) aren't computable — only the real HT/FT combination outcome is checked."};

/* ---------------- STRATEGY: POISSON DISTRIBUTION (GOALS-BASED, xG PROXY) EDGE FINDER — real staking ---------------- */
function poissonProb(lambda, k){
  if(lambda<0) lambda=0;
  if(lambda===0) return k===0 ? 1 : 0;
  let fact=1; for(let i=2;i<=k;i++) fact*=i;
  return Math.exp(-lambda)*Math.pow(lambda,k)/fact;
}
function buildScorelineMatrix(homeLambda, awayLambda, maxG){
  const P=[];
  for(let h=0;h<=maxG;h++){ P[h]=[]; for(let a=0;a<=maxG;a++){ P[h][a]=poissonProb(homeLambda,h)*poissonProb(awayLambda,a); } }
  return P;
}
function marketProbFromMatrix(P, maxG, market){
  let over25=0, homeWin=0, draw=0, awayWin=0;
  for(let h=0;h<=maxG;h++) for(let a=0;a<=maxG;a++){
    const p=P[h][a];
    if(h+a>=3) over25+=p;
    if(h>a) homeWin+=p; else if(h===a) draw+=p; else awayWin+=p;
  }
  switch(market){
    case "OVER_2_5": return over25;
    case "UNDER_2_5": return 1-over25;
    case "HOME_WIN": return homeWin;
    case "DRAW": return draw;
    case "AWAY_WIN": return awayWin;
    default: return 0;
  }
}
function evaluatePoissonEdge(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const nForm = Number(params.formWindow)||5;
  const maxG = 6;
  const market = params.market || "OVER_2_5";
  const edgeThreshold = Number(params.edgeThreshold)||5;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const homeLambda = venueGoalStatsBefore(matches, m.home_team, "H", m.date, nForm).gfAvg;
    const awayLambda = venueGoalStatsBefore(matches, m.away_team, "A", m.date, nForm).gfAvg;
    if(homeLambda===null || awayLambda===null){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough prior home/away matches yet to compute goals-based lambda"}); continue;
    }
    const P = buildScorelineMatrix(homeLambda, awayLambda, maxG);
    const calcProb = marketProbFromMatrix(P, maxG, market);
    const odds = market==="OVER_2_5"?m.odds_open.Over25 : market==="UNDER_2_5"?m.odds_open.Under25 : market==="HOME_WIN"?m.odds_B365H : market==="DRAW"?m.odds_B365D : m.odds_B365A;
    if(odds===null){
      missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:`No real odds recorded for ${market} on this match`}); continue;
    }
    const impliedProb = 1/odds;
    const edgePts = Number(((calcProb-impliedProb)*100).toFixed(2));
    if(edgePts<=edgeThreshold){
      notTriggered++;
      ledger.push({...base, calc_prob:Number((calcProb*100).toFixed(1)), implied_prob:Number((impliedProb*100).toFixed(1)), edge_pts:edgePts, market, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Edge ${edgePts}pts doesn't clear the ${edgeThreshold}pt threshold`});
      continue;
    }
    if(!engine.eligible(odds)){
      notTriggered++;
      ledger.push({...base, calc_prob:Number((calcProb*100).toFixed(1)), implied_prob:Number((impliedProb*100).toFixed(1)), edge_pts:edgePts, market, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"});
      continue;
    }
    const total = m.home_goals+m.away_goals;
    const won = market==="OVER_2_5" ? total>2.5 : market==="UNDER_2_5" ? total<2.5 : market==="HOME_WIN" ? m.full_time_result==="H" : market==="DRAW" ? m.full_time_result==="D" : m.full_time_result==="A";
    qualified++;
    const stake = engine.stakeFor(odds);
    const pnl = won ? (odds-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, calc_prob:Number((calcProb*100).toFixed(1)), implied_prob:Number((impliedProb*100).toFixed(1)), edge_pts:edgePts, market, score:`${m.home_goals}-${m.away_goals}`,
      status: won?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`λ_home=${homeLambda}, λ_away=${awayLambda} (goals-based, not true xG) — staked ${stake.toFixed(2)}u @ ${odds}`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: OVER 3.5 IN RELEGATION SIX-POINTERS (real staking on Leg 1) ---------------- */
function evaluateRelegationOver35(matches, params){

    const homeRow = table.find(t=>t.team===m.home_team), awayRow = table.find(t=>t.team===m.away_team);
    if(!homeRow || !awayRow || homeRow.played<minGamesPlayed || awayRow.played<minGamesPlayed){
      notTriggered++; ledger.push({...base, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Not enough of the season played yet (need ≥${minGamesPlayed} games each for a meaningful table position)`}); continue;
    }
    const ranked = rankTeams(table,"TOP"); const totalTeams = ranked.length;

    }
    if(odds<minOver25Odds){
      notTriggered++; ledger.push({...base, home_position:homePos, away_position:awayPos, home_ga_avg:homeForm.gaAvg, away_ga_avg:awayForm.gaAvg, over25_odds:odds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Over 2.5 odds ${odds} below the ${minOver25Odds} value floor`}); continue;
    }

    }
    const totalGoals = m.home_goals+m.away_goals;
    const won = totalGoals>2.5;
    qualified++;
    const stake = engine.stakeFor(odds);
    const pnl = won ? (odds-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, home_position:homePos, away_position:awayPos, home_ga_avg:homeForm.gaAvg, away_ga_avg:awayForm.gaAvg, over25_odds:odds,

  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: CORNER VOLUME — OVER/UNDER TOTAL CORNERS (hit-rate only; real corner history used instead of unavailable formation data) ---------------- */
function evaluateCornerVolumeOverUnder(matches, params){
  const nForm = Number(params.formWindow)||8;
  const line = Number(params.cornersLine)||10.5;
  const buffer = Number(params.buffer)||1.0;
  return evaluateHitRateStrategy(matches, params, {
    trigger(m, allMatches){
      if(m.home_corners===null || m.away_corners===null) return {dataMissing:true, reason:"This match row has no recorded corner counts (HC/AC columns)"};
      const homeC = cornerFormBefore(allMatches, m.home_team, m.date, nForm), awayC = cornerFormBefore(allMatches, m.away_team, m.date, nForm);
      if(homeC.avgFor===null || awayC.avgFor===null) return {dataMissing:true, reason:"Not enough prior matches with recorded corner data yet"};
      const homeTendency = Number((homeC.avgFor+homeC.avgAgainst).toFixed(2)), awayTendency = Number((awayC.avgFor+awayC.avgAgainst).toFixed(2));
      const expected = Number(((homeTendency+awayTendency)/2).toFixed(2));
      let direction = null;
      if(expected>=line+buffer) direction="OVER"; else if(expected<=line-buffer) direction="UNDER";
      const ok = direction!==null;
      return {ok, reason: ok?"":`Expected total corners (${expected}) too close to the ${line} line (within ±${buffer}) to call`, direction,
        cols:{home_corner_tendency:homeTendency, away_corner_tendency:awayTendency, expected_total_corners:expected}};
    },
    hitCheck(m, trig){
      const actual = m.home_corners+m.away_corners;
      const hit = trig.direction==="OVER" ? actual>line : actual<line;
      return {hit, cols:{ actual_total_corners:actual, predicted_direction:trig.direction },
        notes:(hit?`Actual total corners (${actual}) matches the predicted ${trig.direction} ${line}.`:`Actual total corners (${actual}) doesn't match the predicted ${trig.direction} ${line}.`)+
          " This uses each team's own real historical corner volume (for + against) as the predictor, NOT formation/lineup data — football-data.co.uk has no team formation or confirmed-lineup information at all, so the literal 'narrow vs wide formation' logic can't be checked. No corner-market odds exist either, so this is hit-rate only."};
    },
  });
}

  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const drawStats = leagueDrawRateBefore(matches, m.league, m.season, m.date);
    if(drawStats.played<minSample){
      notTriggered++; ledger.push({...base, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Not enough league history yet (${drawStats.played} matches, need ≥${minSample}) for a reliable draw rate`}); continue;
    }
    if(drawStats.drawPct<minLeagueDrawRate){
      notTriggered++; ledger.push({...base, league_draw_rate_pct:drawStats.drawPct, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`League draw rate (${drawStats.drawPct}%) below the ${minLeagueDrawRate}% threshold`}); continue;
    }
    const table = computeLeagueTable(matches, m.league, m.season, m.date);
    const homeRow = table.find(t=>t.team===m.home_team), awayRow = table.find(t=>t.team===m.away_team);
    if(!homeRow || !awayRow || homeRow.played<minGamesPlayed || awayRow.played<minGamesPlayed){
      notTriggered++; ledger.push({...base, league_draw_rate_pct:drawStats.drawPct, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Not enough of the season played yet (need ≥${minGamesPlayed} games each)`}); continue;
    }
    const ranked = rankTeams(table,"TOP");
    const homePos = ranked.findIndex(t=>t.team===m.home_team)+1, awayPos = ranked.findIndex(t=>t.team===m.away_team)+1;
    const midTableOk = homePos>=midLo && homePos<=midHi && awayPos>=midLo && awayPos<=midHi;
    if(!midTableOk){
      notTriggered++; ledger.push({...base, league_draw_rate_pct:drawStats.drawPct, home_position:homePos, away_position:awayPos, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Not both mid-table (positions ${midLo}-${midHi}) — Home ${homePos}, Away ${awayPos}`}); continue;
    }
    const homeForm = recentFormBefore(matches, m.home_team, m.date, nForm), awayForm = recentFormBefore(matches, m.away_team, m.date, nForm);
    if(homeForm.played===0 || awayForm.played===0){
      missing++; ledger.push({...base, league_draw_rate_pct:drawStats.drawPct, home_position:homePos, away_position:awayPos, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough prior matches to compute recent scoring form"}); continue;
    }
    const lowScoringOk = homeForm.gfAvg<lowScoreMax && awayForm.gfAvg<lowScoreMax;
    if(!lowScoringOk){
      notTriggered++; ledger.push({...base, league_draw_rate_pct:drawStats.drawPct, home_position:homePos, away_position:awayPos, home_gf_avg:homeForm.gfAvg, away_gf_avg:awayForm.gfAvg, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Scoring form too high for both teams to be under ${lowScoreMax} GF/game`}); continue;
    }
    const fairOdds = Number((1/(drawStats.drawPct/100)).toFixed(2));
    const D = m.odds_open.D;
    if(D===null){
      missing++; ledger.push({...base, league_draw_rate_pct:drawStats.drawPct, home_position:homePos, away_position:awayPos, fair_draw_odds:fairOdds, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Draw odds not available for this match"}); continue;
    }
    if(D<=fairOdds){
      notTriggered++; ledger.push({...base, league_draw_rate_pct:drawStats.drawPct, home_position:homePos, away_position:awayPos, fair_draw_odds:fairOdds, bookmaker_draw_odds:D, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Bookmaker Draw odds (${D}) don't exceed your fair odds (${fairOdds}) — no value`}); continue;
    }
    if(!engine.eligible(D)){
      notTriggered++; ledger.push({...base, fair_draw_odds:fairOdds, bookmaker_draw_odds:D, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue;
    }
    const won = m.full_time_result==="D";
    qualified++;
    const stake = engine.stakeFor(D);
    const pnl = won ? (D-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, league_draw_rate_pct:drawStats.drawPct, home_position:homePos, away_position:awayPos, home_gf_avg:homeForm.gfAvg, away_gf_avg:awayForm.gfAvg, fair_draw_odds:fairOdds, bookmaker_draw_odds:D,
      score:`${m.home_goals}-${m.away_goals}`, status: won?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`League draw rate ${drawStats.drawPct}% → fair odds ${fairOdds}, bookmaker offered ${D} — staked ${stake.toFixed(2)}u`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: BACK THE 0-0 (EARLY EXIT SCALP) (hit-rate only) ---------------- */
function evaluateBackZeroZeroScalp(matches, params){
  return evaluateHitRateStrategy(matches, params, {
    trigger(m){
      if(!m.half_time_goals) return {dataMissing:true, reason:"Half-time score not available"};
      return {ok:true, cols:{ht_score:m.half_time_goals}};
    },
    hitCheck(m){
      const parts = (m.half_time_goals||"").split("-").map(Number);
      const htZeroZero = parts.length===2 && !parts.some(isNaN) && parts[0]===0 && parts[1]===0;
      return {hit: htZeroZero, cols:{ final_score:`${m.home_goals}-${m.away_goals}` },
        notes:(htZeroZero?"Still 0-0 at half-time — per the method's own lock-in math, laying off around this point guarantees the same small profit regardless of the final score.":"A goal came before half-time — the scoreboard didn't stay blank long enough to lay off, so the original Back 0-0 bet just loses outright.")+
          " '0-0 at half-time' is used as a conservative proxy for 'still 0-0 around the 30th-40th minute' — this data's finest checkpoint is the 45-minute HT snapshot, not a specific in-play minute, so some matches that broke the deadlock at minute 41-45 (which the literal rule would still count as a win) are excluded here rather than guessed. No correct-score odds exist in football-data.co.uk at all, so the ≥7.0 entry price, the 50% price-contraction exit trigger, and the exact lay stake can't be verified — this only checks whether the scoreless-through-HT condition held."};
    },
  });
}

/* ---------------- STRATEGY: HT/FT "DUTCH" — LAY BOTH TEAMS HT WIN (hit-rate only) ---------------- */
function evaluateHtftDutchLayBoth(matches, params){
  return evaluateHitRateStrategy(matches, params, {
    trigger(m, allMatches, p){
      const H=m.odds_open.H, A=m.odds_open.A;
      if(H===null||A===null) return {dataMissing:true, reason:"Home/Away odds not available"};
      const lo=Number(p.oddsLo)||2.0, hi=Number(p.oddsHi)||4.0;
      const ok = H>=lo && H<=hi && A>=lo && A<=hi;
      return {ok, reason: ok?"":`Doesn't clear the evenly-matched band (H ${H}, A ${A} must both be ${lo}-${hi})`, cols:{home_odds:H, away_odds:A}};
    },
    hitCheck(m){
      const hit = m.half_time_result==="D";
      return {hit, cols:{ ht_result:m.half_time_result||"—", ht_score:m.half_time_goals||"—" },
        notes:(hit?"Level at half-time — both HT-win lays win, the profit scenario.":"One team led at half-time — one lay wins, one loses, typically a small net loss or breakeven (not a full loss).")+
          " No 'team to be leading at half-time' market odds exist in football-data.co.uk, so no P&L is computed — this only checks the real half-time result. Miss here does not mean a full loss, per the method's own structure."};
    },
  });
}

/* ---------------- STRATEGY: CROSS-BOOKMAKER ARBITRAGE (real, guaranteed-by-construction P&L) ---------------- */
const ARB_BOOKMAKER_CODES = ["B365","BW","IW","PS","P","WH","VC","LB"];
function bestCrossBookmakerOdds(raw, suffix){
  let best = null;
  for(const code of ARB_BOOKMAKER_CODES){
    const v = raw[code+suffix];
    if(v!==undefined && v!==null && v!=="" && !isNaN(Number(v)) && Number(v)>1){
      const n = Number(v);
      if(best===null || n>best) best = n;
    }
  }
  return best;
}
function evaluateCrossBookmakerArbitrage(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const minMarginPct = Number(params.minMarginPct)||2;
  const baseUnit = Number(params.baseUnit)||1;
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const bestH = bestCrossBookmakerOdds(m.raw, "H"), bestD = bestCrossBookmakerOdds(m.raw, "D"), bestA = bestCrossBookmakerOdds(m.raw, "A");
    if(bestH===null || bestD===null || bestA===null){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Fewer than 3 distinct bookmaker columns with H/D/A odds found in this row"}); continue;
    }
    const impliedSum = 1/bestH + 1/bestD + 1/bestA;
    const marginPct = Number((((1/impliedSum)-1)*100).toFixed(3));
    if(marginPct<minMarginPct){
      notTriggered++; ledger.push({...base, best_h:bestH, best_d:bestD, best_a:bestA, margin_pct:marginPct, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`No arbitrage — combined implied probability ${(impliedSum*100).toFixed(2)}% (need margin ≥${minMarginPct}%)`}); continue;
    }
    qualified++; wins++;
    // Guaranteed-profit-by-construction: stake split proportional to 1/odds on each outcome for equal payout, on baseUnit total stake
    const stakeH = baseUnit*(1/bestH)/impliedSum, stakeD = baseUnit*(1/bestD)/impliedSum, stakeA = baseUnit*(1/bestA)/impliedSum;
    const guaranteedPayout = stakeH*bestH; // equal for all three by construction
    const pnl = guaranteedPayout - baseUnit;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, best_h:bestH, best_d:bestD, best_a:bestA, margin_pct:marginPct, status:"WIN", stake_units:baseUnit, pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)),
      notes:`Real cross-bookmaker arbitrage found — split ${baseUnit}u across all 3 outcomes (${stakeH.toFixed(2)}/${stakeD.toFixed(2)}/${stakeA.toFixed(2)}) at the best real price from any single bookmaker column in this row guarantees +${marginPct}% regardless of result. Real 3-way arbitrage is rare; expect very few or zero triggers on most datasets.`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: CROSS-MARKET ASIAN HANDICAP HEDGE (Back + DNB-equivalent Lay) — hit-rate only ---------------- */
function evaluateCrossMarketAhHedge(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const backSide = params.backSide || "AUTO_FAVOURITE";
  const minOdds = Number(params.minOdds)||1.5, maxOdds = Number(params.maxOdds)||3.0;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    let side, oddsX, oddsOpp;
    if(backSide==="HOME"){ side="H"; oddsX=m.odds_open.H; oddsOpp=m.odds_open.A; }
    else if(backSide==="AWAY"){ side="A"; oddsX=m.odds_open.A; oddsOpp=m.odds_open.H; }
    else{
      const fav=getFavourite(m);
      if(!fav){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Home/Away odds not available"}); continue; }
      if(fav.side===null){ notTriggered++; ledger.push({...base, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"No clear favourite (odds equal)"}); continue; }
      side=fav.side; oddsX=fav.favOdds; oddsOpp=fav.dogOdds;
    }
    if(oddsX===null||oddsOpp===null){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Odds not available for the selected side"}); continue; }
    const team = side==="H"?m.home_team:m.away_team;
    if(!(oddsX>=minOdds && oddsX<=maxOdds)){ notTriggered++; ledger.push({...base, backed_team:team, back_odds:oddsX, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Back odds ${oddsX} outside the ${minOdds}-${maxOdds} band (too extreme for a meaningful hedge)`}); continue; }
    if(!engine.eligible(oddsX)){ notTriggered++; ledger.push({...base, backed_team:team, back_odds:oddsX, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    // Real "opponent Draw No Bet" price, derived from the real quoted Home/Away odds the same
    // way as DRAW_NO_BET_METHOD (DNB_odds = 1 + team's own odds / opponent's odds). Laying the
    // backed team on AH 0.0/DNB is mathematically identical, in this binary (draw-voids) market,
    // to backing the OPPONENT's DNB at the mirror-image derived price — so this leg is priced
    // honestly with no fabricated number, same technique already used and tested elsewhere.
    const dnbOpp = 1 + oddsOpp/oddsX;
    qualified++;
    const legStake = engine.stakeFor(oddsX);
    const totalStake = legStake*2; // equal-stake design: same nominal stake on each of the two legs
    const backedWon = m.full_time_result===side;
    const isDraw = m.full_time_result==="D";
    let pnl, scenario;
    if(backedWon){ pnl = legStake*(oddsX-1) - legStake; scenario = "Backed team won — back leg profits, opponent-DNB leg loses"; }
    else if(isDraw){ pnl = -legStake; scenario = "Draw — back leg loses its stake, opponent-DNB leg voids (stake returned, no gain)"; }
    else { pnl = -legStake + legStake*(dnbOpp-1); scenario = "Backed team lost — back leg loses, opponent-DNB leg wins"; }
    const status = pnl>0 ? "WIN" : pnl<0 ? "LOSS" : "PUSH";
    engine.settle(pnl>0, pnl);
    if(pnl>0) wins++; else if(pnl<0) losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, backed_team:team, back_odds:oddsX, opponent_dnb_odds:Number(dnbOpp.toFixed(3)), scenario, final_score:`${m.home_goals}-${m.away_goals}`, status,
      stake_units:Number(totalStake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`Equal-stake hedge: ${legStake.toFixed(2)}u backing ${team} on real Match Odds @ ${oddsX}, plus ${legStake.toFixed(2)}u backing the opponent's Draw No Bet at the derived fair price ${dnbOpp.toFixed(3)}. Total capital at risk this trade: ${totalStake.toFixed(2)}u. Net P&L ${pnl>=0?"+":""}${pnl.toFixed(2)}u.`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: SECOND HALF SPECIALS — 0-0 AT HT (hit-rate only) ---------------- */
function evaluateSecondHalfSpecials(matches, params){
  return evaluateHitRateStrategy(matches, params, {
    trigger(m){
      if(!m.half_time_goals) return {dataMissing:true, reason:"Half-time score not available"};
      const parts = m.half_time_goals.split("-").map(Number);
      if(parts.length!==2||parts.some(isNaN)) return {dataMissing:true, reason:"Half-time score not parseable"};
      const ok = parts[0]===0 && parts[1]===0;
      return {ok, reason: ok?"":"Not 0-0 at half-time", cols:{ht_score:m.half_time_goals}};
    },
    hitCheck(m){
      const hit = !(m.home_goals===0 && m.away_goals===0);
      return {hit, cols:{ final_score:`${m.home_goals}-${m.away_goals}` },
        notes:(hit?"At least one goal came in the second half.":"Match finished 0-0 — no second-half goal.")+
          " This checks the real, direct empirical claim (given 0-0 at HT, does the 2nd half produce a goal) against your actual imported results. No 'Over 0.5 2nd Half Goals' market odds exist in football-data.co.uk, so the claimed 1.60-vs-1.35-fair-odds edge and the described HT lay-hedge aren't computable — only the real hit-rate is shown. The 'wait 5 minutes into the second half' timing detail isn't verifiable either."};
    },
  });
}

/* ---------------- STRATEGY: MATCH ODDS → CORNERS CORRELATION (hit-rate only) ---------------- */
function evaluateOddsCornersCorrelation(matches, params){
  return evaluateHitRateStrategy(matches, params, {
    trigger(m, allMatches, p){
      if(m.home_corners===null || m.away_corners===null) return {dataMissing:true, reason:"This match row has no recorded corner counts (HC/AC columns)"};
      const fav = getFavourite(m);
      if(!fav) return {dataMissing:true, reason:"Home/Away odds not available"};
      if(fav.side===null) return {ok:false, reason:"No clear favourite (odds equal)"};
      const favOddsMax = Number(p.favOddsMax)||1.60;
      const ok = fav.favOdds<=favOddsMax;
      const favTeam = fav.side==="H"?m.home_team:m.away_team;
      return {ok, reason: ok?"":`Favourite odds ${fav.favOdds} above the ${favOddsMax} threshold`, side:fav.side, cols:{favourite:`${favTeam} (${fav.side})`, fav_odds:fav.favOdds}};
    },
    hitCheck(m, trig){
      const favCorners = trig.side==="H" ? m.home_corners : m.away_corners;
      const dogCorners = trig.side==="H" ? m.away_corners : m.home_corners;
      const hit = favCorners>dogCorners;
      return {hit, cols:{ corners:`${m.home_corners}-${m.away_corners}` },
        notes:(hit?"Match-winner favourite also had more corners — the correlation held.":"Match-winner favourite did NOT have more corners — the correlation didn't hold here.")+
          " This tests the real underlying correlation claim directly against real corner data — it does NOT replicate the literal 'two odds markets, arbitrage the gap' version, since no separate Corners Match Bet odds exist anywhere in football-data.co.uk to compare against the real 1X2 price. No P&L is computed either way."};
    },
  });
}

/* ---------------- STRATEGY: THE "HOT STREAK" FADE (Regression) — hit-rate only ---------------- */
function winStreakBefore(matches, team, beforeDateExclusive){
  const tm = matchesInvolving(matches, team).filter(m=>m.date && m.date<beforeDateExclusive).sort((a,b)=>b.date.localeCompare(a.date));
  let streak=0;
  for(const m of tm){ if(resultFor(m, team)==="W") streak++; else break; }
  return streak;
}
function evaluateHotStreakFade(matches, params){
  const minStreak = Number(params.minStreak)||5;
  return evaluateLaySideStrategy(matches, params, {
    pickSide(m, allMatches, p){
      const homeStreak = winStreakBefore(allMatches, m.home_team, m.date);
      const awayStreak = winStreakBefore(allMatches, m.away_team, m.date);
      if(homeStreak<minStreak && awayStreak<minStreak) return {ok:false, reason:`Neither team is on a real ${minStreak}+ game win streak (Home ${homeStreak}, Away ${awayStreak})`};
      const side = homeStreak>=awayStreak ? "H" : "A";
      const streakLen = Math.max(homeStreak, awayStreak);
      const hotTeam = side==="H"?m.home_team:m.away_team;
      return {ok:true, side, cols:{hot_team:hotTeam, win_streak:streakLen}};
    },
  });
}

/* ---------------- STRATEGY: THE "COLD STREAK" BACK (Reversion) — real staking ---------------- */
function evaluateColdStreakBack(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const minStreak = Number(params.minStreak)||5;
  const minOdds = Number(params.minOdds)||4.0;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    function lossStreak(team){
      const tm = matchesInvolving(matches, team).filter(mm=>mm.date && mm.date<m.date).sort((a,b)=>b.date.localeCompare(a.date));
      let streak=0; for(const mm of tm){ if(resultFor(mm, team)==="L") streak++; else break; }
      return streak;
    }
    const homeLossStreak = lossStreak(m.home_team);
    if(homeLossStreak<minStreak){
      notTriggered++; ledger.push({...base, home_loss_streak:homeLossStreak, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Home team not on a real ${minStreak}+ game losing streak (${homeLossStreak})`}); continue;
    }
    const odds = m.odds_B365H;
    if(odds===null){
      missing++; ledger.push({...base, home_loss_streak:homeLossStreak, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"No Home odds recorded for this match"}); continue;
    }
    if(odds<minOdds){
      notTriggered++; ledger.push({...base, home_loss_streak:homeLossStreak, home_odds:odds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Home odds ${odds} below the ${minOdds} value floor`}); continue;
    }
    if(!engine.eligible(odds)){
      notTriggered++; ledger.push({...base, home_loss_streak:homeLossStreak, home_odds:odds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue;
    }
    const won = m.full_time_result==="H";
    qualified++;
    const stake = engine.stakeFor(odds);
    const pnl = won ? (odds-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, home_loss_streak:homeLossStreak, home_odds:odds, score:`${m.home_goals}-${m.away_goals}`, status: won?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`No xG data exists in this source, so the 'xG close to 1.5+/game despite losing' underperformance check from the source method can't be verified — this uses only the real losing-streak length and real Home odds. Staked ${stake.toFixed(2)}u @ ${odds}`});

/* ============================================================================
   STRATEGY: COMPOSITE MULTI-FACTOR VALUE MODEL (real staking)
   Blends several already-real signals (form, venue split, H2H, table position,
   empirical home advantage) into one quality index per side via a weighted
   average, converts the gap to a win probability with a logistic transform,
   de-vigs the real bookmaker price, and dynamically bets whichever of
   Home/Draw/Away shows the largest edge — rather than being locked to one
   pre-chosen market. Every input is real and computed only from matches
   before the bet date; nothing here is fabricated or approximated beyond the
   modeling choices themselves (weights, logistic steepness), which are
   disclosed and configurable.
============================================================================ */
function leagueHomeAdvantageBefore(matches, league, season, beforeDateExclusive){
  const lm = matches.filter(m=>m.league===league && m.season===season && m.date && m.date<beforeDateExclusive && m.home_goals!==null && m.away_goals!==null && m.full_time_result && !m.invalid && !m.result_conflict);
  if(lm.length<20) return null;
  const homeWins = lm.filter(m=>m.full_time_result==="H").length, awayWins = lm.filter(m=>m.full_time_result==="A").length;
  return Number(((homeWins-awayWins)/lm.length).toFixed(3));
}
function compositeQualityIndex(matches, team, venue, opponent, beforeDate, table, totalTeams, params){
  const form = recentFormBefore(matches, team, beforeDate, Number(params.formWindow)||6);
  const venueForm = venueFormBefore(matches, team, venue, beforeDate);
  const h2h = h2hBefore(matches, team, opponent, beforeDate);
  const parts = [];
  if(form.played>0) parts.push({val: Math.min(1, form.ppg/3), weight: Number(params.formWeight)||0.30});
  if(venueForm.played>0 && venueForm.winPct!==null) parts.push({val: venueForm.winPct/100, weight: Number(params.venueWeight)||0.20});
  if(h2h.played>0) parts.push({val: h2h.aWins/h2h.played, weight: Number(params.h2hWeight)||0.15});
  if(form.played>0) parts.push({val: Math.max(0, Math.min(1, 0.5+(form.gfAvg-form.gaAvg)/4)), weight: Number(params.attackWeight)||0.15});
  if(table){ const row = table.find(t=>t.team===team); if(row){ const pos = table.findIndex(t=>t.team===team)+1; parts.push({val: totalTeams>1 ? (totalTeams-pos)/(totalTeams-1) : 0.5, weight: Number(params.positionWeight)||0.20}); } }
  if(parts.length===0) return null;
  const totalWeight = parts.reduce((s,p)=>s+p.weight,0);
  const score = parts.reduce((s,p)=>s+p.val*(p.weight/totalWeight),0);
  return {score, sampleParts: parts.length};
}
function devigThree(oh, od, oa){
  const ih=1/oh, id=1/od, ia=1/oa, sum=ih+id+ia;
  return {H: ih/sum, D: id/sum, A: ia/sum, overround: Number(((sum-1)*100).toFixed(2))};
}
function evaluateCompositeValueModel(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const useLeagueFilter = params.league && params.league!=="ALL" && params.season && params.season!=="ALL";
  const edgeThreshold = Number(params.edgeThreshold)||5;
  const sensitivity = Number(params.sensitivity)||4;
  const fallbackHomeAdv = Number(params.homeAdvantage)||0.06;
  const fallbackDrawRate = Number(params.fallbackDrawRate)||25;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    let table=null, totalTeams=0;
    if(useLeagueFilter){ table = computeLeagueTable(matches, m.league, m.season, m.date); table = rankTeams(table,"TOP"); totalTeams = table.length; }
    const homeQ = compositeQualityIndex(matches, m.home_team, "H", m.away_team, m.date, table, totalTeams, params);
    const awayQ = compositeQualityIndex(matches, m.away_team, "A", m.home_team, m.date, table, totalTeams, params);
    if(!homeQ || !awayQ){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough prior matches yet to build a composite quality index for one or both teams"}); continue;
    }
    const H=m.odds_open.H, D=m.odds_open.D, A=m.odds_open.A;
    if(H===null||D===null||A===null){
      missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"1X2 odds not available for this match"}); continue;
    }
    const homeAdv = useLeagueFilter ? (leagueHomeAdvantageBefore(matches, m.league, m.season, m.date) ?? fallbackHomeAdv) : fallbackHomeAdv;
    const diff = (homeQ.score - awayQ.score) + homeAdv;
    const pSplit = 1/(1+Math.exp(-diff*sensitivity));
    const drawRate = useLeagueFilter ? (leagueDrawRateBefore(matches, m.league, m.season, m.date).drawPct ?? fallbackDrawRate) : fallbackDrawRate;
    const pDraw = Math.max(0.05, Math.min(0.45, drawRate/100));
    const pHome = (1-pDraw)*pSplit, pAway = (1-pDraw)*(1-pSplit);
    const fair = devigThree(H,D,A);
    const edges = { H: Number(((pHome-fair.H)*100).toFixed(2)), D: Number(((pDraw-fair.D)*100).toFixed(2)), A: Number(((pAway-fair.A)*100).toFixed(2)) };
    const bestMarket = Object.keys(edges).reduce((best,k)=> edges[k]>edges[best] ? k : best, "H");
    const bestEdge = edges[bestMarket];
    if(bestEdge<=edgeThreshold){
      notTriggered++; ledger.push({...base, model_home_prob:Number((pHome*100).toFixed(1)), model_draw_prob:Number((pDraw*100).toFixed(1)), model_away_prob:Number((pAway*100).toFixed(1)), best_edge_pts:bestEdge, market:bestMarket, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Best edge (${bestMarket}, ${bestEdge}pts) doesn't clear the ${edgeThreshold}pt threshold`}); continue;
    }
    const odds = bestMarket==="H"?H:bestMarket==="D"?D:A;
    if(!engine.eligible(odds)){
      notTriggered++; ledger.push({...base, market:bestMarket, best_edge_pts:bestEdge, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue;
    }
    const won = bestMarket==="H" ? m.full_time_result==="H" : bestMarket==="D" ? m.full_time_result==="D" : m.full_time_result==="A";
    qualified++;
    const stake = engine.stakeFor(odds);
    const pnl = won ? (odds-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, model_home_prob:Number((pHome*100).toFixed(1)), model_draw_prob:Number((pDraw*100).toFixed(1)), model_away_prob:Number((pAway*100).toFixed(1)), overround_pct:fair.overround,
      market:bestMarket, best_edge_pts:bestEdge, score:`${m.home_goals}-${m.away_goals}`, status: won?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`Composite quality: home ${homeQ.score.toFixed(3)} (${homeQ.sampleParts} factors), away ${awayQ.score.toFixed(3)} (${awayQ.sampleParts} factors), home-adv ${homeAdv.toFixed(3)}${useLeagueFilter?' (empirical)':' (fallback default)'}, draw rate ${(pDraw*100).toFixed(1)}%${useLeagueFilter?' (empirical)':' (fallback default)'} — staked ${stake.toFixed(2)}u @ ${odds} on ${bestMarket}`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ============================================================================
   STRATEGY: DE-VIGGED CLOSING LINE VALUE (CLV) SELECTOR (real staking)
   Removes the bookmaker's overround from BOTH the opening and closing prices
   before measuring how much the fair (de-vigged) implied probability moved —
   the actual professional "smart money" signal, and a meaningfully more
   rigorous computation than a raw odds-percentage drop (odds space is not
   linear in probability, so raw % moves misrepresent the true shift,
   especially at short or long prices).
============================================================================ */
function evaluateClvSelector(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const minClvPts = Number(params.minClvPts)||3;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const oH=m.odds_open.H, oD=m.odds_open.D, oA=m.odds_open.A, cH=m.odds_close.H, cD=m.odds_close.D, cA=m.odds_close.A;
    if(oH===null||oD===null||oA===null||cH===null||cD===null||cA===null){
      missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Needs both opening AND closing 1X2 odds (requires the extended odds CSV) — one or both missing"}); continue;
    }
    const fairOpen = devigThree(oH,oD,oA), fairClose = devigThree(cH,cD,cA);
    const shifts = { H: Number(((fairClose.H-fairOpen.H)*100).toFixed(2)), D: Number(((fairClose.D-fairOpen.D)*100).toFixed(2)), A: Number(((fairClose.A-fairOpen.A)*100).toFixed(2)) };
    const bestMarket = Object.keys(shifts).reduce((best,k)=> shifts[k]>shifts[best] ? k : best, "H");
    const bestShift = shifts[bestMarket];
    if(bestShift<minClvPts){
      notTriggered++; ledger.push({...base, open_overround:fairOpen.overround, close_overround:fairClose.overround, market:bestMarket, clv_pts:bestShift, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Best de-vigged shift (${bestMarket}, ${bestShift}pts) doesn't clear the ${minClvPts}pt threshold`}); continue;
    }
    const closeOdds = bestMarket==="H"?cH:bestMarket==="D"?cD:cA;
    if(!engine.eligible(closeOdds)){
      notTriggered++; ledger.push({...base, market:bestMarket, clv_pts:bestShift, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue;
    }
    const won = bestMarket==="H" ? m.full_time_result==="H" : bestMarket==="D" ? m.full_time_result==="D" : m.full_time_result==="A";
    qualified++;
    const stake = engine.stakeFor(closeOdds);
    const pnl = won ? (closeOdds-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, open_fair_pct:Number((fairOpen[bestMarket]*100).toFixed(1)), close_fair_pct:Number((fairClose[bestMarket]*100).toFixed(1)), open_overround:fairOpen.overround, close_overround:fairClose.overround,
      market:bestMarket, clv_pts:bestShift, score:`${m.home_goals}-${m.away_goals}`, status: won?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`De-vigged fair prob moved from ${(fairOpen[bestMarket]*100).toFixed(1)}% to ${(fairClose[bestMarket]*100).toFixed(1)}% on ${bestMarket} (open overround ${fairOpen.overround}%, close ${fairClose.overround}%) — staked ${stake.toFixed(2)}u @ closing odds ${closeOdds}`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---- 1. REVERSE DROP FADE — bets AGAINST the biggest 1X2 mover, not with it ---- */
function evaluateReverseDropFade(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const threshold = Number(params.threshold)||10;
  const priceFloor = Number(params.priceFloor)||1.5;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;
  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const oH=m.odds_open.H, oA=m.odds_open.A, cH=m.odds_close.H, cA=m.odds_close.A;
    if(oH===null||oA===null||cH===null||cA===null){
      missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Needs opening AND closing Home/Away 1X2 odds"}); continue;
    }
    const dropH = ((oH-cH)/oH)*100, dropA = ((oA-cA)/oA)*100;
    const mover = dropH>=dropA ? "H" : "A";
    const moveAmt = mover==="H" ? dropH : dropA;
    if(moveAmt<threshold){
      notTriggered++; ledger.push({...base, home_drop_pct:Number(dropH.toFixed(2)), away_drop_pct:Number(dropA.toFixed(2)), status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Biggest 1X2 mover (${mover}, ${moveAmt.toFixed(2)}%) doesn't clear the ${threshold}% threshold`}); continue;
    }

    if(fadeOdds<priceFloor || !engine.eligible(fadeOdds)){
      notTriggered++; ledger.push({...base, mover, move_pct:Number(moveAmt.toFixed(2)), status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Fade side (${fadeSide}) closing odds ${fadeOdds} below price floor ${priceFloor}, or staking plan odds requirement not met`}); continue;
    }

    qualified++;
    const stake = engine.stakeFor(fadeOdds);
    const pnl = won ? (fadeOdds-1)*stake : -stake;
    engine.settle(won, pnl);
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    if(won) wins++; else losses++;
    ledger.push({...base, mover, move_pct:Number(moveAmt.toFixed(2)), selection:fadeSide==="H"?"Home":"Away", stake_units:Number(stake.toFixed(4)), close_odds:fadeOdds, score:`${m.home_goals}-${m.away_goals}`, status:won?"WIN":"LOSS", pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`${mover} shortened ${moveAmt.toFixed(2)}% — faded by backing ${fadeSide} instead, staked ${stake.toFixed(2)}u @ ${fadeOdds}`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    if(won) wins++; else losses++;
    ledger.push({...base, side, selection:side==="H"?"Home":"Away", stake_units:Number(stake.toFixed(4)), close_odds:closeOdds, score:`${m.home_goals}-${m.away_goals}`, status:won?"WIN":"LOSS", pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),

/* ---------------- STRATEGY: DOUBLE CHANCE VALUE FINDER ---------------- */
function evaluateDoubleChanceValue(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const side = params.side || "1X"; // "1X", "X2", or "12"
  const minEdgePct = Number(params.minEdgePct)||0;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const H=m.odds_open.H, D=m.odds_open.D, A=m.odds_open.A;
    if(H===null||D===null||A===null){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Home/Draw/Away odds not available"}); continue; }
    // Real Double Chance market odds. This field does not exist in football-data.co.uk imports
    // (a plain 1X2/O-U-2.5/AH-only source) — needs a source like API-Football's Double Chance
    // market, not yet wired into this app's import pipeline.
    const dcKey = side==="1X"?"oneX":side==="X2"?"x2":"oneTwo";
    const dcOdds = m.odds_open.doubleChance?.[dcKey] ?? null;
    if(dcOdds===null){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Real Double Chance market odds not available in the currently imported data — needs a data source that carries this market (e.g. API-Football), not yet wired in"}); continue; }
    // Fair, de-vigged probability of the two covered outcomes, computed from the real 1X2 odds.
    const invH=1/H, invD=1/D, invA=1/A, overround=invH+invD+invA;
    const fairH=invH/overround, fairD=invD/overround, fairA=invA/overround;
    const fairCovered = side==="1X" ? fairH+fairD : side==="X2" ? fairD+fairA : fairH+fairA;
    const dcImpliedProb = 1/dcOdds;
    const edgePct = Number(((fairCovered-dcImpliedProb)*100).toFixed(2)); // positive = DC price is generous vs fair 1X2-derived probability
    if(!(edgePct>=minEdgePct)){ notTriggered++; ledger.push({...base, dc_side:side, dc_odds:dcOdds, fair_prob_pct:Number((fairCovered*100).toFixed(1)), edge_pct:edgePct, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Edge ${edgePct}% below the ${minEdgePct}% minimum`}); continue; }
    if(!engine.eligible(dcOdds)){ notTriggered++; ledger.push({...base, dc_side:side, dc_odds:dcOdds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    qualified++;
    const stake = engine.stakeFor(dcOdds);
    const covered = side==="1X" ? (m.full_time_result==="H"||m.full_time_result==="D") : side==="X2" ? (m.full_time_result==="D"||m.full_time_result==="A") : (m.full_time_result==="H"||m.full_time_result==="A");
    const pnl = covered ? stake*(dcOdds-1) : -stake;
    engine.settle(covered, pnl);
    if(covered) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, dc_side:side, dc_odds:dcOdds, fair_prob_pct:Number((fairCovered*100).toFixed(1)), edge_pct:edgePct, final_score:`${m.home_goals}-${m.away_goals}`, status:covered?"WIN":"LOSS",
      stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`Backed real Double Chance ${side} @ ${dcOdds} (fair prob from real 1X2 odds: ${(fairCovered*100).toFixed(1)}%, edge ${edgePct}%).`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: CARD-COUNT TOTAL OVER ---------------- */
function cardFormBefore(matches, team, beforeDateExclusive, n){
  const vm = matches.filter(m=>m.date && m.date<beforeDateExclusive && m.home_yellow!==null && m.away_yellow!==null && m.home_red!==null && m.away_red!==null && (m.home_team===team||m.away_team===team)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(vm.length===0) return {played:0, avgFor:null, avgAgainst:null};
  let cf=0,ca=0;
  vm.forEach(m=>{
    const isHome=m.home_team===team;
    const teamCards = (isHome?m.home_yellow:m.away_yellow)+(isHome?m.home_red:m.away_red);
    const oppCards = (isHome?m.away_yellow:m.home_yellow)+(isHome?m.away_red:m.home_red);
    cf += teamCards; ca += oppCards;
  });
  return {played:vm.length, avgFor:Number((cf/vm.length).toFixed(2)), avgAgainst:Number((ca/vm.length).toFixed(2))};
}
function evaluateCardCountTotalOver(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const nForm = Number(params.formWindow)||8;
  const minExpectedCards = Number(params.minExpectedCards)||4.5;
  const cardsLine = Number(params.cardsLine)||4.5;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_yellow===null||m.away_yellow===null||m.home_red===null||m.away_red===null){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"This match row has no recorded card counts — cannot verify actual outcome"}); continue;
    }
    const homeCards = cardFormBefore(matches, m.home_team, m.date, nForm);
    const awayCards = cardFormBefore(matches, m.away_team, m.date, nForm);
    if(homeCards.avgFor===null || awayCards.avgFor===null){ missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough prior matches yet to compute card averages for one or both teams"}); continue; }
    const expectedCards = Number(((homeCards.avgFor+homeCards.avgAgainst+awayCards.avgFor+awayCards.avgAgainst)/2).toFixed(2));
    if(!(expectedCards>=minExpectedCards)){ notTriggered++; ledger.push({...base, expected_cards:expectedCards, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Expected total cards ${expectedCards} below the ${minExpectedCards} threshold`}); continue; }
    // Real Cards Over/Under market odds. Does not exist in football-data.co.uk (no cards-market
    // column at all) — needs a source like API-Football's Cards market, not yet wired in.
    const overOdds = m.odds_open.CardsOver ?? null;
    if(overOdds===null){ missing++; ledger.push({...base, expected_cards:expectedCards, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Real Cards Over/Under market odds not available in the currently imported data — needs a data source that carries this market (e.g. API-Football), not yet wired in"}); continue; }
    if(!engine.eligible(overOdds)){ notTriggered++; ledger.push({...base, expected_cards:expectedCards, cards_over_odds:overOdds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    qualified++;
    const stake = engine.stakeFor(overOdds);
    const actualCards = m.home_yellow+m.away_yellow+m.home_red+m.away_red;
    const won = actualCards>cardsLine;
    const pnl = won ? stake*(overOdds-1) : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, expected_cards:expectedCards, cards_over_odds:overOdds, actual_cards:actualCards, status:won?"WIN":"LOSS",
      stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`Home cards for/against ${homeCards.avgFor}/${homeCards.avgAgainst}, Away ${awayCards.avgFor}/${awayCards.avgAgainst} — backed real Cards Over ${cardsLine} @ ${overOdds}.`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: BTTS YES — LEAKY DEFENSE MATCHUP ---------------- */
function evaluateBttsLeakyDefense(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const nForm = Number(params.formWindow)||6;
  const minFavAttack = Number(params.minFavAttack)||1.4;
  const minUnderdogLeak = Number(params.minUnderdogLeak)||1.4;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const fav = getFavourite(m);
    if(!fav){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Home/Away odds not available"}); continue; }
    if(fav.side===null){ notTriggered++; ledger.push({...base, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"No clear favourite (odds equal)"}); continue; }
    const favTeam = fav.side==="H"?m.home_team:m.away_team, dogTeam = fav.side==="H"?m.away_team:m.home_team;
    // Asymmetric matchup check — distinct from the existing BTTS Stats Predict strategy, which
    // requires BOTH teams to clear the same scoring/conceding thresholds symmetrically. Here we
    // check only the FAVOURITE's real attacking rate and only the UNDERDOG's real conceding rate.
    const favAttack = venueGoalStatsBefore(matches, favTeam, fav.side, m.date, nForm);
    const dogConcede = venueGoalStatsBefore(matches, dogTeam, fav.side==="H"?"A":"H", m.date, nForm);
    if(favAttack.gfAvg===null || dogConcede.gaAvg===null){ missing++; ledger.push({...base, favourite:`${favTeam} (${fav.side})`, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough prior matches yet to compute goal averages for one or both teams"}); continue; }
    const matchupOk = favAttack.gfAvg>=minFavAttack && dogConcede.gaAvg>=minUnderdogLeak;
    if(!matchupOk){ notTriggered++; ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_attack_avg:favAttack.gfAvg, underdog_concede_avg:dogConcede.gaAvg, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Doesn't clear thresholds (favourite attack ${favAttack.gfAvg} / underdog concede ${dogConcede.gaAvg})`}); continue; }
    // Real BTTS Yes market odds. Not in football-data.co.uk — needs a source like API-Football's

    const bttsOdds = m.odds_open.BTTSYes ?? null;
    if(bttsOdds===null){ missing++; ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_attack_avg:favAttack.gfAvg, underdog_concede_avg:dogConcede.gaAvg, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Real BTTS market odds not available in the currently imported data — needs a data source that carries this market (e.g. API-Football), not yet wired in"}); continue; }
    if(!engine.eligible(bttsOdds)){ notTriggered++; ledger.push({...base, favourite:`${favTeam} (${fav.side})`, btts_odds:bttsOdds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    qualified++;
    const stake = engine.stakeFor(bttsOdds);
    const won = m.home_goals>0 && m.away_goals>0;
    const pnl = won ? stake*(bttsOdds-1) : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_attack_avg:favAttack.gfAvg, underdog_concede_avg:dogConcede.gaAvg, btts_odds:bttsOdds, final_score:`${m.home_goals}-${m.away_goals}`, status:won?"WIN":"LOSS",
      stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`${favTeam} real attack avg ${favAttack.gfAvg}, ${dogTeam} real concede avg ${dogConcede.gaAvg} — backed real BTTS Yes @ ${bttsOdds}.`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

  const minUnderdogLeak = Number(params.minUnderdogLeak)||1.3;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(!m.half_time_result || m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Half-time or full-time result unavailable, invalid, or conflicting row"}); continue;
    }
    const fav = getFavourite(m);
    if(!fav){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Home/Away odds not available"}); continue; }
    // Distinct trigger from both THE_SHAUNEE (flat favourite-odds threshold, targets HT-Draw/FT-Fav)
    // and HTFT_DUTCH_LAY_BOTH (targets HT level for evenly-matched teams). Here we require the HOME
    // team specifically to be favourite, facing a real weak-away-defense underdog — targeting the
    // Home/Home combo specifically.
    if(fav.side!=="H"){ notTriggered++; ledger.push({...base, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Home team is not the favourite"}); continue; }
    const awayConcede = venueGoalStatsBefore(matches, m.away_team, "A", m.date, nForm);
    if(awayConcede.gaAvg===null){ missing++; ledger.push({...base, favourite:`${m.home_team} (H)`, fav_odds:fav.favOdds, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough prior away matches yet to compute the underdog's real away-conceding average"}); continue; }
    if(!(awayConcede.gaAvg>=minUnderdogLeak)){ notTriggered++; ledger.push({...base, favourite:`${m.home_team} (H)`, fav_odds:fav.favOdds, underdog_away_concede_avg:awayConcede.gaAvg, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Away underdog's real away-conceding average ${awayConcede.gaAvg} below the ${minUnderdogLeak} threshold`}); continue; }
    // Real HT/FT combo market odds ("HH" = Home leads at HT and wins at FT). Not in football-data.co.uk
    // (a different proposition market to the plain 1X2 odds this data does carry) — needs a source
    // like API-Football's HT/FT market, not yet wired into this app's import pipeline.
    const htftOdds = m.odds_open.htft?.["HH"] ?? null;
    if(htftOdds===null){ missing++; ledger.push({...base, favourite:`${m.home_team} (H)`, fav_odds:fav.favOdds, underdog_away_concede_avg:awayConcede.gaAvg, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Real HT/FT combo market odds not available in the currently imported data — needs a data source that carries this market (e.g. API-Football), not yet wired in"}); continue; }
    if(!engine.eligible(htftOdds)){ notTriggered++; ledger.push({...base, favourite:`${m.home_team} (H)`, htft_odds:htftOdds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    qualified++;
    const stake = engine.stakeFor(htftOdds);
    const won = m.half_time_result==="H" && m.full_time_result==="H";
    const pnl = won ? stake*(htftOdds-1) : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, favourite:`${m.home_team} (H)`, fav_odds:fav.favOdds, underdog_away_concede_avg:awayConcede.gaAvg, htft_odds:htftOdds, ht_result:m.half_time_result, ft_result:m.full_time_result, final_score:`${m.home_goals}-${m.away_goals}`, status:won?"WIN":"LOSS",
      stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`${m.away_team} real away-conceding average ${awayConcede.gaAvg} — backed real HT/FT Home/Home @ ${htftOdds}.`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}
