============================================================================ */
function downloadCSV(filename, rows){
  if(!rows.length) return;
  const headers = Object.keys(rows[0]);
  const esc = v => { const s = v===null||v===undefined ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = [headers.join(","), ...rows.map(r=>headers.map(h=>esc(r[h])).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function downloadJSON(filename, data){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function qualityTone(q){ return q==="COMPLETE"?"good":q==="PARTIAL"?"warn":"bad"; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================================
   TINY SVG CHARTS
============================================================================ */
function svgBarChart(data, w=560, h=220){
  if(!data.length) return `<div class="empty-state">No data</div>`;
  const max = Math.max(1, ...data.map(d=>d.value));
  const padL=36, padB=26, padT=10, padR=10;
  const cw = w-padL-padR, ch = h-padT-padB;
  const bw = cw/data.length*0.6, gap = cw/data.length;
  let bars = "", labels = "";
  data.forEach((d,i)=>{
    const bh = (d.value/max)*ch;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + ch - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="var(--accent)" rx="3"/>`;
    labels += `<text x="${(x+bw/2).toFixed(1)}" y="${h-8}" font-size="10" fill="var(--ink-faint)" text-anchor="middle" font-family="var(--bf)">${esc(d.label)}</text>`;
  });
  const gridY = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + ch - f*ch;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y+3}" font-size="9" fill="var(--ink-faint)" text-anchor="end" font-family="var(--mf)">${Math.round(f*max)}</text>`;
  }).join("");
  return `<svg class="svg-chart" viewBox="0 0 ${w} ${h}">${gridY}${bars}${labels}</svg>`;
}
function svgDonutChart(data, w=260, h=220){
  const total = data.reduce((s,d)=>s+d.value,0);
  const cx=w/2, cy=h/2-6, rOuter=70, rInner=42;
  if(total===0) return `<div class="empty-state">No data</div>`;
  let angle = -Math.PI/2, paths="";
  data.forEach(d=>{
    if(d.value<=0) return;
    const frac = d.value/total, sweep = frac*Math.PI*2;
    const x1 = cx+rOuter*Math.cos(angle), y1 = cy+rOuter*Math.sin(angle);
    const x2 = cx+rOuter*Math.cos(angle+sweep), y2 = cy+rOuter*Math.sin(angle+sweep);
    const ix1 = cx+rInner*Math.cos(angle+sweep), iy1 = cy+rInner*Math.sin(angle+sweep);
    const ix2 = cx+rInner*Math.cos(angle), iy2 = cy+rInner*Math.sin(angle);
    const large = sweep>Math.PI ? 1 : 0;
    paths += `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${ix1.toFixed(2)} ${iy1.toFixed(2)} A ${rInner} ${rInner} 0 ${large} 0 ${ix2.toFixed(2)} ${iy2.toFixed(2)} Z" fill="${d.color}"/>`;
    angle += sweep;
  });
  return `<svg class="svg-chart" viewBox="0 0 ${w} ${h}">${paths}</svg>`;
}
function svgAreaChart(data, w=680, h=220){
  if(!data.length) return `<div class="empty-state">No qualified bets yet</div>`;
  const padL=42, padB=24, padT=10, padR=10;
  const cw = w-padL-padR, ch = h-padT-padB;
  const values = data.map(d=>d.value);
  const max = Math.max(0.0001, ...values), min = Math.min(0, ...values);
  const range = (max-min)||1;
  const xStep = data.length>1 ? cw/(data.length-1) : 0;
  const pt = (i,v) => {
    const x = padL + i*xStep;
    const y = padT + ch - ((v-min)/range)*ch;
    return [x,y];
  };
  let linePts = data.map((d,i)=>pt(i,d.value).join(",")).join(" ");
  const zeroY = (padT + ch - ((0-min)/range)*ch).toFixed(1);
  const areaPts = `${padL},${zeroY} ${linePts} ${(padL+(data.length-1)*xStep).toFixed(1)},${zeroY}`;
  const gridY = [0,0.5,1].map(f=>{
    const v = min + f*range, y = padT+ch-f*ch;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)"/><text x="${padL-6}" y="${y+3}" font-size="9" fill="var(--ink-faint)" text-anchor="end" font-family="var(--mf)">${v.toFixed(1)}</text>`;
  }).join("");
  return `<svg class="svg-chart" viewBox="0 0 ${w} ${h}">${gridY}
    <polygon points="${areaPts}" fill="var(--accent-dim)" opacity="0.45"/>
    <polyline points="${linePts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
  </svg>`;
}

  simpleOptimize(){
    const id = this.ui.simple.selectedId;
    const def = STRATEGIES.find(s=>s.id===id);
    if(!def) return;
    const special = SIMPLE_MODE_SPECIAL_REQUIREMENTS[id];
    if(!this.ui.simple.leagueValue) return; // safety guard — league is always chosen before this button can appear
    let baseParams = { league:this.ui.simple.leagueValue, season: special==="leagueSeason" ? "ALL" : this.ui.simple.seasonValue, dateFrom:"", dateTo:"" };
    if(special==="leagueSeason" && this.ui.simple.pickValue){
      baseParams.season = this.ui.simple.pickValue;
    } else if(special==="team" && this.ui.simple.pickValue){
      baseParams.team = this.ui.simple.pickValue;
    }
    const maxDrawdownUnits = this.ui.simple.maxDrawdownCapUnits;
    const matches = special==="team" ? this.allMatches() : this.filterMatchesByTeam(this.allMatches(), this.ui.simple.teamValue);
    let result;
    try{ result = runOptimization(matches, def, baseParams, {maxDrawdownUnits}); }
    catch(e){ result = {error:"Something went wrong trying to improve this — please try again."}; }
    if(!result.error){
      try{
        const provenRows = (result.top||[])
          .sort((a,b)=> result.usesPnl ? (b.result.netPnl??-Infinity)-(a.result.netPnl??-Infinity) : (b.result.winRate??-Infinity)-(a.result.winRate??-Infinity));
        if(provenRows.length){
          const best = provenRows[0];
          // Full, un-summarized breakdown of the winning combo — same shape every strategy's
          // run() always returns (finalizeStrategyResult) — so we can show the exact same
          // "In Scope / Triggered / Missing Data / ... / running P&L chart" detail that "See How
          // It Did" and the staking-plan breakdown modal already show. Nothing new is computed
          // here beyond what runOptimization already computed for this exact combo — this just
          // re-runs it once more to keep the full ledger instead of the summary numbers.
          const bestFullParams = { ...JSON.parse(JSON.stringify(def.defaultParams||{})), ...baseParams, ...best.params };
          if(result.supportsStaking && best.stakingPlan){
            bestFullParams.stakingPlan = best.stakingPlan;
            bestFullParams.stakingParams = defaultStakingParamsForPlan(best.stakingPlan);
          }
          result.bestFull = def.run(matches, bestFullParams);
        }
      } catch(e){ /* if this side calculation fails, the main optimize result above still stands on its own */ }
    }
    result.maxDrawdownCapUnits = maxDrawdownUnits;
    this.ui.simple.optimizeResult = result;
    this.ui.simple.optimizeRunning = false;
    this.render();
  },
  runSimpleNow(){
    const id = this.ui.simple.selectedId;
    const def = STRATEGIES.find(s=>s.id===id);
    if(!def) return;
    const special = SIMPLE_MODE_SPECIAL_REQUIREMENTS[id];
    if(special==="unsupported"){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg=null; return; }
    if(!this.ui.simple.leagueValue){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg=null; return; } // waiting on the League step
    // The generic team filter is skipped when this strategy already has its own dedicated team
    // picker (special==="team") — for those, "team" is core to the strategy's own logic (e.g.
    // tracking one team's draw streak), not just a scope filter, and is chosen in its own step
    // below rather than the general Team dropdown on the League step.
    const matches = special==="team" ? this.allMatches() : this.filterMatchesByTeam(this.allMatches(), this.ui.simple.teamValue);
    let baseParams = { ...JSON.parse(JSON.stringify(def.defaultParams||{})), league:this.ui.simple.leagueValue, season: special==="leagueSeason" ? "ALL" : this.ui.simple.seasonValue, dateFrom:"", dateTo:"" };
    if(special==="leagueSeason"){
      if(!this.ui.simple.pickValue){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg=null; return; }
      baseParams.season = this.ui.simple.pickValue;
    } else if(special==="team"){
      if(!this.ui.simple.pickValue){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg=null; return; }
      baseParams.team = this.ui.simple.pickValue;
    }
    const usesPnl = !def.pnlUnavailable;
    const supportsStaking = "stakingPlan" in (def.defaultParams||{});

    // Real-money strategies that support staking plans: run once per plan so they can all be
    // compared side by side on one page, instead of picking one plan blind.
    if(usesPnl && supportsStaking){
      const rows = [];
      let anyScopeZero = false, anyError = null;
      for(const plan of STAKING_PLANS){
        const params = { ...baseParams, stakingPlan: plan.id, stakingParams: defaultStakingParamsForPlan(plan.id) };
        let res;
        try{ res = def.run(matches, params); }
        catch(e){ anyError = "Something went wrong trying this one — please try a different idea, or switch to the Full Tool for details."; break; }
        if(res.error){ anyError = res.error; break; }
        // Simulate a real client walking away once their own personal maximum acceptable
        // drawdown is hit (set on the Home page) — without this, a progression plan like
        // Fibonacci or Martingale can escalate its stake without limit on a long losing streak,
        // producing an astronomical, practically meaningless number instead of what a real
        // person would actually experience before stopping.
        res = applyDrawdownStopLoss(res, this.ui.simple.maxDrawdownCapUnits);
        if((res.scopeCount||0)===0){ anyScopeZero = true; }
        rows.push({ planId: plan.id, planLabel: plan.label.replace(/^\d+\.\s*/,""), res });
      }
      if(anyError){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg=anyError; return; }
      if(anyScopeZero && !special){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg="No matching games found in your data for this one yet — try adding more games."; return; }
      rows.sort((a,b)=> (b.res.netPnl??-Infinity) - (a.res.netPnl??-Infinity));
      this.ui.simple.errorMsg = null; this.ui.simple.result = null;
      this.ui.simple.stakingResults = rows;
      return;
    }

    // Everything else (hit-rate-only strategies, or real-money strategies with a fixed $ stake
    // instead of a staking plan): single result, same as before.
    let res;
    try{ res = def.run(matches, baseParams); }
    catch(e){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg="Something went wrong trying this one — please try a different idea, or switch to the Full Tool for details."; return; }
    if(res.error){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg=res.error; return; }
    if(!special && (res.scopeCount||0)===0){ this.ui.simple.result=null; this.ui.simple.stakingResults=null; this.ui.simple.errorMsg="No matching games found in your data for this one yet — try adding more games."; return; }
    this.ui.simple.errorMsg = null; this.ui.simple.stakingResults = null;
    this.ui.simple.result = res;
  },

  simpleOptimizeBlockHtml(def){

      } else {
        const usesPnl = or.usesPnl;
        const provenRows = (or.top||[])
          .sort((a,b)=> usesPnl ? (b.result.netPnl??-Infinity)-(a.result.netPnl??-Infinity) : (b.result.winRate??-Infinity)-(a.result.winRate??-Infinity));
        if(provenRows.length===0){
          const capNote = (or.maxDrawdownUnits!==null && or.excludedByDrawdownCap>0)
            ? ` ${or.excludedByDrawdownCap} setting${or.excludedByDrawdownCap===1?"":"s"} had enough games but blew past the ${or.maxDrawdownCapUnits!==null?or.maxDrawdownCapUnits+'u':'drawdown'} limit you set — try raising it or picking "No limit."`
            : "";
          resultHtml = `<div class="field-note" style="margin-top:16px;font-size:24px;">We tried ${or.totalCombosEvaluated} different settings, but none of them had enough real games to trust yet — the default settings above may already be as good as we can confirm right now. Try adding more games and check again later.${capNote}</div>`;
        } else {
          const best = provenRows[0];
          const settingsText = humanizeParams(best.params, def);

            ? (STAKING_PLANS.find(p=>p.id===best.stakingPlan)?.label||best.stakingPlan).replace(/^\d+\.\s*/,"")
            : null;
          const bestRate = usesPnl ? best.result.roi : best.result.winRate;
          const improved = usesPnl ? best.result.netPnl>0 : (bestRate!==null && bestRate>=55);
          let emoji, verdict, verdictColor;
          if(improved){ emoji="🎉"; verdict="We found a good setting!"; verdictColor="var(--accent)"; }

          // The same full, real, detailed breakdown available everywhere else in Simple Mode

          </div>

    const leagueBadge = `<div class="row" style="align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;">
      <div class="field-note" style="font-size:14px;color:var(--ink-dim);">League: <b>${esc(this.ui.simple.leagueValue)}</b> <a href="#" onclick="event.preventDefault();App.simpleConfirmLeague('');" style="margin-left:8px;">change</a></div>
      ${special!=="leagueSeason" ? `
      <div style="display:flex;align-items:center;gap:8px;">
        <label class="field-label" style="margin:0;">Season</label>
        <select onchange="App.simpleSetSeason(this.value)" style="min-width:130px;font-size:14px;padding:6px 8px;">
          <option value="ALL" ${this.ui.simple.seasonValue==="ALL"?"selected":""}>All seasons</option>
          ${this.seasonsForLeague(this.ui.simple.leagueValue).map(s=>`<option value="${esc(s)}" ${this.ui.simple.seasonValue===s?"selected":""}>${esc(s)}</option>`).join("")}
        </select>
      </div>` : ""}
      ${special!=="team" ? `
      <div style="display:flex;align-items:center;gap:8px;">
        <label class="field-label" style="margin:0;">Team</label>
        <select onchange="App.simpleSetTeam(this.value)" style="min-width:180px;font-size:14px;padding:6px 8px;">
          <option value="ALL" ${this.ui.simple.teamValue==="ALL"?"selected":""}>All teams</option>
          ${this.teamsForResearch(this.ui.simple.leagueValue,this.ui.simple.seasonValue).map(t=>`<option value="${esc(t)}" ${this.ui.simple.teamValue===t?"selected":""}>${esc(t)}</option>`).join("")}
        </select>
      </div>` : ""}
    </div>`;
    // Step 2, only for strategies that need one more specific pick beyond the league.
    if(special && !this.ui.simple.pickValue && !this.ui.simple.result && !this.ui.simple.stakingResults && !this.ui.simple.errorMsg){
      let pickerHtml = "";
      if(special==="leagueSeason"){
        const seasonsList = this.seasonsForLeague(this.ui.simple.leagueValue);
        pickerHtml = `
          <div class="field-note" style="margin-bottom:14px;font-size:15px;">This one also needs a specific season — it looks at real league standings.</div>
          <select onchange="App.simpleConfirmPick(this.value)" style="max-width:420px;font-size:16.5px;padding:10px;">
            <option value="">Choose a season...</option>
            ${seasonsList.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}
          </select>`;
      } else if(special==="team"){
        const teams = [...new Set(this.allMatches().filter(m=>m.league===this.ui.simple.leagueValue).flatMap(m=>[m.home_team,m.away_team]))].sort();
        pickerHtml = `
          <div class="field-note" style="margin-bottom:14px;font-size:15px;">This one also needs a specific team, from the league you picked.</div>
          <select onchange="App.simpleConfirmPick(this.value)" style="max-width:420px;font-size:16.5px;padding:10px;">
            <option value="">Choose a team...</option>
            ${teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}

      return `<div class="card" style="padding:32px;max-width:700px;">${backBtn}

    if(this.ui.simple.errorMsg){
      return `<div class="card" style="padding:32px;max-width:700px;">${backBtn}

        ${leagueBadge}
        <div class="field-note" style="font-size:15px;">${esc(this.ui.simple.errorMsg)}</div>
      </div>`;
    }

    // --- Staking-plan comparison view: all 13 plans on one page, best first ---
    if(this.ui.simple.stakingResults){
      const rows = this.ui.simple.stakingResults;
      const rowHtml = rows.map(r=>{
        const qualified = r.res.qualified||0;
        const winRate = r.res.winRate;
        let emoji, color;
        if(qualified===0){ emoji="😐"; color="var(--ink-dim)"; }
        else if(r.res.netPnl>0){ emoji="😃"; color="var(--accent)"; }
        else if(r.res.netPnl<0){ emoji="😕"; color="#e5484d"; }
        else { emoji="😐"; color="var(--ink-dim)"; }
        const hasDollars = qualified>0 && r.res.netPnl!==null && r.res.netPnl!==undefined && !isNaN(r.res.netPnl);
        const dollars = hasDollars
          ? `<span style="color:${color};font-weight:700;">${r.res.netPnl>=0?'+':'-'}${Math.abs(r.res.netPnl).toFixed(2)}u</span>` : "—";
        const perBet = hasDollars ? (r.res.netPnl/qualified) : null;
        const perBetText = perBet!==null ? ` • averaging <b>${perBet>=0?'+':'-'}${Math.abs(perBet).toFixed(2)}u per bet</b>` : "";
        return `
          <div class="card" style="padding:22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;cursor:pointer;" onclick="App.simpleExpandPlan('${r.planId}')" title="Click for the full details">
            <div style="font-size:28.5px;">${emoji}</div>
            <div style="flex:1;min-width:220px;">
              <div style="font-size:18px;font-weight:700;">${esc(r.planLabel)}</div>
              <div class="field-note" style="font-size:15.5px;color:var(--ink-dim);margin-top:4px;">${r.res.scopeCount||0} games in scope → <b>${qualified}</b> actually placed a bet (this rule didn't trigger on the rest) • won ${winRate!==null&&winRate!==undefined?winRate+'%':'—'} of the time${perBetText}</div>
            </div>
            <div style="font-size:21px;">${dollars}</div>
            <div style="font-size:11px;color:var(--ink-faint);">Click for details →</div>
          </div>`;
      }).join("");
      return `
        <div style="max-width:900px;">
          ${backBtn}
          <div style="font-size:24px;font-weight:700;margin-bottom:6px;">${esc(displayName)}</div>
          ${leagueBadge}
          <div class="field-note" style="font-size:17px;color:var(--ink-dim);margin-bottom:22px;">Every way of sizing your bets, compared side by side on your real games. Best total first. Assumes 1 unit as your base bet size. Click any row for the full breakdown.</div>
          <div class="field-note" style="font-size:14px;color:var(--ink-dim);margin-bottom:18px;background:var(--panel2);padding:10px 14px;border-radius:6px;">⚠️ Some plans here were tested on far more (or fewer) real games than others — a small number of games can swing the total a lot. When comparing rows, look at "per bet" first, not just the total.</div>
          <div style="display:flex;flex-direction:column;gap:14px;">${rowHtml}</div>
          <div class="field-note" style="margin-top:22px;font-size:13.5px;">This only looks at real past games — it's not a guarantee about what happens next. Always double-check before betting real money.</div>
          <button class="btn" style="margin-top:16px;font-size:16.5px;padding:12px 20px;" onclick="App.simpleTry('${id}')">🔄 Try Again</button>
          ${this.simpleOptimizeBlockHtml(def)}
        </div>`;
    }

    const res = this.ui.simple.result;
    if(!res) return `<div class="card" style="padding:32px;">${backBtn}Loading...</div>`;
    const usesPnl = !def.pnlUnavailable;
    const qualified = res.qualified||0;
    const winRate = res.winRate;
    let emoji, verdict, verdictColor;
    if(qualified===0){ emoji="😐"; verdict="Not enough games yet to tell."; verdictColor="var(--ink-dim)"; }
    else if(usesPnl){
      if(res.netPnl>0){ emoji="😃"; verdict="This made money on your real games!"; verdictColor="var(--accent)"; }
      else if(res.netPnl<0){ emoji="😕"; verdict="This lost money on your real games."; verdictColor="#e5484d"; }
      else { emoji="😐"; verdict="This broke even on your real games."; verdictColor="var(--ink-dim)"; }
    } else {
      if(winRate!==null && winRate!==undefined && winRate>=55){ emoji="😃"; verdict="This looks promising!"; verdictColor="var(--accent)"; }
      else if(winRate!==null && winRate!==undefined && winRate>=45){ emoji="😐"; verdict="This is roughly a coin flip."; verdictColor="var(--ink-dim)"; }
      else { emoji="😕"; verdict="This doesn't look strong yet."; verdictColor="#e5484d"; }
    }
    const unitMult = this.simpleUnitMultiplier(def);
    const perBetAvg = (usesPnl && qualified>0 && res.netPnl!==null && res.netPnl!==undefined && !isNaN(res.netPnl)) ? (res.netPnl*unitMult/qualified) : null;
    const dollarLine = (perBetAvg!==null)
      ? `<div style="font-size:25px;margin-top:14px;text-align:center;">If you had bet <b>1 unit</b> every time: you'd be <b style="color:${res.netPnl>=0?'var(--accent)':'#e5484d'};">${res.netPnl>=0?'up':'down'} ${Math.abs(res.netPnl*unitMult).toFixed(2)}u</b> from where you started.</div>
         <div class="field-note" style="text-align:center;font-size:21px;margin-top:4px;">That's an average of <b>${perBetAvg>=0?'+':'-'}${Math.abs(perBetAvg).toFixed(2)}u per bet</b> across ${qualified} real games — the fairest number to compare against "Optimize This" below, since that test usually runs on a different number of games.</div>`
      : "";
    return `
      <div class="card" style="padding:40px;max-width:none;width:100%;box-sizing:border-box;">
        ${backBtn}
        <div style="font-size:29px;font-weight:700;margin-bottom:18px;">${esc(displayName)}</div>
        ${leagueBadge}
        <div style="text-align:center;padding:16px 0;">
          <div style="font-size:72px;">${emoji}</div>
          <div style="font-size:27px;font-weight:700;color:${verdictColor};margin-top:8px;">${esc(verdict)}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px;">
          <div class="stat-cell" style="text-align:center;padding:20px;"><div class="field-label" style="font-size:24px;">Real Games Tested</div><div style="font-size:34px;font-weight:700;">${qualified}</div><div class="field-note" style="font-size:14px;margin-top:2px;">out of ${res.scopeCount||0} games in scope for this league/season/team</div></div>
          <div class="stat-cell" style="text-align:center;padding:20px;"><div class="field-label" style="font-size:24px;">How Often It Won</div><div style="font-size:34px;font-weight:700;">${winRate!==null&&winRate!==undefined?winRate+'%':'—'}</div></div>
        </div>
        ${dollarLine}
        <div class="field-note" style="margin-top:22px;font-size:27px;">This only looks at real past games — it's not a guarantee about what happens next. Always double-check before betting real money.</div>
        <div class="field-note" style="font-size:19.5px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);"><b>Every single bet, individually</b> — every real match this looked at, in order, with what happened and the result:</div>
        <div style="margin-top:8px;">${this.renderGenericLedgerTable(def, res.ledger||[])}</div>
        <button class="btn" style="margin-top:16px;font-size:30px;padding:16px 28px;" onclick="App.simpleTry('${id}')">🔄 Try Again</button>
        ${this.simpleOptimizeBlockHtml(def)}
      </div>`;
  },

  /* ---------------- DATASETS ---------------- */
  statBlock(label, value, sub, tone){
    return `<div class="stat-block"><div class="stat-label">${esc(label)}</div><div class="stat-value ${tone||''}">${esc(value)}</div>${sub?`<div class="stat-sub">${esc(sub)}</div>`:""}</div>`;
  },
  onFilePicked(e){
    const f = e.target.files[0];
    this.ui.upload.pendingFile = f || null;
    this.ui.upload.pendingFileName = f ? f.name : null;
    this.updateImportButtonState();
  },
  setUploadField(key, val){
    this.ui.upload[key] = val;
    this.updateImportButtonState();
  },
  updateImportButtonState(){
    const u = this.ui.upload;
    const btn = document.getElementById("import-btn");
    if(btn) btn.disabled = !(u.pendingFile && u.league && u.season);
    const liveBtn = document.getElementById("fetch-live-btn");
    if(liveBtn) liveBtn.disabled = !(u.league && u.season && this.state.proxyUrl);
  },
  doImport(){
    const uploadMeta = this.ui.upload;
    const file = uploadMeta.pendingFile;
    if(!file || !uploadMeta.league || !uploadMeta.season) return; // button is disabled in this case, but guard anyway
    Papa.parse(file, {
      header:true, skipEmptyLines:true,
      complete: (results)=>{
        // A fresh download for a league+season you've already imported REPLACES that entry in
        // place, rather than piling up a confusing new numbered row — so there's always exactly
        // one clickable, clearly-labeled entry per league+season, always holding your latest data.
        const existingIdx = App.state.datasets.findIndex(d=>d.league===uploadMeta.league && d.season===uploadMeta.season);
        const dataset = buildDatasetFromCsvResults(
          results, file.name, uploadMeta.league, uploadMeta.season,
          existingIdx>=0 ? App.state.datasets[existingIdx].id : null
        );
        const wasUpdate = existingIdx>=0;
        if(wasUpdate){ App.state.datasets[existingIdx] = dataset; }
        else{ App.state.datasets.push(dataset); }
        App.ui.upload = {league:"", season:"", pendingFile:null, pendingFileName:null};
        App.persist();
        App.notify(
          `${wasUpdate?"Updated":"Imported"} ${uploadMeta.league} — ${uploadMeta.season}: ${dataset.report.validRows} valid rows, ${dataset.report.invalidRows} invalid, ${dataset.report.duplicateRows} duplicate.`,
          dataset.report.missingRequiredColumns.length?"warn":"good"
        );
        App.render();
      },
      error: (err)=>App.notify("CSV parse failed: "+err.message, "bad"),
    });
  },
  toggleDataset(id){ this.ui.expandedDataset = this.ui.expandedDataset===id ? null : id; this.render(); },
  deleteDataset(id){ this.state.datasets = this.state.datasets.filter(d=>d.id!==id); this.persist(); this.notify("Dataset removed.","warn"); this.render(); },
  setProxyUrl(val){ this.state.proxyUrl = val.trim(); this.persist(); this.render(); },
  // Pulls a league+season straight from your live Cloudflare Worker — no manual download/upload
  // step at all. This is the "just works" path for anyone using the proxy; doImport (file upload)
  // stays available underneath as a manual fallback for leagues the proxy doesn't cover yet.
  doFetchLive(){
    const u = this.ui.upload;
    if(!u.league || !u.season || !this.state.proxyUrl) return;
    const proxyUrl = this.buildProxyUrl(u.league, u.season);
    if(!proxyUrl){
      this.notify(`Live fetch isn't available for "${u.league}" yet — please use manual CSV upload instead.`, "warn");
      return;
    }
    const btn = document.getElementById("fetch-live-btn");
    if(btn){ btn.disabled = true; btn.textContent = "Fetching..."; }
    this.notify(`Fetching ${u.league} — ${u.season} live from your proxy...`, "good");
    fetch(proxyUrl)
      .then(res=>{ if(!res.ok) return res.text().then(t=>{ throw new Error(t || `Server responded ${res.status}`); }); return res.text(); })
      .then(csvText=>{
        Papa.parse(csvText, {
          header:true, skipEmptyLines:true,
          complete: (results)=>{
            const existingIdx = this.state.datasets.findIndex(d=>d.league===u.league && d.season===u.season);
            const dataset = buildDatasetFromCsvResults(
              results, `${u.league.replace(/\s+/g,"_")}_${u.season.replace("/","-")}_live.csv`, u.league, u.season,
              existingIdx>=0 ? this.state.datasets[existingIdx].id : null
            );
            if(existingIdx>=0) this.state.datasets[existingIdx] = dataset; else this.state.datasets.push(dataset);
            this.persist();
            this.notify(`Fetched ${u.league} — ${u.season} live — ${dataset.report.validRows} valid rows.`, "good");
            this.render();
          },
          error: (err)=>this.notify(`Couldn't read that response as a CSV: ${err.message || err}`, "bad"),
        });
      })
      .catch(err=>this.notify(`Live fetch failed: ${err.message || err}`, "bad"));
  },
  // Builds the URL to call through your own CORS proxy (see PROXY_SETUP.md), if you've set one up.
  // Your proxy fetches football-data.co.uk itself (server-to-server, where CORS doesn't apply)
  // and hands the file back with permission for this page to read it — the actual fix for true
  // one-click automatic refresh, not just a best-effort attempt.
  buildProxyUrl(leagueName, season){
    const league = FOOTBALL_DATA_LEAGUES.main.find(l=>l.name===leagueName);
    const m = /^(\d{4})\/(\d{2})$/.exec(season||"");
    if(!league || !m || !this.state.proxyUrl) return null;
    const seasonCode = m[1].slice(2) + m[2];
    return `${this.state.proxyUrl.replace(/\/+$/,"")}/?league=${encodeURIComponent(league.code)}&season=${seasonCode}`;
  },
  // Tries to pull a fresh CSV with no manual download step. Without a proxy configured (see
  // PROXY_SETUP.md), browsers block a webpage from reading another site's response unless that
  // site explicitly allows it (a security rule called CORS) — football-data.co.uk doesn't, so a
  // direct attempt will almost always be blocked. With a proxy set up, this genuinely works
  // automatically every time. Either way, if it's blocked, this opens the exact right file in a
  // new tab instead of failing silently, so refreshing is never worse than "download, drop it in."
  refreshDataset(id){
    const idx = this.state.datasets.findIndex(d=>d.id===id);
    if(idx<0) return;
    const ds = this.state.datasets[idx];
    const directUrl = getFootballDataDownloadUrl(ds.league, ds.season);
    if(!directUrl){
      this.notify(`Auto-refresh isn't available yet for "${ds.league} — ${ds.season}" — please re-download and re-import it manually above.`, "warn");
      return;
    }
    const proxyUrl = this.buildProxyUrl(ds.league, ds.season);
    const fetchUrl = proxyUrl || directUrl;
    this.notify(
      proxyUrl ? `Fetching a fresh ${ds.league} — ${ds.season} file through your proxy...` : `Checking football-data.co.uk for a fresher ${ds.league} — ${ds.season} file...`,
      "good"
    );
    fetch(fetchUrl)
      .then(res=>{ if(!res.ok) throw new Error(`Server responded ${res.status}`); return res.text(); })
      .then(csvText=>{
        Papa.parse(csvText, {
          header:true, skipEmptyLines:true,
          complete: (results)=>{
            const fresh = buildDatasetFromCsvResults(results, directUrl.split("/").pop(), ds.league, ds.season, ds.id);
            this.state.datasets[idx] = fresh;
            this.persist();
            this.notify(`Refreshed ${ds.league} — ${ds.season} automatically — ${fresh.report.validRows} valid rows.`, "good");
            this.render();
          },
          error: ()=>this.fallbackOpenDownload(directUrl, ds),
        });
      })
      .catch(()=>this.fallbackOpenDownload(directUrl, ds));
  },
  fallbackOpenDownload(url, ds){
    window.open(url, "_blank");
    this.notify(
      this.state.proxyUrl
        ? `Your proxy didn't respond — I've opened the file directly instead. Save it, then drop it back in above to update ${ds.league} — ${ds.season}.`
        : `Your browser blocked the automatic download (a normal security rule for other websites — set up the free proxy below to fix this permanently) — I've opened the file directly instead. Save it, then drop it back in above to update ${ds.league} — ${ds.season}.`,
      "warn"
    );
  },
  clearAllDatasets(){
    if(this.state.datasets.length===0) return;
    const count = this.state.datasets.length;
    const ok = confirm(`Remove all ${count} imported dataset${count===1?"":"s"}? This can't be undone — you'll need to re-import any CSVs you want to keep.`);
    if(!ok) return;
    this.state.datasets = [];
    this.persist();
    this.notify(`Removed all ${count} dataset${count===1?"":"s"}.`, "warn");
    this.render();
  },
  clearAllRuns(){
    if(this.state.runs.length===0) return;
    const count = this.state.runs.length;
    const ok = confirm(`Delete all ${count} saved run${count===1?"":"s"}? This can't be undone.`);
    if(!ok) return;
    this.state.runs = [];
    this.persist();
    this.notify(`Deleted all ${count} saved run${count===1?"":"s"}.`, "warn");
    this.render();
  },

  renderDatasets(){
    const u = this.ui.upload;
    const seasonOpts = buildFootballSeasonOptions();
    const list = this.state.datasets
      .slice()
      .sort((a,b)=> b.importedAt.localeCompare(a.importedAt)) // most recently downloaded first
      .map(d=>{

            </div>
          </div>

            <button class="btn btn-danger" onclick="event.stopPropagation();App.deleteDataset('${d.id}')">${ICONS.trash}</button>
          </div>
        </div>
        ${open?`<div style="padding:0 16px 16px 42px;border-top:1px solid var(--line);">
          <div style="font-family:var(--df);font-size:19.5px;color:var(--ink);margin:12px 0 8px;">Import Report</div>
          <div class="report-grid">
            ${this.reportCell("Rows", r.rows)}${this.reportCell("Valid rows", r.validRows)}${this.reportCell("Duplicate rows", r.duplicateRows)}${this.reportCell("Invalid rows", r.invalidRows)}
            ${this.reportCell("Result conflicts", r.conflictRows)}${this.reportCell("Missing HomeTeam", r.missingHome)}${this.reportCell("Missing AwayTeam", r.missingAway)}${this.reportCell("Missing FTR", r.missingFTR)}
            ${this.reportCell("Missing FTHG", r.missingFTHG)}${this.reportCell("Missing FTAG", r.missingFTAG)}${this.reportCell("Historical odds", r.oddsAvailable?"YES":"NO")}
          </div>
          ${r.missingRequiredColumns.length>0?`<div style="margin-top:10px;color:var(--red);font-family:var(--bf);font-size:18px;display:flex;gap:6px;align-items:center;">${ICONS.warn} Missing required columns: ${esc(r.missingRequiredColumns.join(", "))}</div>`:""}
        </div>`:""}
      </div>`;
    }).join("");

    return `
      <div class="section-header">
        <div><div class="section-title" style="color:var(--accent);">Dataset Management</div><div class="section-sub">Import Football-Data.co.uk CSVs. Every upload is validated before it enters the research database.</div></div>
        ${this.state.datasets.length>0 ? `<button class="btn btn-danger" onclick="App.clearAllDatasets()">${ICONS.trash} Clear All Datasets</button>` : ""}
      </div>
      <div class="card" style="padding:18px;margin-bottom:22px;">
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="font-family:var(--df);font-size:22.5px;color:var(--accent);">Fetch Live Data</div>
          <span class="pill pill-${this.state.proxyUrl?'good':'neutral'}">${this.state.proxyUrl?'PROXY CONNECTED':'NO PROXY SET'}</span>
        </div>
        <div class="field-note" style="margin-bottom:12px;">Pick a league and season below, then fetch it directly — no downloading a CSV by hand.</div>
        <div class="row" style="margin-bottom:14px;">

  /* ---------------- RESEARCH ---------------- */
  setResearchField(key, val){
    this.ui.research.form[key] = val;
    if(key==="league"){
      const f = this.ui.research.form;
      if(f.season && f.season!=="ALL" && !this.seasonsForLeague(val).includes(f.season)) f.season = "ALL";
      f.team = "ALL"; // the previously selected team may not exist in the new league, so reset rather than silently keep an invalid filter
      this.render(); // league uses a <select onchange>, not a continuously-typed field, so a re-render here is safe
    }
    if(key==="season"){
      this.ui.research.form.team = "ALL"; // same reasoning as league — team list depends on league+season, so a season change can invalidate the current pick
      this.render();
    }
  },
  // Every team that actually played at least one match in the given league/season scope —
  // "ALL" for either means don't filter on it. Used to populate the Research Engine's team
  // dropdown so a person can check whether a strategy does well for one specific team.
  teamsForResearch(league, season){
    return [...new Set(this.allMatches()
      .filter(m=> (league==="ALL"||m.league===league) && (season==="ALL"||m.season===season))
      .flatMap(m=>[m.home_team, m.away_team]))].filter(Boolean).sort();
  },
  setStakingParam(key, val){ this.ui.research.form.stakingParams[key] = val; },
  onStakingPlanChange(val){
    this.ui.research.form.stakingPlan = val;
    this.ui.research.form.stakingParams = {};
    document.getElementById("staking-params-container").innerHTML = this.renderStakingParams();
    document.getElementById("staking-plan-note").innerHTML = this.renderStakingPlanNote();
  },
  onMarketChange(val){
    this.ui.research.form.market = val;
    this.render();
  },
  renderStakingParams(){
    const f = this.ui.research.form;
    const marketDef = MARKETS.find(m=>m.id===f.market);
    const stakingApplies = marketDef && marketDef.usesOdds;
    const planDef = STAKING_PLANS.find(p=>p.id===f.stakingPlan);
    if(!stakingApplies || !planDef || planDef.fields.length===0) return "";
    return `<div class="row" style="margin-top:10px;">
      ${planDef.fields.map(key=>{
        const meta = STAKING_FIELD_META[key];
        const val = f.stakingParams[key]!==undefined ? f.stakingParams[key] : meta.default;
        return `<div><label class="field-label">${esc(meta.label)}</label>
          <input type="${meta.type}" value="${esc(val)}" oninput="App.setStakingParam('${key}', this.value)" style="width:${meta.type==='text'?180:130}px;margin-top:4px;"></div>`;
      }).join("")}
    </div>`;
  },
  renderStakingPlanNote(){
    const f = this.ui.research.form;
    if(f.stakingPlan!=="ONE_2_4_6_8_12") return "";
    const marketDef = MARKETS.find(m=>m.id===f.market);
    if(!marketDef || !marketDef.usesOdds) return "";
    return `<div class="field-note" style="margin-top:8px;">Per your rule: sequence 1→2→4→6→8→12 units, no reset on a single win (needs 2 wins within the cycle to reset), and bets are only placed where odds exceed 2.50 — others are skipped without disturbing the sequence.</div>`;
  },
  runNow(cfgId){
    const f = this.ui.research.form;
    const config = cfgId ? this.state.configs.find(c=>c.id===cfgId) : {...f, stake:Number(f.stake)||1};
    const result = runResearch(this.allMatches(), config);
    this.ui.research.lastResult = {config, result};
    const run = {
      id:"run_"+Date.now().toString(36), configName: config.name||"(unsaved)", config, timestamp:new Date().toISOString(),
      scopeCount:result.scopeCount, qualified:result.qualified, excluded:result.excluded, missing:result.missing,
      finalUnits:result.finalUnits, maxDrawdown:result.maxDrawdown, stakingPlan:result.stakingPlan, ledger:result.ledger,
    };
    this.state.runs.unshift(run);
    this.persist();
    this.notify(`Research run complete: ${result.qualified} qualified of ${result.scopeCount} matches in scope.`);
    this.render();
  },
  setResearchMaxDrawdown(val){ this.ui.research.maxDrawdownUnits = val; },
  researchOptimizeNow(){
    const f = this.ui.research.form;
    const marketDef = MARKETS.find(m=>m.id===f.market);
    if(!marketDef || !marketDef.usesOdds){
      this.notify("This market has no historical odds column, so staking plans can't change the result — there's nothing to optimize.", "warn");
      return;
    }
    this.ui.research.optimizeRunning = true; this.render();
    // Genuinely yield to the browser first, so the "Optimizing..." state actually paints on
    // screen before the (usually sub-second, but not guaranteed) computation runs — and wrapped
    // in try/catch so any unexpected error always resets the button instead of leaving it stuck
    // on "Optimizing..." forever with no explanation, which is exactly what happened without this.
    setTimeout(()=>{
      try{
        const baseConfig = { league:f.league, season:f.season, team:f.team, dateFrom:f.dateFrom||"", dateTo:f.dateTo||"", stake:Number(f.stake)||1 };
        const maxDrawdownUnits = this.ui.research.maxDrawdownUnits===""?null:Number(this.ui.research.maxDrawdownUnits);
        const result = runResearchOptimization(this.allMatches(), f.market, baseConfig, {minSampleSize:10, maxDrawdownUnits});
        this.ui.research.optimizeResult = result;
        this.ui.research.optimizeRunning = false;
        this.notify(`Done — ${result.totalPassingSampleGuard} of ${result.totalCombosEvaluated} staking plans had enough bets to be worth showing.`, "good");
        this.render();
      } catch(e){
        // Covers errors from the computation above AND from render() itself — a bug in either
        // one used to leave the button stuck on "Optimizing..." forever with the page frozen
        // mid-update and no explanation, since the state update and re-render never completed.
        this.ui.research.optimizeResult = {error: "Something went wrong while optimizing this market — please try again, or try a different market/league/season combination."};
        this.ui.research.optimizeRunning = false;
        this.notify("Optimize failed — see the message below for details.", "warn");
        try{ this.render(); } catch(e2){ /* if even this render fails, there is nothing further we can safely do here */ }
      }
    }, 10);
  },
  // Loads an exact optimized (market, staking plan) combination into the Research Engine's form,
  // clearing League/Season/Dates so the person can pick a different scope to test it on — mirrors
  // testOnAnotherLeague for the Strategies/Optimize page, adapted to the Research Engine's own
  // Markets system.
  testMarketElsewhere(marketId, stakingPlan){
    const f = this.ui.research.form;
    f.market = marketId; f.league = "ALL"; f.season = "ALL"; f.team = "ALL"; f.dateFrom = ""; f.dateTo = "";

  renderResearch(){

              </tbody>

      optimizeBlock = `

              <button class="btn btn-accent" onclick="App.researchOptimizeNow()" ${running||!stakingApplies?"disabled":""}>${ICONS.play} ${running?"Optimizing...":"Optimize"}</button>

    }

    return `
      <div class="section-header"><div><div class="section-title" style="color:var(--accent);">Research Engine</div><div class="section-sub">Define a rule and a staking plan, run it against imported historical matches in chronological order, and read the actual recorded outcome — never simulated.</div></div></div>
      <div class="card" style="padding:18px;margin-bottom:20px;">

        <div class="row" style="margin-bottom:12px;">
          <select onchange="App.onMarketChange(this.value)">
            ${["real","hitrate"].map(g=>{
              const inGroup = MARKETS.filter(m=>m.group===g);
              return `<optgroup label="${esc(MARKET_GROUP_LABELS[g])}">${inGroup.map(m=>`<option value="${m.id}" ${f.market===m.id?'selected':''}>${esc(m.label)}</option>`).join("")}</optgroup>`;

          <select onchange="App.setResearchField('season', this.value)"><option value="ALL">All seasons</option>${seasons.map(s=>`<option value="${esc(s)}" ${f.season===s?'selected':''}>${esc(s)}</option>`).join("")}</select>
          <select onchange="App.setResearchField('team', this.value)" style="min-width:200px;" title="Filter to only matches this team played in — either home or away — so you can check whether this strategy does well for one specific team.">
            <option value="ALL">All teams</option>
            ${this.teamsForResearch(f.league, f.season).map(t=>`<option value="${esc(t)}" ${f.team===t?'selected':''}>${esc(t)}</option>`).join("")}
          </select>
          <div style="display:flex;align-items:center;gap:8px;white-space:nowrap;"><label class="field-label" style="margin:0;">Base Unit (u)</label><input type="number" value="${esc(f.stake)}" oninput="App.setResearchField('stake', this.value)" style="width:90px;"></div>
        </div>
        ${(()=>{ const md = MARKETS.find(m=>m.id===f.market); return md && md.note ? `<div class="field-note" style="margin-bottom:12px;">${esc(md.note)}</div>` : ""; })()}
        <div style="border-top:1px solid var(--line);padding-top:12px;margin-bottom:6px;">
          <label class="field-label">Staking Plan</label>
          <div class="row" style="margin-top:6px;">
            <select onchange="App.onStakingPlanChange(this.value)" style="min-width:240px;">
              ${STAKING_PLANS.map(p=>`<option value="${p.id}" ${f.stakingPlan===p.id?'selected':''}>${esc(p.label)}</option>`).join("")}
            </select>
            ${!stakingApplies ? `<span class="warn-note">${ICONS.warn} This market has no historical odds column — staking plan will be ignored, results are qualification/outcome only.</span>` : ""}
          </div>
          <div id="staking-params-container">${this.renderStakingParams()}</div>
          <div id="staking-plan-note">${this.renderStakingPlanNote()}</div>
        </div>
        <div class="field-note" style="margin:10px 0 14px;">1 unit = $1 by default. Bets are processed in chronological order so progression-based plans (Martingale, Fibonacci, Labouchere, etc.) follow the real sequence of results. Percentage and Kelly staking draw from the Starting Bankroll you set above.</div>

        </div>
      </div>
      ${resultBlock}
      ${optimizeBlock}
    `;
  },

  /* ---------------- STRATEGIES ---------------- */
  setStrategyParam(key, val){
    this.ui.strategies.params[key] = val;
    if(STRATEGY_SCOPE_KEYS.has(key)) this.ui.strategies.scope[key] = val;
    if(key==="league"){
      // If the currently-selected season doesn't actually exist for the newly-picked league,
      // reset it to "All seasons" rather than silently leaving an impossible League+Season
      // combination selected (this used to produce a confusing "0 in scope" with no explanation).
      const season = this.ui.strategies.params.season;
      if(season && season!=="ALL" && !this.seasonsForLeague(val).includes(season)){
        this.ui.strategies.params.season = "ALL";
        this.ui.strategies.scope.season = "ALL";
      }
      this.ui.strategies.params.team = "ALL"; this.ui.strategies.scope.team = "ALL"; // the previously selected team may not exist in the new league
      this.render(); // league uses a <select onchange>, not a continuously-typed field, so a re-render here is safe
    }
    if(key==="season"){
      this.ui.strategies.params.team = "ALL"; this.ui.strategies.scope.team = "ALL"; // same reasoning as league — team list depends on league+season
      this.render();
    }
  },
  setStrategyStakingParam(key, val){ this.ui.strategies.params.stakingParams[key] = val; },
  onStrategyStakingPlanChange(val){ this.ui.strategies.params.stakingPlan = val; this.ui.strategies.params.stakingParams = {}; this.renderNav(); this.render(); },
  toggleStrategyLeague(league){
    const arr = this.ui.strategies.params.leagues || [];
    this.ui.strategies.params.leagues = arr.includes(league) ? arr.filter(x=>x!==league) : [...arr, league];
    this.render();
  },
  selectStrategy(id){
    const def = STRATEGIES.find(x=>x.id===id);
    this.ui.strategies.activeId = id;
    // Carry the Match Scope filters (league/season/date/team) over from whichever strategy
    // was active before — only the fields this strategy actually has, so switching between
    // strategies doesn't force re-entering the same league/season/dates every time. Each
    // strategy's own Strategy Settings still reset to its own defaults, since those are
    // strategy-specific and shouldn't leak across strategies.
    const freshParams = JSON.parse(JSON.stringify(def.defaultParams));
    const scope = this.ui.strategies.scope || {};
    Object.keys(scope).forEach(k=>{ if(k in freshParams && scope[k]!=="" && scope[k]!==undefined) freshParams[k] = scope[k]; });
    // Team is handled generically (filterMatchesByTeam), independent of whether this particular
    // strategy defines its own "team" param field — so always carry it over, unlike the other
    // scope keys above which only carry over when the new strategy actually has that field.
    freshParams.team = scope.team || "ALL";
    this.ui.strategies.params = freshParams;
    this.ui.strategies.lastResult = null;
    this.ui.strategies.advancedOpen = false;
    this.renderNav();
    this.render();
    // Land directly on the selected strategy's settings instead of leaving the person at the
    // top of the long strategy list, having to scroll past every other strategy name manually.
    const el = document.getElementById("strategy-detail-card");
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  },
  toggleStrategyAdvanced(){ this.ui.strategies.advancedOpen = !this.ui.strategies.advancedOpen; this.render(); },
  // Takes an exact (params, staking plan) combination found by Auto-Optimization and loads it
  // into the Strategies tab's manual run form, so the user can pick a different League/Season
  // and immediately test whether the same setting also works elsewhere — without retyping any
  // of the strategy-specific settings by hand. League/Season/dates are deliberately left blank
  // rather than carried over, since testing on a *different* scope is the whole point.
  testOnAnotherLeague(strategyId, encodedParams, stakingPlan){
    const def = STRATEGIES.find(s=>s.id===strategyId);
    if(!def) return;
    let sweptParams;
    try{ sweptParams = JSON.parse(decodeURIComponent(escape(atob(encodedParams)))); }
    catch(e){ this.notify("Couldn't load that setting — please try again from the Optimize results.", "warn"); return; }
    const fresh = JSON.parse(JSON.stringify(def.defaultParams));
    Object.assign(fresh, sweptParams);
    fresh.league = "ALL"; fresh.season = "ALL"; fresh.team = "ALL"; fresh.dateFrom = ""; fresh.dateTo = "";
    if(stakingPlan){ fresh.stakingPlan = stakingPlan; fresh.stakingParams = defaultStakingParamsForPlan(stakingPlan); }
    this.ui.strategies.activeId = strategyId;
    this.ui.strategies.params = fresh;
    this.ui.strategies.scope = {league:"ALL", season:"ALL", team:"ALL", dateFrom:"", dateTo:""};
    this.ui.strategies.lastResult = null;
    this.ui.strategies.advancedOpen = true; // show the carried-over settings, not hidden behind a collapse
    this.setView("strategies");
    this.notify(`Loaded this optimized setting for ${def.name} — pick a new League and Season above, then click "Run Strategy" to test it there.`, "good");
  },
  // Loads an exact optimized (params, staking plan) combination into the Strategies tab, this
  // time KEEPING the same League/Season/Dates that were actually used to find and validate it on
  // the Optimize page — the opposite of testOnAnotherLeague above, which deliberately clears the
  // scope. Then runs it immediately, so the full Run Result detail view (In Scope, Triggered,
  // Hit Rate, Net P&L, ROI, Max Drawdown, the equity chart, and every individual bet) appears
  // right away, without the person needing to press "Run Strategy" themselves.
  viewFullSeasonDetail(strategyId, encodedParams, stakingPlan, encodedScope){
    const def = STRATEGIES.find(s=>s.id===strategyId);
    if(!def) return;
    let sweptParams, scope;
    try{
      sweptParams = JSON.parse(decodeURIComponent(escape(atob(encodedParams))));
      scope = JSON.parse(decodeURIComponent(escape(atob(encodedScope))));
    }
    catch(e){ this.notify("Couldn't load that setting — please try again from the Optimize results.", "warn"); return; }
    const fresh = JSON.parse(JSON.stringify(def.defaultParams));
    Object.assign(fresh, sweptParams);
    fresh.league = scope.league || "ALL"; fresh.season = scope.season || "ALL"; fresh.team = scope.team || "ALL";
    fresh.dateFrom = scope.dateFrom || ""; fresh.dateTo = scope.dateTo || "";
    if(stakingPlan){ fresh.stakingPlan = stakingPlan; fresh.stakingParams = defaultStakingParamsForPlan(stakingPlan); }
    this.ui.strategies.activeId = strategyId;
    this.ui.strategies.params = fresh;
    this.ui.strategies.scope = {league:fresh.league, season:fresh.season, team:fresh.team, dateFrom:fresh.dateFrom, dateTo:fresh.dateTo};
    this.ui.strategies.advancedOpen = true;
    this.setView("strategies");
    this.runStrategy();
    // Land directly on the result instead of the top of the Strategies page — the person
    // shouldn't have to scroll past the settings form and Run Strategy button every time.
    const el = document.getElementById("run-result-card");
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  },
  // Shared across both the Strategies tab (a real stop-loss simulated mid-run) and the Optimize
  // page (a search filter that excludes settings exceeding this drawdown) — same personal risk
  // number either way, so setting it once in either place keeps both in sync automatically.
  setStrategyMaxDrawdown(val){ this.ui.strategies.maxDrawdownAllowed = val; this.ui.optimize.maxDrawdownUnits = val; },
  // Filters a match list down to only games a given team played in (home or away). Applied once
  // here, before handing matches to any strategy's own run() function, rather than needing every
  // one of the 101 individual strategies to understand a "team" parameter themselves — this way
  // ANY strategy can be checked against one specific team, not just ones built for it.
  filterMatchesByTeam(matches, team){
    if(!team || team==="ALL") return matches;
    return matches.filter(m=>m.home_team===team || m.away_team===team);
  },
  // Runs every one of the 101 strategies, once each, against whatever data is actually loaded
  // right now — with each strategy's own default settings. This answers a different question
  // than "which strategy wins": it answers "which strategies can even produce a real result
  // with the data currently sitting in this account", separating strategies that genuinely
  // work from ones that only fail because a required data column (e.g. opening/closing odds)
  // isn't present in the imported CSVs.
  runHealthCheck(){
    const matches = this.allMatches();
    const results = STRATEGIES.map(def=>{
      let res, status, note;
      try{
        res = def.run(matches, JSON.parse(JSON.stringify(def.defaultParams)));
      }catch(e){
        return { id:def.id, name:def.name, status:"ERROR", note: (e && e.message) ? e.message : "Unknown error while running this strategy." };
      }
      if(!res){
        return { id:def.id, name:def.name, status:"ERROR", note:"Strategy returned no result." };
      }
      const scopeCount = (typeof res.scopeCount === "number") ? res.scopeCount : (Array.isArray(res.ledger) ? res.ledger.length : 0);
      if(scopeCount === 0){
        return { id:def.id, name:def.name, status:"NO_MATCHES_IN_SCOPE", note:"No imported matches fall within this strategy's default league/season scope." };
      }
      let missingCount = (typeof res.missing === "number") ? res.missing : null;
      if(missingCount === null && Array.isArray(res.ledger)){
        missingCount = res.ledger.filter(r=>r.status==="MISSING_DATA" || r.qualified_status==="MISSING_DATA").length;
      }
      if(missingCount === null){
        // This strategy's return shape doesn't expose a missing-data count at all — it ran
        // without crashing, which is the most we can verify generically, so treat it as working.
        return { id:def.id, name:def.name, status:"WORKING", note:`Ran cleanly across ${scopeCount} matches in scope.` };
      }
      if(missingCount >= scopeCount){
        return { id:def.id, name:def.name, status:"MISSING_DATA", note:`All ${scopeCount} matches in scope are missing a data column this strategy needs (see its "Data requirements" note).` };
      }
      return { id:def.id, name:def.name, status:"WORKING", note:`${scopeCount-missingCount} of ${scopeCount} matches in scope have the data this strategy needs.` };
    });
    const summary = { WORKING:0, MISSING_DATA:0, NO_MATCHES_IN_SCOPE:0, ERROR:0 };
    for(const r of results) summary[r.status] = (summary[r.status]||0) + 1;
    this.ui.healthCheck = { results, summary, ranAt: new Date().toLocaleString(), totalMatches: matches.length };
    this.render();
  },
  renderHealthCheck(){
    const hc = this.ui.healthCheck;
    const statusMeta = {
      WORKING: {label:"Working now", color:"var(--accent)", desc:"Produces a real result with your current data."},
      MISSING_DATA: {label:"Blocked — missing data", color:"var(--amber)", desc:"Ran fine, but every match in scope is missing a column this strategy needs (e.g. opening/closing odds)."},
      NO_MATCHES_IN_SCOPE: {label:"No matches in scope", color:"var(--ink-dim)", desc:"None of your imported matches fall inside this strategy's default league/season."},
      ERROR: {label:"Code error", color:"var(--red)", desc:"The strategy threw an error while running — a real bug, worth reporting."},
    };
    let body;
    if(!hc){
      body = `
        <div class="card" style="padding:28px;">
          <div style="font-size:15px;line-height:1.6;color:var(--ink-dim);margin-bottom:16px;">
            This checks all 101 strategies against the data you've actually imported right now — each strategy
            runs once with its own default settings. It tells you which ones can produce a real result today,
            versus which ones are blocked because your imported data is missing a column they need (like
            opening/closing odds), versus ones that hit a genuine code error.
          </div>
          <button class="btn btn-accent" onclick="App.runHealthCheck()">▶ Run Data Compatibility Check</button>
        </div>`;
    } else {
      const order = ["WORKING","MISSING_DATA","NO_MATCHES_IN_SCOPE","ERROR"];
      const summaryCards = order.map(k=>`
        <div class="card" style="padding:16px;text-align:center;">
          <div style="font-size:28px;font-weight:700;color:${statusMeta[k].color};">${hc.summary[k]||0}</div>
          <div style="font-size:13px;color:var(--ink-dim);margin-top:4px;">${statusMeta[k].label}</div>
        </div>`).join("");
      const rows = hc.results.map(r=>`
        <tr>
          <td style="padding:10px 12px;border-bottom:1px solid var(--line);">${esc(r.name)}</td>
          <td style="padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;">
            <span style="color:${statusMeta[r.status].color};font-weight:600;">${statusMeta[r.status].label}</span>
          </td>
          <td style="padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-dim);font-size:13px;">${esc(r.note)}</td>
        </tr>`).join("");
      body = `
        <div style="margin-bottom:16px;color:var(--ink-dim);font-size:13px;">
          Checked ${hc.results.length} strategies against ${hc.totalMatches} loaded matches · ${esc(hc.ranAt)}
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;">${summaryCards}</div>
        <button class="btn" style="margin-bottom:16px;" onclick="App.runHealthCheck()">↻ Re-run Check</button>
        <div class="card" style="padding:0;overflow:hidden;">
          <table style="width:100%;border-collapse:collapse;font-size:14px;">
            <thead><tr style="background:var(--panel2);">
              <th style="text-align:left;padding:10px 12px;">Strategy</th>
              <th style="text-align:left;padding:10px 12px;">Status</th>
              <th style="text-align:left;padding:10px 12px;">Why</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }
    return `
      <div>
        <div style="font-family:var(--df);font-size:26px;font-weight:600;color:var(--accent);margin-bottom:4px;">Data Compatibility Check</div>
        <div style="color:var(--ink-dim);margin-bottom:20px;">How many of your 101 strategies can actually run with the data you've imported right now.</div>
        ${body}
      </div>`;
  },
  runStrategy(){
    const s = this.ui.strategies;
    const def = STRATEGIES.find(x=>x.id===s.activeId);
    const scopedMatches = this.filterMatchesByTeam(this.allMatches(), s.params.team);
    let result = def.run(scopedMatches, s.params);
    // Simulate a real client walking away once their own personal maximum acceptable drawdown
    // is hit, rather than assuming everyone would ride out the strategy's full worst losing run.
    if(!def.pnlUnavailable) result = applyDrawdownStopLoss(result, s.maxDrawdownAllowed);
    s.lastResult = result;
    const msg = def.pnlUnavailable
      ? `Run complete: ${result.qualified} triggered of ${result.scopeCount} in scope. ${result.wins} hits / ${result.losses} misses (P&L not computable).`
      : result.stoppedEarly
        ? `Run complete: stopped after ${result.stoppedAfterBets} of ${result.originalQualified} qualifying bets — your ${result.drawdownCapApplied}u maximum drawdown was reached. Net ${result.netPnl>=0?'+':''}${result.netPnl}u.`
        : `Strategy run complete: ${result.qualified} qualified bets of ${result.scopeCount} matches in scope. Net ${result.netPnl>=0?'+':''}${result.netPnl}u.`;
    this.notify(msg, def.pnlUnavailable ? "warn" : (result.netPnl>=0?"good":"warn"));
    this.render();
  },
  toggleStrategyLedger(){ this.ui.strategies.expandedLedger = !this.ui.strategies.expandedLedger; this.render(); },
  exportStrategyLedgerCSV(){
    const s = this.ui.strategies, r = s.lastResult; if(!r) return;
    downloadCSV(`${s.activeId.toLowerCase()}_ledger.csv`, r.ledger);
  },
  exportStrategyLedgerJSON(){
    const s = this.ui.strategies, r = s.lastResult; if(!r) return;
    downloadJSON(`${s.activeId.toLowerCase()}_ledger.json`, r);
  },
  renderStrategyLibrary(){

      const items = STRATEGIES.filter(s=>s.venue===v.id).slice().sort((a,b)=>a.name.localeCompare(b.name));
      return `<div class="card" style="padding:14px;flex:1 1 320px;">
        <div class="chart-title" style="margin-bottom:2px;color:var(--accent);">${esc(v.label)} <span class="pill pill-neutral" style="margin-left:6px;">${items.length} loaded</span></div>
        ${v.note ? `<div class="field-note" style="margin-bottom:10px;">${esc(v.note)}</div>` : ""}
        <div style="display:flex;flex-direction:column;gap:4px;">
          ${items.length===0 ? `<div class="field-note" style="padding:8px 0;">No strategies in this column yet.</div>` :
            items.map(s=>`<div class="row" style="justify-content:space-between;padding:7px 9px;border-radius:5px;background:${this.ui.strategies.activeId===s.id?'var(--panel2)':'transparent'};cursor:pointer;border:1px solid ${this.ui.strategies.activeId===s.id?'var(--accent)':'transparent'};" onclick="App.selectStrategy('${s.id}')">
              <span style="font-family:var(--bf);font-size:19px;color:var(--ink);">${esc(s.name)}</span>
              ${this.ui.strategies.activeId===s.id?`<span class="pill pill-good">ACTIVE</span>`:''}
            </div>`).join("")}
        </div>
      </div>`;
    }).join("");
  },
  renderStrategyParamField(field, params){
    const val = params[field.key] !== undefined ? params[field.key] : field.default;
    switch(field.type){
      case "league": {
        const leagues = this.leagues();
        return `<div><label class="field-label">${esc(field.label)}</label><select onchange="App.setStrategyParam('${field.key}', this.value)">
          <option value="ALL" ${val==="ALL"?"selected":""}>${field.label.includes("optional")?"All leagues":"Select a league…"}</option>
          ${leagues.map(l=>`<option value="${esc(l)}" ${val===l?"selected":""}>${esc(l)}</option>`).join("")}
        </select></div>`;
      }
      case "season": {
        const seasons = this.seasonsForLeague(params.league);
        return `<div><label class="field-label">${esc(field.label)}</label><select onchange="App.setStrategyParam('${field.key}', this.value)">
          <option value="ALL" ${val==="ALL"?"selected":""}>${field.label.includes("optional")?"All seasons":"Select a season…"}</option>
          ${seasons.map(sn=>`<option value="${esc(sn)}" ${val===sn?"selected":""}>${esc(sn)}</option>`).join("")}
        </select></div>`;
      }
      case "date": return `<div><label class="field-label">${esc(field.label)}</label><input type="date" value="${esc(val||"")}" oninput="App.setStrategyParam('${field.key}', this.value)" style="width:150px;"></div>`;
      case "number": return `<div><label class="field-label">${esc(field.label)}</label><input type="number" value="${esc(val)}" oninput="App.setStrategyParam('${field.key}', this.value)" style="width:110px;"></div>`;
      case "text": return `<div><label class="field-label">${esc(field.label)}</label><input type="text" value="${esc(val||"")}" oninput="App.setStrategyParam('${field.key}', this.value)"></div>`;
      case "select": return `<div><label class="field-label">${esc(field.label)}</label><select onchange="App.setStrategyParam('${field.key}', this.value)">${field.options.map(o=>`<option value="${o}" ${String(val)===String(o)?"selected":""}>${o===0?"0 (no delay — bet every match)":o+" in a row"}</option>`).join("")}</select></div>`;
      case "choice": return `<div><label class="field-label">${esc(field.label)}</label><select onchange="App.setStrategyParam('${field.key}', this.value)">${field.choices.map(c=>`<option value="${c.value}" ${String(val)===String(c.value)?"selected":""}>${esc(c.label)}</option>`).join("")}</select></div>`;
      case "team": {
        const teams = [...new Set(this.allMatches().flatMap(m=>[m.home_team,m.away_team]))].filter(Boolean).sort();
        return `<div><label class="field-label">${esc(field.label)}</label><select onchange="App.setStrategyParam('${field.key}', this.value)">
          <option value="">Select a team…</option>
          ${teams.map(t=>`<option value="${esc(t)}" ${val===t?"selected":""}>${esc(t)}</option>`).join("")}
        </select></div>`;
      }
      case "multi-league": {
        const leagues = this.leagues();
        const selected = params.leagues || [];
        return `<div style="width:100%;"><label class="field-label">${esc(field.label)}</label>
          <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:4px;">
            ${leagues.length===0 ? `<span class="field-note">No leagues imported yet.</span>` : leagues.map(l=>`<label style="display:flex;align-items:center;gap:5px;font-family:var(--mf);font-size:18px;color:var(--ink);background:var(--panel2);padding:4px 8px;border-radius:4px;cursor:pointer;">
              <input type="checkbox" ${selected.includes(l)?"checked":""} onchange="App.toggleStrategyLeague('${esc(l)}')"> ${esc(l)}
            </label>`).join("")}
          </div>
          <div class="field-note" style="margin-top:4px;">${selected.length} selected (need 2–5)</div>
        </div>`;
      }
      default: return "";
    }
  },
  renderStrategyStakingBlock(def, params){
    if(!("stakingPlan" in def.defaultParams)) return "";
    const planDef = STAKING_PLANS.find(pl=>pl.id===params.stakingPlan);
    const paramsFields = (planDef && planDef.fields.length) ? `<div class="row" style="margin-top:10px;">
      ${planDef.fields.map(key=>{
        const meta = STAKING_FIELD_META[key];

        return `<div><label class="field-label">${esc(meta.label)}</label><input type="${meta.type}" value="${esc(val)}" oninput="App.setStrategyStakingParam('${key}', this.value)" style="width:${meta.type==="text"?180:130}px;margin-top:4px;"></div>`;
      }).join("")}
    </div>` : "";
    return `<div style="border-top:1px solid var(--line);padding-top:12px;margin:12px 0 6px;">
      <label class="field-label">Staking Plan</label>
      <select onchange="App.onStrategyStakingPlanChange(this.value)" style="min-width:240px;margin-top:6px;">
        ${STAKING_PLANS.map(pl=>`<option value="${pl.id}" ${params.stakingPlan===pl.id?"selected":""}>${esc(pl.label)}</option>`).join("")}

      ${paramsFields}

  renderGenericLedgerTable(def, ledger){
    const cols = def.ledgerColumns;
    // Only real, triggered bets belong here — rows where nothing was actually staked (the
    // strategy didn't trigger, data was missing, or the market isn't wired in yet) are pure
    // clutter in a "here's every bet" table and are filtered out, not just this strategy but
    // everywhere this table is used.
    const NOT_A_REAL_BET = new Set(["NOT_TRIGGERED","MISSING_DATA","ODDS_UNAVAILABLE","NO_LIVE_DATA","COOL_OFF","WAITING"]);
    const realBets = ledger.filter(l=>!NOT_A_REAL_BET.has(l.status));
    if(realBets.length===0){
      return `<div class="field-note" style="padding:16px;">No real bets were actually placed by this strategy on these games — every match either didn't trigger, was missing data, or needs a market this app doesn't have odds for yet.</div>`;
    }
    const rows = realBets.map(l=>`<tr>${cols.map(c=>{
      if(c.key==="status"){
        const tone = ["WIN","QUALIFIED","HIT"].includes(l.status) ? "good" : ["LOSS","MISS"].includes(l.status) ? "bad" : "warn";
        const label = l.status==="STOPPED_DRAWDOWN_CAP" ? "NOT PLACED (cap reached)" : (l.status||"—");
        return `<td><span class="pill pill-${tone}">${esc(label)}</span></td>`;
      }
      let v = l[c.key];
      if(v===undefined||v===null||v==="") v="—";
      let style = "";
      if(c.key==="pnl" && typeof l.pnl==="number") style = l.pnl>0?"color:var(--accent)":l.pnl<0?"color:var(--red)":"color:var(--ink-faint)";
      if(c.key==="notes") style = "color:var(--ink-faint)";
      return `<td style="${style}">${esc(v)}</td>`;
    }).join("")}</tr>`).join("");
    return `<table><thead><tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  },
  renderStrategies(){

    const def = STRATEGIES.find(x=>x.id===s.activeId);

          ${r.stoppedEarly ? `<div class="warn-note" style="margin-bottom:12px;">${ICONS.warn} <b>Stopped early at your ${r.drawdownCapApplied}u maximum drawdown</b> — only the first ${r.stoppedAfterBets} of ${r.originalQualified} bets this strategy would normally have placed are counted below; every bet after that point is shown as "Not placed" in the ledger, since a client with this risk limit would have walked away there.</div>` : ""}
          <div class="stat-row">
            ${this.statBlock("In scope", r.scopeCount)}
            ${this.statBlock("Triggered", r.qualified, null, "accent")}
            ${this.statBlock("Not triggered", r.notTriggered)}
            ${this.statBlock("Missing data", r.missing, null, "bad")}
            ${pnlNA ? this.statBlock("Hits / Misses", `${r.wins} / ${r.losses}`) : this.statBlock("Wins / Losses / Pushes", `${r.wins} / ${r.losses} / ${r.pushes}`)}
            ${this.statBlock("Hit Rate", r.winRate!==null ? r.winRate+"%" : "N/A")}
            ${pnlNA ? this.statBlock("Total Staked", "N/A — no odds") : this.statBlock("Total Staked", r.totalStaked.toFixed(2)+"u")}
            ${pnlNA ? this.statBlock("Net P&L", "N/A — no odds") : this.statBlock("Net P&L", (r.netPnl>=0?"+":"")+r.netPnl.toFixed(2)+"u", null, r.netPnl>=0?"accent":"bad")}
            ${pnlNA ? this.statBlock("ROI", "N/A — no odds") : this.statBlock("ROI", r.roi!==null ? r.roi+"%" : "N/A", null, (r.roi||0)>=0?"accent":"bad")}
            ${pnlNA ? "" : this.statBlock("Max Drawdown", r.maxDrawdown.toFixed(2)+"u", null, "bad")}
          </div>
          ${pnlNA ? "" : svgAreaChart(cumulativeSeries)}
          ${OPTIMIZABLE_STRATEGY_IDS.includes(def.id) ? `
          <div style="margin-top:18px;border:1px solid var(--accent);border-radius:10px;padding:16px 18px;background:linear-gradient(135deg, var(--accent-dim), var(--panel2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
            <div>

              <div class="field-note" style="margin-top:2px;">Tests many settings on your current League/Season/Dates above, then shows the Top 5 — ranked by ${pnlNA?"real hit rate":"real profit"}, with Bets Placed, Win Rate${pnlNA?"":", Profit,"} and Max Drawdown for each.</div>
            </div>
            <button class="btn btn-accent" onclick="App.jumpToOptimizeFromStrategies()">🚀 Optimize This</button>
          </div>` : ""}
        </div>

        ${pnlNA ? "" : `<div class="row" style="align-items:stretch;gap:16px;flex-wrap:wrap;margin-bottom:20px;">
          ${marketBlock}
          <div class="card" style="padding:16px;flex:1 1 320px;">
            <div class="chart-title">Weekly bet distribution</div>
            ${svgBarChart(weekChartData.slice(-12))}
            <div class="field-note" style="margin-top:6px;">Showing most recent 12 active weeks. Avg ${(r.qualified/Math.max(1,weekEntries.length)).toFixed(1)} bets/week across ${weekEntries.length} active weeks.</div>

        <div class="card" style="padding:0;overflow:hidden;">

                    <option value="ALL" ${p.team==="ALL"||!p.team?"selected":""}>All teams</option>
                    ${this.teamsForResearch(p.league||"ALL", p.season||"ALL").map(t=>`<option value="${esc(t)}" ${p.team===t?'selected':''}>${esc(t)}</option>`).join("")}
                  </select>
                </div>` : ""}
              </div>
            </div>
            ${modelFields.length ? `
            <div style="margin-bottom:14px;">
              <div class="chart-title" style="margin-bottom:6px;font-size:18px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-faint);">
                Strategy Settings ${isAdvanced ? `<button class="btn" style="padding:2px 8px;font-size:16.5px;margin-left:8px;" onclick="App.toggleStrategyAdvanced()">${s.advancedOpen ? "Hide" : "Show"} ${modelFields.length} settings ${s.advancedOpen ? "▲" : "▼"}</button>` : ""}
              </div>
              ${isAdvanced ? `<div class="field-note" style="margin-bottom:8px;">These come pre-set to sensible defaults — you don't need to change any of them to run the strategy. Not sure what to change? The Optimize tab searches these for you automatically instead of guessing by hand.</div>` : ""}
              ${(!isAdvanced || s.advancedOpen) ? `<div class="row" style="margin-bottom:2px;">${modelFields.map(f=>this.renderStrategyParamField(f, p)).join("")}</div>` : ""}

            <div style="margin-bottom:6px;">
              <div class="chart-title" style="margin-bottom:6px;font-size:18px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-faint);">Betting Settings</div>
              <div class="row" style="margin-bottom:6px;">${bettingFields.map(f=>this.renderStrategyParamField(f, p)).join("")}</div>

      <div class="card" style="padding:18px;margin-bottom:20px;">
