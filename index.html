        <div class="table-scroll">
          <table>
            <thead><tr><th>Selection</th><th>Odds</th><th>Stake ($)</th><th>Payout if hit ($)</th><th>Profit if hit ($)</th><th></th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        <div class="stat-row" style="margin-top:16px;">
          ${this.statBlock("Implied probability used", calc.impliedProbPct+"%")}
          ${this.statBlock("Profit if any target hits", (calc.profitIfAnyHit>=0?"+":"")+"$"+calc.profitIfAnyHit.toFixed(2), null, calc.profitIfAnyHit>=0?"accent":"bad")}
          ${this.statBlock("Loss if none hit", "$"+calc.lossIfNoneHit.toFixed(2), null, "bad")}
        </div>
        ${calc.overround ? `<div class="warn-note" style="margin-top:12px;">${ICONS.warn} Implied probability across your selections exceeds 100% (${calc.impliedProbPct}%) — these odds don't leave room for a guaranteed profit across all listed scores at this total stake; check for overround/vig or reconsider the selection.</div>` : `<div class="field-note" style="margin-top:12px;">Stakes are split so payout — and therefore profit — is the same regardless of which single target score lands. If none of the listed scores land, the full $${(Number(d.totalStake)||0).toFixed(2)} is lost.</div>`}
      </div>`;
  },
  renderCompoundingPanel(){
    const c = this.ui.compounding;
    const calc = calcCompounding(c.startBank, c.odds, c.numBets, c.reinvestPct);
    const rowsHtml = calc.rows.map(r=>`<tr><td>${r.bet}</td><td>${r.stake.toFixed(2)}</td><td style="color:var(--accent)">+${r.profit.toFixed(2)}</td><td>${r.bank.toFixed(2)}</td></tr>`).join("");
    return `
      <div class="card" style="padding:18px;margin-bottom:20px;">
        <div style="font-family:var(--df);font-size:22.5px;margin-bottom:6px;color:var(--ink);">Compounding Profit Calculator</div>
        <div class="section-sub" style="margin-bottom:14px;">Shows how a bankroll grows if every bet in a row wins at a given odds and reinvestment %. This is a projection assuming a 100% win streak — it does NOT reflect the real win probability of any strategy, and is not a backtest.</div>
        <div class="row" style="gap:16px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;">
          <div><label class="field-label">Starting Bank ($)</label><input type="number" value="${esc(c.startBank)}" oninput="App.setCompounding('startBank',this.value)" style="width:120px;"></div>
          <div><label class="field-label">Odds per bet</label><input type="number" step="0.01" value="${esc(c.odds)}" oninput="App.setCompounding('odds',this.value)" style="width:100px;"></div>
          <div><label class="field-label"># of consecutive wins</label><input type="number" value="${esc(c.numBets)}" oninput="App.setCompounding('numBets',this.value)" style="width:120px;"></div>
          <div><label class="field-label">Reinvest % of bank</label><input type="number" value="${esc(c.reinvestPct)}" oninput="App.setCompounding('reinvestPct',this.value)" style="width:110px;"></div>
        </div>
        <div class="table-scroll short">
          <table><thead><tr><th>Bet #</th><th>Stake ($)</th><th>Profit ($)</th><th>Bank After ($)</th></tr></thead><tbody>${rowsHtml}</tbody></table>
        </div>
        <div class="stat-row" style="margin-top:16px;">
          ${this.statBlock("Final Bank", "$"+calc.finalBank.toFixed(2), null, "accent")}
          ${this.statBlock("Total Profit", "+$"+calc.totalProfit.toFixed(2), null, "accent")}
          ${this.statBlock("Growth", calc.growthPct!==null ? calc.growthPct+"%" : "N/A")}
        </div>
        <div class="warn-note" style="margin-top:12px;">${ICONS.warn} Real betting sequences don't win every time — a single loss part-way through this sequence erases a large share of the compounded gains, especially at high reinvestment %. Use this to understand the math, not as a profit forecast.</div>
      </div>`;
  },
  renderLockInPanel(){
    const l = this.ui.lockin;
    const calc = calcLockIn(l.backOdds, l.backStake, l.layOdds);
    return `
      <div class="card" style="padding:18px;margin-bottom:20px;">
        <div style="font-family:var(--df);font-size:22.5px;margin-bottom:6px;color:var(--ink);">Back-Then-Lay Lock-In Calculator</div>
        <div class="section-sub" style="margin-bottom:14px;">Standard exchange "green-up" formula: Lay Stake = (Back Odds × Back Stake) ÷ Lay Odds. Enter the odds you backed at and the current lay odds to see the lay stake that locks in the same profit either way. Pure math — you supply the live odds; this app has no live in-play feed.</div>
        <div class="row" style="gap:16px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;">
          <div><label class="field-label">Back Odds</label><input type="number" step="0.01" value="${esc(l.backOdds)}" oninput="App.setLockIn('backOdds',this.value)" style="width:100px;"></div>
          <div><label class="field-label">Back Stake ($)</label><input type="number" value="${esc(l.backStake)}" oninput="App.setLockIn('backStake',this.value)" style="width:110px;"></div>
          <div><label class="field-label">Current Lay Odds</label><input type="number" step="0.01" value="${esc(l.layOdds)}" oninput="App.setLockIn('layOdds',this.value)" style="width:110px;"></div>
        </div>
        ${calc ? `
        <div class="stat-row">
          ${this.statBlock("Lay Stake", "$"+calc.layStake.toFixed(2), null, "accent")}
          ${this.statBlock("Liability", "$"+calc.liability.toFixed(2), null, "bad")}
          ${this.statBlock("Profit if selection wins", (calc.profitIfSelectionWins>=0?"+":"")+"$"+calc.profitIfSelectionWins.toFixed(2), null, calc.profitIfSelectionWins>=0?"accent":"bad")}
          ${this.statBlock("Profit if selection loses", (calc.profitIfSelectionLoses>=0?"+":"")+"$"+calc.profitIfSelectionLoses.toFixed(2), null, calc.profitIfSelectionLoses>=0?"accent":"bad")}
        </div>
        <div class="field-note" style="margin-top:12px;">Place this lay stake at ${l.layOdds} to lock in a matching result whichever way the market settles (small rounding aside). Make sure your exchange account can cover the liability shown above before placing the lay.</div>
        ` : `<div class="warn-note">${ICONS.warn} Enter Back Odds >1, Back Stake >0, and Lay Odds >1 to calculate.</div>`}
      </div>`;
  },
  /* ---------------- AUTO-OPTIMIZATION ---------------- */
  setOptimizeField(key, val){
    const o = this.ui.optimize;
    if(key==="strategyId"){ o.strategyId = val; o.lastResult = null; this.render(); }
    else if(key==="minSampleSize" || key==="splitRatio"){ o[key] = Number(val); }
    else if(key==="maxDrawdownUnits"){ o[key] = val; this.ui.strategies.maxDrawdownAllowed = val; } // kept as raw string; "" means no cap, parsed to Number only when running. Synced with the Strategies tab's own drawdown field — same personal risk number either way.
    else if(key==="league"){
      o.league = val;
      // If the season currently selected doesn't actually exist for the newly-picked league,
      // reset it back to "All seasons" rather than silently keeping an impossible combination
      // selected (which used to produce a confusing "0 in scope" with no explanation).
      if(o.season!=="ALL" && !this.seasonsForLeague(val).includes(o.season)) o.season = "ALL";
      o.team = "ALL"; // the previously selected team may not exist in the new league
      this.render();
    }
    else if(key==="season"){
      o.season = val;
      o.team = "ALL"; // same reasoning as league — team list depends on league+season
      this.render();
    }
    else { o[key] = val; }
  },
  runOptimizationNow(){
    const o = this.ui.optimize;
    const def = STRATEGIES.find(s=>s.id===o.strategyId);
    if(!def) return;
    o.running = true; this.render();
    const baseParams = { league:o.league, season:o.season, team:o.team, dateFrom:o.dateFrom, dateTo:o.dateTo };
    const result = runOptimization(this.allMatches(), def, baseParams, {minSampleSize:o.minSampleSize, maxDrawdownUnits: o.maxDrawdownUnits===""?null:o.maxDrawdownUnits});
    if(!result.error) result.strategyId = o.strategyId; // remember which strategy these results belong to, independent of later dropdown changes
    o.lastResult = result;
    o.running = false;
    if(result.error) this.notify(result.error, "warn");
    else this.notify(`Done — ${result.totalPassingSampleGuard} of ${result.totalCombosEvaluated} setting combinations had enough bets to be worth showing.`, "good");
    this.render();
  },
  // Bridge from the Strategies page's "Run Result" straight into a real Optimize search —
  // carries over the exact strategy + League/Season/Dates already chosen there, so the person
  // doesn't have to re-pick anything on the separate Optimize page, then runs it immediately.
  jumpToOptimizeFromStrategies(){
    const s = this.ui.strategies;
    const p = s.params||{};
    this.ui.optimize.strategyId = s.activeId;
    this.ui.optimize.league = p.league || "ALL";
    this.ui.optimize.season = p.season || "ALL";
    this.ui.optimize.dateFrom = p.dateFrom || "";
    this.ui.optimize.dateTo = p.dateTo || "";
    this.ui.optimize.lastResult = null;
    this.setView("optimize");
    this.runOptimizationNow();
  },
  exportOptimizeCSV(){
    const o = this.ui.optimize, r = o.lastResult; if(!r || r.error) return;
    const na = "N/A (hit-rate only, no market odds in source data)";
    const rows = r.allResults.map(x=>({
      strategy:r.strategyId||o.strategyId, staking_plan:x.stakingPlan||"N/A (fixed stake)",
      ...Object.fromEntries(Object.entries(x.params).map(([k,v])=>[`setting_${k}`,v])),
      bets_placed:x.result.qualified, roi_pct:r.usesPnl?x.result.roi:na, profit_units:r.usesPnl?x.result.netPnl:na, worst_losing_run_units:r.usesPnl?x.result.maxDrawdown:na, win_rate:x.result.winRate,
    }));
    downloadCSV(`${(r.strategyId||o.strategyId).toLowerCase()}_optimization.csv`, rows);
  },
  exportOptimizeJSON(){
    const o = this.ui.optimize, r = o.lastResult; if(!r || r.error) return;
    downloadJSON(`${(r.strategyId||o.strategyId).toLowerCase()}_optimization.json`, {strategy:r.strategyId||o.strategyId, base_scope:{league:o.league,season:o.season,dateFrom:o.dateFrom,dateTo:o.dateTo}, ...r});
  },
  renderOptimize(){
    const o = this.ui.optimize;
    const eligible = STRATEGIES.filter(s=>OPTIMIZABLE_STRATEGY_IDS.includes(s.id))
      .sort((a,b)=> (OPTIMIZE_TIER_ORDER[OPTIMIZE_STRATEGY_TIERS[a.id]?.tier]??9) - (OPTIMIZE_TIER_ORDER[OPTIMIZE_STRATEGY_TIERS[b.id]?.tier]??9) || a.name.localeCompare(b.name));
    const def = STRATEGIES.find(s=>s.id===o.strategyId);
    const leagues = this.leagues(), seasons = this.seasonsForLeague(o.league);
    const r = o.lastResult;
    const resultDef = r && r.strategyId ? STRATEGIES.find(s=>s.id===r.strategyId) : def;
    const selectedTierInfo = OPTIMIZE_STRATEGY_TIERS[o.strategyId];

    const pct = v => v===null || v===undefined ? "—" : `${v>=0?"+":""}${v}%`;
    const units = v => v===null || v===undefined ? "—" : `${v>=0?"+":""}${v}u`;

    let resultsBlock = "";
    if(o.running){
      resultsBlock = `<div class="card empty-state">${ICONS.info}<div>Working…</div></div>`;
    } else if(r && r.error){
      resultsBlock = `<div class="warn-note" style="margin-top:14px;">${ICONS.warn} ${esc(r.error)}</div>`;
    } else if(r){
      const gridDesc = r.gridSummary.map(g=>`<b>${esc(g.label)}</b>: tried ${g.values.join(", ")}`).join(" &nbsp;•&nbsp; ") || "(no strategy-specific settings to try — every adjustable field here is a scope filter, not a setting)";
      const usesPnl = r.usesPnl;
      const provenRows = usesPnl
        ? r.top.filter(x=>x.result.qualified>0).sort((a,b)=>(b.result.netPnl??-Infinity)-(a.result.netPnl??-Infinity))
        : r.top.filter(x=>x.result.qualified>0).sort((a,b)=>(b.result.winRate??-Infinity)-(a.result.winRate??-Infinity));
      // League/Season/Dates used for this search — encoded once here so the "View Full Detail"
      // button on each row can carry it straight into the Strategies tab and run it immediately.
      const encodedScope = btoa(unescape(encodeURIComponent(JSON.stringify({league:o.league, season:o.season, team:o.team, dateFrom:o.dateFrom, dateTo:o.dateTo}))));

      resultsBlock = `
        <div class="card" style="padding:16px;margin-top:16px;">
          <div class="chart-title" style="margin-bottom:6px;">How this search worked</div>
          <div class="field-note" style="margin-bottom:4px;">Settings tried: ${gridDesc}</div>
          ${r.cappedNote ? `<div class="warn-note" style="margin-bottom:4px;">${ICONS.warn} ${esc(r.cappedNote)}</div>` : ""}
          <div class="field-note" style="margin-bottom:4px;">Staking plans: ${r.supportsStaking ? `all ${STAKING_PLANS.length} staking plans were tried` : "not applicable — this strategy uses a fixed bet size by design"}</div>
          <div class="field-note">We tried ${r.totalCombosEvaluated} combinations of settings; ${r.totalPassingSampleGuard} had enough bets to be worth showing.${r.maxDrawdownUnits!==null && r.excludedByDrawdownCap>0 ? ` ${r.excludedByDrawdownCap} more had enough bets but were excluded for exceeding your ${r.maxDrawdownUnits}-unit drawdown cap.` : ""}</div>
        </div>
        <div class="card" style="padding:16px;margin-top:14px;overflow-x:auto;">
          <div class="row" style="justify-content:space-between;margin-bottom:10px;">
            <div class="chart-title" style="margin:0;">${usesPnl ? `Top ${Math.min(5,provenRows.length)} settings by profit` : `Top ${Math.min(5,provenRows.length)} settings by real hit rate`}</div>
            <div class="row">
              <button class="btn" onclick="App.exportOptimizeCSV()">${ICONS.download} CSV (all ${r.allResults.length} combinations tried)</button>
              <button class="btn" onclick="App.exportOptimizeJSON()">${ICONS.download} JSON (all ${r.allResults.length} combinations tried)</button>
            </div>
          </div>
          ${provenRows.length===0 ? `<div class="empty-state">${ICONS.info}<div>No combination of settings had enough bets to be worth checking. The closest any combination got was <b>${r.bestQualifiedSeen} bet${r.bestQualifiedSeen===1?"":"s"}</b>, short of the minimum of ${r.minSampleSize} you set. ${r.bestQualifiedSeen===0 ? "This strategy did not trigger at all in your matches with this scope — check the Strategies tab to confirm this strategy applies to your data (e.g. it may need a specific team chosen, or a single league+season selected), or the League/Season/date filters above may be too narrow." : `Try lowering "Minimum qualifying bets" to ${r.bestQualifiedSeen} or below, or widen the League/Season/date scope above so the strategy has more real matches to trigger on.`}${r.maxDrawdownUnits!==null && r.excludedByDrawdownCap>0 ? ` ${r.excludedByDrawdownCap} setting${r.excludedByDrawdownCap===1?"":"s"} had enough bets but exceeded your ${r.maxDrawdownUnits}-unit drawdown cap — try raising or clearing it above.` : ""}</div></div>` : usesPnl ? `
          <div class="field-note" style="margin-bottom:10px;background:var(--panel2);padding:10px 12px;border-radius:6px;">
            <b>What these numbers mean:</b> every row below is this strategy's performance across your selected League/Season/Dates. <b>Bets Placed</b> = how many times this strategy actually bet &nbsp;•&nbsp; <b>Win Rate</b> = % of those bets that won &nbsp;•&nbsp; <b>Profit %</b> = profit as a percentage of the total amount staked &nbsp;•&nbsp; <b>Profit (units)</b> = total money won or lost, in your stake units &nbsp;•&nbsp; <b>Max Drawdown</b> = the biggest losing streak, in units, at any point.
          </div>
          <div class="table-scroll"><table>
            <thead><tr>
              <th>#</th><th>Setting Used</th>${r.supportsStaking?`<th style="width:150px;">Staking Plan</th>`:""}
              <th title="How many times this strategy actually placed a bet">Bets Placed</th>
              <th title="Percentage of those bets that won">Win Rate</th>
              <th title="Profit as a percentage of the total amount staked">Profit %</th>
              <th title="Total money won or lost in stake units">Profit (units)</th>
              <th title="The biggest losing streak in units, at any point">Max Drawdown</th>
              <th title="Take this exact setting and staking plan to the Strategies tab so you can pick a different League/Season and see if it still works there">Test Elsewhere</th>
              <th title="See the full detailed breakdown of this setting — In Scope, Triggered, Hit Rate, Net P&L, ROI, Max Drawdown, the equity chart, and every individual bet">Full Detail</th>
            </tr></thead>
            <tbody>
              ${provenRows.slice(0,5).map((x,i)=>`<tr>
                <td>${i+1}</td>
                <td style="width:200px;"><div style="display:flex;flex-wrap:wrap;gap:5px;">${humanizeParams(x.params, resultDef).split(" · ").map(part=>`<span class="pill pill-good" style="font-size:14px;white-space:normal;max-width:190px;">${esc(part)}</span>`).join("")}</div></td>
                ${r.supportsStaking?`<td style="width:150px;"><span class="pill ${x.stakingPlan?'pill-good':'pill-neutral'}" style="font-size:14px;white-space:normal;display:inline-block;line-height:1.4;">💰 ${x.stakingPlan ? esc((STAKING_PLANS.find(p=>p.id===x.stakingPlan)?.label||x.stakingPlan).replace(/^\d+\.\s*/,"")) : "Fixed stake"}</span></td>`:""}
                <td>${x.result.qualified}${x.result.qualified>0 && x.result.qualified<5?` <span class="pill pill-warn" title="Based on fewer than 5 bets — treat this result with caution">few bets</span>`:""}</td>
                <td>${x.result.winRate===null||x.result.winRate===undefined?"—":x.result.winRate+"%"}</td>
                <td>${pct(x.result.roi)}</td><td>${units(x.result.netPnl)}</td><td>${units(x.result.maxDrawdown)}</td>
                <td><button class="btn" style="padding:4px 10px;font-size:16.5px;" onclick="App.testOnAnotherLeague('${esc(r.strategyId||o.strategyId)}','${btoa(unescape(encodeURIComponent(JSON.stringify(x.params))))}','${x.stakingPlan||""}')">${ICONS.play} Test on another league</button></td>
                <td><button class="btn" style="padding:4px 10px;font-size:16.5px;" onclick="App.viewFullSeasonDetail('${esc(r.strategyId||o.strategyId)}','${btoa(unescape(encodeURIComponent(JSON.stringify(x.params))))}','${x.stakingPlan||""}','${encodedScope}')">${ICONS.play} View Full Detail</button></td>
              </tr>`).join("")}
            </tbody>
          </table></div>
          ` : `
          <div class="field-note" style="margin-bottom:10px;background:var(--panel2);padding:10px 12px;border-radius:6px;">
            <b>What these numbers mean:</b> every row below is this strategy's real hit rate across your selected League/Season/Dates. There's no Profit column here because no market odds exist in this data source for what this strategy bets (see this strategy's notes above) — <b>Bets Placed</b> = how many times this strategy actually triggered &nbsp;•&nbsp; <b>Win Rate</b> = % of those that were a real hit.
          </div>
          <div class="table-scroll"><table>
            <thead><tr>
              <th>#</th><th>Setting Used</th>
              <th title="How many times this strategy actually triggered">Bets Placed</th>
              <th title="Percentage of those that were a real hit">Win Rate</th>
              <th title="Take this exact setting to the Strategies tab so you can pick a different League/Season and see if it still works there">Test Elsewhere</th>
              <th title="See the full detailed breakdown of this setting — In Scope, Triggered, Hit Rate, the equity chart, and every individual bet">Full Detail</th>
            </tr></thead>
            <tbody>
              ${provenRows.slice(0,5).map((x,i)=>`<tr>
                <td>${i+1}</td>
                <td style="max-width:320px;"><div style="display:flex;flex-wrap:wrap;gap:5px;">${humanizeParams(x.params, resultDef).split(" · ").map(part=>`<span class="pill pill-good" style="font-size:14px;white-space:normal;max-width:300px;">${esc(part)}</span>`).join("")}</div></td>
                <td>${x.result.qualified}${x.result.qualified>0 && x.result.qualified<5?` <span class="pill pill-warn" title="Based on fewer than 5 bets — treat this result with caution">few bets</span>`:""}</td>
                <td>${x.result.winRate===null||x.result.winRate===undefined?"—":x.result.winRate+"%"}</td>
                <td><button class="btn" style="padding:4px 10px;font-size:16.5px;" onclick="App.testOnAnotherLeague('${esc(r.strategyId||o.strategyId)}','${btoa(unescape(encodeURIComponent(JSON.stringify(x.params))))}','')">${ICONS.play} Test on another league</button></td>
                <td><button class="btn" style="padding:4px 10px;font-size:16.5px;" onclick="App.viewFullSeasonDetail('${esc(r.strategyId||o.strategyId)}','${btoa(unescape(encodeURIComponent(JSON.stringify(x.params))))}','','${encodedScope}')">${ICONS.play} View Full Detail</button></td>
              </tr>`).join("")}
            </tbody>
          </table></div>
          `}
        </div>`;
    }

    return `
      <div class="section-header">
        <div><div class="section-title" style="color:var(--accent);">Auto-Optimization</div><div class="section-sub">Tries different settings (and staking plans, where applicable) against your real historical results. Covers all ${OPTIMIZABLE_STRATEGY_IDS.length} strategies: the ${STRATEGIES.filter(s=>!s.pnlUnavailable).length} that produce real profit/loss are ranked by real profit; the ${STRATEGIES.filter(s=>s.pnlUnavailable).length} hit-rate-only strategies (no market odds exist for what they bet) are ranked by real hit rate instead.</div></div>
      </div>
      <div class="card" style="padding:16px;margin-bottom:16px;">
        <div class="row" style="gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">
          <div><label class="field-label">Strategy</label><select onchange="App.setOptimizeField('strategyId', this.value)" style="min-width:280px;">
            ${["reliable","needs_history","rare_by_design"].map(tier=>{
              const inTier = eligible.filter(s=>OPTIMIZE_STRATEGY_TIERS[s.id]?.tier===tier);
              if(!inTier.length) return "";
              return `<optgroup label="${esc(OPTIMIZE_TIER_LABELS[tier])}">${inTier.map(s=>`<option value="${s.id}" ${o.strategyId===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</optgroup>`;
            }).join("")}
          </select></div>
          <div><label class="field-label">League (optional filter)</label><select onchange="App.setOptimizeField('league', this.value)"><option value="ALL">All leagues</option>${leagues.map(l=>`<option value="${esc(l)}" ${o.league===l?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
          <div><label class="field-label">Season (optional filter)</label><select onchange="App.setOptimizeField('season', this.value)"><option value="ALL">All seasons</option>${seasons.map(s=>`<option value="${esc(s)}" ${o.season===s?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
          <div><label class="field-label">Team (optional filter)</label><select onchange="App.setOptimizeField('team', this.value)" style="min-width:200px;" title="Search only settings that work well for one specific team, instead of the league as a whole.">
            <option value="ALL">All teams</option>
            ${this.teamsForResearch(o.league, o.season).map(t=>`<option value="${esc(t)}" ${o.team===t?'selected':''}>${esc(t)}</option>`).join("")}
          </select></div>
        </div>
        <div class="row" style="gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">
          <div><label class="field-label">From (optional)</label><input type="date" value="${esc(o.dateFrom)}" oninput="App.setOptimizeField('dateFrom', this.value)" style="width:150px;"></div>
          <div><label class="field-label">To (optional)</label><input type="date" value="${esc(o.dateTo)}" oninput="App.setOptimizeField('dateTo', this.value)" style="width:150px;"></div>
          <div><label class="field-label">Minimum bets to consider a setting</label><input type="number" value="${esc(o.minSampleSize)}" oninput="App.setOptimizeField('minSampleSize', this.value)" style="width:100px;"></div>
          <div><label class="field-label" title="Rejects any setting whose worst losing streak (in your stake units) went above this. Leave blank for no limit.">Maximum acceptable drawdown (units, optional)</label><input type="number" placeholder="No limit" value="${esc(o.maxDrawdownUnits)}" oninput="App.setOptimizeField('maxDrawdownUnits', this.value)" style="width:130px;"></div>
        </div>
        ${selectedTierInfo && selectedTierInfo.note ? `<div class="warn-note" style="margin-bottom:10px;">${ICONS.warn} ${esc(selectedTierInfo.note)}</div>` : ""}
        <button class="btn btn-accent" onclick="App.runOptimizationNow()" ${o.running?"disabled":""}>${ICONS.play} Run Optimization</button>
      </div>
      ${resultsBlock}
    `;
  },

  renderDutching(){
    const tab = this.ui.calcTab || "dutching";
    const tabs = [{id:"dutching",label:"Dutching"},{id:"compounding",label:"Compounding"},{id:"lockin",label:"Lock-In"}];
    return `
      <div class="section-header"><div><div class="section-title">Trading Calculators</div><div class="section-sub">Standalone tools — pure math on odds/stakes you enter, no historical data dependency, work today regardless of what's imported.</div></div></div>
      <div class="row" style="gap:8px;margin-bottom:16px;">
        ${tabs.map(t=>`<button class="btn" style="${tab===t.id?'background:var(--accent);color:#fff;border-color:var(--accent);':''}" onclick="App.setCalcTab('${t.id}')">${esc(t.label)}</button>`).join("")}
      </div>
      ${tab==="dutching" ? this.renderDutchingPanel() : tab==="compounding" ? this.renderCompoundingPanel() : this.renderLockInPanel()}
    `;
  },

  /* ---------------- RUNS ---------------- */
  deleteRun(id){ this.state.runs = this.state.runs.filter(r=>r.id!==id); this.persist(); this.render(); },

  /* ---------------- EXPORT ---------------- */
  exportAllMatchesCSV(){ downloadCSV("matches_export.csv", this.allMatches().map(m=>({...m, raw:undefined, issues:m.issues.map(i=>i.code).join("|")}))); },
  exportAllMatchesJSON(){ downloadJSON("matches_export.json", this.allMatches()); },
  exportRunCSV(id){ const r=this.state.runs.find(x=>x.id===id); downloadCSV(`${r.configName.replace(/\s+/g,"_")}_ledger.csv`, r.ledger); },
  exportRunJSON(id){ const r=this.state.runs.find(x=>x.id===id); downloadJSON(`${r.configName.replace(/\s+/g,"_")}_ledger.json`, r); },
  renderExport(){
    const all = this.allMatches();
    const runsCards = this.state.runs.map(r=>`
      <div class="card" style="padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div><div style="font-family:var(--bf);font-size:20px;font-weight:600;color:var(--ink);">${esc(r.configName)} — ledger</div><div class="dataset-sub">${r.ledger.length} observations · run ${new Date(r.timestamp).toLocaleDateString()}</div></div>
        <div class="row" style="gap:8px;"><button class="btn" onclick="App.exportRunCSV('${r.id}')">CSV</button><button class="btn" onclick="App.exportRunJSON('${r.id}')">JSON</button><button class="btn btn-danger" onclick="App.deleteRun('${r.id}')" title="Delete this run">${ICONS.trash}</button></div>
      </div>`).join("");
    return `
      <div class="section-header"><div><div class="section-title" style="color:var(--accent);">Export</div><div class="section-sub">Export raw match data or research ledgers for external analysis.</div></div>
        ${this.state.runs.length>0 ? `<button class="btn btn-danger" onclick="App.clearAllRuns()">${ICONS.trash} Delete All Runs</button>` : ""}
      </div>
      <div class="card" style="padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div><div style="font-family:var(--bf);font-size:20px;font-weight:600;color:var(--ink);">All matches (normalized)</div><div class="dataset-sub">${all.length} rows</div></div>
        <div class="row" style="gap:8px;">
          <button class="btn" ${all.length?"":"disabled"} onclick="App.exportAllMatchesCSV()">CSV</button>
          <button class="btn" ${all.length?"":"disabled"} onclick="App.exportAllMatchesJSON()">JSON</button>
        </div>
      </div>
      ${runsCards}
      ${this.state.datasets.length===0 ? `<div class="card empty-state">Nothing to export yet.</div>` : ""}
    `;
  },
};

// ===== Auth (Supabase) =====
// Simple email/password gate in front of the app. Data itself still lives only in the
// browser (localStorage) for now — this just controls who can open the app at all.
const SITE_URL = "https://soccer-optimization.zerorisk1966.workers.dev";
const SUPABASE_URL = "https://nzuiwcxvocgakytehlel.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QBagEKsbCL6LNr06ROf5XQ_ZrZ07u5K";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const Auth = {
  mode: "signin",
  error: "",
  loading: false,
  emailVal: "",

  async init(){
    const { data: { session } } = await sb.auth.getSession();
    if(session){ this.checkAccess(session.user); } else { this.showAuthScreen(); }
    sb.auth.onAuthStateChange((event, session)=>{
      if(event === "PASSWORD_RECOVERY"){
        this.mode = "reset"; this.error = ""; this.showAuthScreen();
      }
      else if(event === "SIGNED_IN" && session){ this.checkAccess(session.user); }
      else if(event === "SIGNED_OUT"){ this.showAuthScreen(); }
    });
  },

  showAuthScreen(){
    document.getElementById("app-shell").style.display = "none";
    document.getElementById("auth-root").style.display = "flex";
    this.render();
  },

  // Looks up (or creates) this user's row in the "subscribers" table, then decides
  // whether to show the real app or a "please subscribe" screen.
  async checkAccess(user){
    try{
      let { data: rows, error } = await sb.from("subscribers").select("*").eq("user_id", user.id).limit(1);
      if(error) throw error;
      let sub = rows && rows[0];
      if(!sub){
        // First time we've ever seen this user: start their 7-day free trial.
        const trialEndsAt = new Date(Date.now() + 7*24*60*60*1000).toISOString();
        const { data: inserted, error: insErr } = await sb.from("subscribers")
          .insert({ user_id: user.id, status: "trialing", trial_ends_at: trialEndsAt })
          .select().single();
        if(insErr) throw insErr;
        sub = inserted;
      }
      const trialActive = sub.status === "trialing" && sub.trial_ends_at && new Date(sub.trial_ends_at) > new Date();
      const isActive = sub.status === "active";
      if(isActive || trialActive){ this.showApp(user, sub); }
      else { this.showSubscribeScreen(user, sub); }
    }catch(e){
      console.error("Subscription check failed:", e);
      // Don't lock anyone out because of a technical hiccup while this is still being tested.
      this.showApp(user, null);
    }
  },

  showApp(user, sub){
    document.getElementById("auth-root").style.display = "none";
    document.getElementById("app-shell").style.display = "flex";
    let trialLine = "";
    if(sub && sub.status === "trialing" && sub.trial_ends_at){
      const daysLeft = Math.max(0, Math.ceil((new Date(sub.trial_ends_at) - new Date()) / (1000*60*60*24)));
      trialLine = `<div style="font-size:11px;color:var(--ink-faint);margin-bottom:6px;">Trial: ${daysLeft} day${daysLeft===1?"":"s"} left</div>`;
    }
    document.getElementById("account-box").innerHTML = `
      <div class="email">${esc(user.email)}</div>
      ${trialLine}
      <button onclick="Auth.signOut()">Log out</button>
    `;
    if(!window.__appBooted){ window.__appBooted = true; App.init(); }
  },

  showSubscribeScreen(user, sub){
    document.getElementById("app-shell").style.display = "none";
    document.getElementById("auth-root").style.display = "flex";
    const endedText = sub && sub.trial_ends_at
      ? `Your free trial ended on ${new Date(sub.trial_ends_at).toLocaleDateString()}.`
      : `Your free trial has ended.`;
    document.getElementById("auth-root").innerHTML = `
      <div class="auth-card">
        <div class="auth-title">Match <span style="font-style:italic;font-weight:400;">Ledger</span></div>
        <div class="auth-sub">${esc(endedText)} Subscribe to keep using Match Ledger.</div>
<button id="subscribe-btn" class="btn btn-accent" style="width:100%;justify-content:center;margin-bottom:14px;" onclick="(function(btn){btn.disabled=true;btn.textContent='Loading...';fetch('https://soccer-payments.zerorisk1966.workers.dev/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:'${esc(user.id)}',email:'${esc(user.email)}'})}).then(function(r){return r.json();}).then(function(d){if(d.url){window.location.href=d.url;}else{alert('Something went wrong: '+(d.error||'unknown error'));btn.disabled=false;btn.textContent='Subscribe Now';}}).catch(function(e){alert('Network error, please try again.');btn.disabled=false;btn.textContent='Subscribe Now';});})(this)">Subscribe Now</button>
        <div class="auth-toggle"><a onclick="Auth.signOut()">Log out</a></div>
      </div>
    `;
  },

  render(){
    if(this.mode === "forgot"){ this.renderForgot(); return; }
    if(this.mode === "reset"){ this.renderReset(); return; }
    const isSignUp = this.mode === "signup";
    document.getElementById("auth-root").innerHTML = `
      <div class="auth-card">
        <div class="auth-title">Match <span style="font-style:italic;font-weight:400;">Ledger</span></div>
        <div class="auth-sub">${isSignUp ? "Create your account" : "Log in to your research lab"}</div>
        ${this.error ? `<div class="auth-error">${esc(this.error)}</div>` : ""}
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="auth-email" autocomplete="email" value="${esc(this.emailVal||"")}">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <div style="position:relative;">
            <input type="password" id="auth-password" autocomplete="${isSignUp?'new-password':'current-password'}" style="width:100%;padding-right:40px;box-sizing:border-box;">
            <button type="button" onclick="Auth.togglePasswordVisibility()" aria-label="Show password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;color:#9ca3af;">
              <svg id="auth-eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        ${!isSignUp ? `<div style="text-align:right;margin:-6px 0 12px;"><a onclick="Auth.switchMode('forgot')" style="font-size:13px;cursor:pointer;color:#9ca3af;">Forgot password?</a></div>` : ""}
        <button class="btn btn-accent" style="width:100%;justify-content:center;" onclick="Auth.submit()" ${this.loading?"disabled":""}>${this.loading ? "Please wait..." : (isSignUp ? "Sign up" : "Log in")}</button>
        <div class="auth-toggle">
          ${isSignUp
            ? `Already have an account? <a onclick="Auth.switchMode('signin')">Log in</a>`
            : `New here? <a onclick="Auth.switchMode('signup')">Create an account</a>`}
        </div>
      </div>
    `;
    const emailInput = document.getElementById("auth-email");
    if(emailInput){
      emailInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") document.getElementById("auth-password").focus(); });
      const pwInput = document.getElementById("auth-password");
      if(pwInput) pwInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") this.submit(); });
    }
  },

  switchMode(m){ this.mode = m; this.error=""; this.render(); },

  renderForgot(){
    document.getElementById("auth-root").innerHTML = `
      <div class="auth-card">
        <div class="auth-title">Reset your password</div>
        <div class="auth-sub">Enter your email and we'll send you a link to set a new password.</div>
        ${this.error ? `<div class="auth-error">${esc(this.error)}</div>` : ""}
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="auth-email" autocomplete="email" value="${esc(this.emailVal||"")}">
        </div>
        <button class="btn btn-accent" style="width:100%;justify-content:center;" onclick="Auth.sendResetLink()" ${this.loading?"disabled":""}>${this.loading ? "Sending..." : "Send reset link"}</button>
        <div class="auth-toggle">Remembered it? <a onclick="Auth.switchMode('signin')">Back to log in</a></div>
      </div>
    `;
    const emailInput = document.getElementById("auth-email");
    if(emailInput) emailInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") this.sendResetLink(); });
  },

  async sendResetLink(){
    const email = document.getElementById("auth-email").value.trim();
    this.emailVal = email;
    if(!email){ this.error = "Please enter your email."; this.render(); return; }
    this.loading = true; this.error = ""; this.render();
    try{
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL });
      if(error) throw error;
      document.getElementById("auth-root").innerHTML = `
        <div class="auth-card">
          <div class="auth-title">Check your email</div>
          <div class="auth-sub">If an account exists for ${esc(email)}, we've sent a link to reset your password. Click it, then you'll be able to set a new one.</div>
          <button class="btn" style="width:100%;justify-content:center;margin-top:10px;" onclick="Auth.switchMode('signin')">Back to log in</button>
        </div>`;
    }catch(e){
      this.loading = false;
      this.error = e.message || "Something went wrong.";
      this.render();
    }
  },

  renderReset(){
    document.getElementById("auth-root").innerHTML = `
      <div class="auth-card">
        <div class="auth-title">Set a new password</div>
        <div class="auth-sub">Choose a new password for your account.</div>
        ${this.error ? `<div class="auth-error">${esc(this.error)}</div>` : ""}
        <div class="auth-field">
          <label>New password</label>
          <div style="position:relative;">
            <input type="password" id="auth-newpassword" autocomplete="new-password" style="width:100%;padding-right:40px;box-sizing:border-box;">
            <button type="button" onclick="Auth.togglePasswordVisibility('auth-newpassword','auth-newpassword-eye')" aria-label="Show password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;color:#9ca3af;">
              <svg id="auth-newpassword-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn btn-accent" style="width:100%;justify-content:center;" onclick="Auth.submitNewPassword()" ${this.loading?"disabled":""}>${this.loading ? "Saving..." : "Save new password"}</button>
      </div>
    `;
    const pwInput = document.getElementById("auth-newpassword");
    if(pwInput) pwInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") this.submitNewPassword(); });
  },

  async submitNewPassword(){
    const password = document.getElementById("auth-newpassword").value;
    if(!password || password.length < 6){ this.error = "Password must be at least 6 characters."; this.render(); return; }
    this.loading = true; this.error = ""; this.render();
    try{
      const { error } = await sb.auth.updateUser({ password });
      if(error) throw error;
      document.getElementById("auth-root").innerHTML = `
        <div class="auth-card">
          <div class="auth-title">Password updated</div>
          <div class="auth-sub">Your password has been changed. You're now logged in.</div>
          <button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:10px;" onclick="Auth.init()">Continue</button>
        </div>`;
    }catch(e){
      this.loading = false;
      this.error = e.message || "Something went wrong.";
      this.render();
    }
  },

  togglePasswordVisibility(inputId, iconId){
    const pwInput = document.getElementById(inputId || "auth-password");
    const icon = document.getElementById(iconId || "auth-eye-icon");
    if(!pwInput || !icon) return;
    const showing = pwInput.type === "text";
    pwInput.type = showing ? "password" : "text";
    icon.innerHTML = showing
      ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`
      : `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
  },

  async submit(){
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;
    this.emailVal = email;
    if(!email || !password){ this.error = "Please fill in both fields."; this.render(); return; }
    if(password.length < 6){ this.error = "Password must be at least 6 characters."; this.render(); return; }
    this.loading = true; this.error=""; this.render();
    try{
      if(this.mode === "signup"){
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(data.user && !data.session){
          this.loading = false; this.error = "";
          document.getElementById("auth-root").innerHTML = `
            <div class="auth-card">
              <div class="auth-title">Check your email</div>
              <div class="auth-sub">We've sent a confirmation link to ${esc(email)}. Click it, then come back and log in.</div>
              <button class="btn" style="width:100%;justify-content:center;margin-top:10px;" onclick="Auth.switchMode('signin')">Back to log in</button>
            </div>`;
          return;
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
    }catch(e){
      this.loading = false;
      this.error = e.message || "Something went wrong.";
      this.render();
    }
  },

  async signOut(){
    await sb.auth.signOut();
    window.__appBooted = false;
    location.reload();
  },
};

Auth.init();
</script>
</body>
