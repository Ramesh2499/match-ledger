const OPTIMIZE_TIER_ORDER = {reliable:0, needs_history:1, rare_by_design:2};
const OPTIMIZE_TIER_LABELS = {reliable:"Usually has enough bets to test", needs_history:"Needs a fuller season of match history", rare_by_design:"Rare by design (efficient markets)"};
const OPTIMIZE_EXCLUDE_KEYS = new Set(["league","season","dateFrom","dateTo","team","leagues","baseUnit","stake","stakingPlan","stakingParams","market"]);
// Fields on the Strategies tab that represent match scope (not strategy-specific settings) —
// these persist across strategy switches so the user doesn't have to re-enter League/Season/
// dates every time they try a different strategy on the same slice of data.
const STRATEGY_SCOPE_KEYS = new Set(["league","season","dateFrom","dateTo","team"]);
const OPTIMIZE_MAX_SWEPT_FIELDS = 2;

function buildNumericGrid(defaultVal, isOdds){
  if(defaultVal===0) return [0,1,2,3,5];
  const ratios = [0.5,0.75,1,1.25,1.5];
  const isIntLike = Number.isInteger(defaultVal);
  // Decimal odds are mathematically always above 1.0 (1.0 would mean "risk money to win nothing"),
  // so an odds-type field must never be swept down to 0 like a normal numeric field can — floor it
  // at 1.01, the lowest odds any real bookmaker would actually quote.
  const floor = isOdds ? 1.01 : 0;
  const raw = ratios.map(r=>{
    const v = defaultVal*r;
    return isIntLike ? Math.max(floor, Math.round(v)) : Number(Math.max(floor,v).toFixed(2));
  });
  return [...new Set(raw)].sort((a,b)=>a-b);
}

function buildSweepGrid(strategyDef){
  const schema = strategyDef.paramSchema || [];
  const defaults = strategyDef.defaultParams || {};
  const eligible = schema.filter(f=>{
    if(OPTIMIZE_EXCLUDE_KEYS.has(f.key)) return false;
    if(f.type==="number" && typeof defaults[f.key]==="number") return true;
    if(f.type==="select" && Array.isArray(f.options)) return true;
    if(f.type==="choice" && Array.isArray(f.choices)) return true;
    return false;
  });
  const swept = eligible.slice(0, OPTIMIZE_MAX_SWEPT_FIELDS);
  const heldBack = eligible.slice(OPTIMIZE_MAX_SWEPT_FIELDS);
  const gridSummary = swept.map(f=>{
    let values;
    if(f.type==="number") values = buildNumericGrid(defaults[f.key], /odds/i.test(f.key) || /odds/i.test(f.label) || /price.*floor|floor.*price/i.test(f.key) || /price.*floor|floor.*price/i.test(f.label));
    else if(f.type==="select") values = f.options;
    else values = f.choices.map(c=>c.value);
    return {key:f.key, label:f.label, values};
  });
  let combos = [{}];
  gridSummary.forEach(g=>{
    const next = [];
    combos.forEach(c=>{ g.values.forEach(v=>{ next.push({...c,[g.key]:v}); }); });
    combos = next;
  });
  const cappedNote = heldBack.length
    ? `${eligible.length} tunable parameters found on this strategy; swept the first ${swept.length} (${swept.map(f=>f.label).join(", ")}) to keep the grid size reasonable. Held at default: ${heldBack.map(f=>f.label).join(", ")}.`
    : null;
  return {combos, gridSummary, cappedNote, eligibleCount:eligible.length};
}

function defaultStakingParamsForPlan(planId){
  const plan = STAKING_PLANS.find(p=>p.id===planId);
  const params = {};
  (plan?.fields||[]).forEach(f=>{ params[f] = STAKING_FIELD_META[f]?.default; });
  return params;
}

// Turns a raw {key:value} params object into a plain-English description, using the strategy's
// own paramSchema labels. Shared by the Full Tool's Optimize tab and Simple Mode's "Optimize This"
// feature — one implementation, not two.
function humanizeParams(params, strategyDef){
  const entries = Object.entries(params||{});
  if(!entries.length) return "Default settings (nothing changed)";
  const schema = (strategyDef && strategyDef.paramSchema) || [];
  return entries.map(([k,v])=>{
    const field = schema.find(f=>f.key===k);
    const label = field ? field.label : k;
    let displayVal = v;
    if(field && field.type==="choice"){ const c=field.choices.find(c=>c.value===v); displayVal = c ? c.label : v; }
    else if(typeof v==="boolean") displayVal = v ? "Yes" : "No";
    return `${label}: ${displayVal}`;
  }).join(" · ");
}

// Chronological split scoped to the same league/season filter the strategy will run with.
// Splits on distinct match dates (not row count) so the boundary is unambiguous, and picks
// the out-of-sample start as the first date strictly after the in-sample cutoff so the two
// windows never overlap (both dateFrom/dateTo are inclusive bounds in every strategy's own
// scope filter, matching runResearch's existing semantics).
const OPTIMIZE_MIN_DISTINCT_DATES = 10;
function computeChronoSplit(matches, baseParams, splitRatio){
  const scoped = matches.filter(m=>{
    if(baseParams.league && baseParams.league!=="ALL" && m.league!==baseParams.league) return false;
    if(baseParams.season && baseParams.season!=="ALL" && m.season!==baseParams.season) return false;
    if(baseParams.dateFrom && m.date && m.date<baseParams.dateFrom) return false;
    if(baseParams.dateTo && m.date && m.date>baseParams.dateTo) return false;
    return true;
  });
  const scopedWithDate = scoped.filter(m=>!!m.date);
  const dates = [...new Set(scopedWithDate.map(m=>m.date))].sort();
  const diag = {matchesInScope: scoped.length, matchesWithUsableDate: scopedWithDate.length, distinctDates: dates.length, minRequired: OPTIMIZE_MIN_DISTINCT_DATES};
  if(dates.length<OPTIMIZE_MIN_DISTINCT_DATES) return {error:"too_few_dates", diag};
  const idx = Math.max(1, Math.min(dates.length-1, Math.floor(dates.length*splitRatio)));
  const cutoff = dates[idx-1];
  let nextIdx = idx;
  while(nextIdx<dates.length && dates[nextIdx]<=cutoff) nextIdx++;
  if(nextIdx>=dates.length) return {error:"no_oos_room", diag};
  const oosStart = dates[nextIdx];
  return {cutoff, oosStart, isDistinctDates: idx, oosDistinctDates: dates.length-nextIdx, totalDistinctDates: dates.length, diag};
}

function runOptimization(matches, strategyDef, baseParams, options){
  const minSample = Number(options.minSampleSize)||10;
  const maxDrawdownUnits = (options.maxDrawdownUnits!==null && options.maxDrawdownUnits!==undefined && options.maxDrawdownUnits!=="" && !isNaN(Number(options.maxDrawdownUnits))) ? Number(options.maxDrawdownUnits) : null;
  const usesPnl = !strategyDef.pnlUnavailable;
  // Team filtering happens once, here, before any combo is tried — not inside each of the 101
  // strategies' own evaluate functions — so a team filter works uniformly for every strategy,
  // not just ones specifically built to understand a "team" parameter.
  if(baseParams.team && baseParams.team!=="ALL"){
    matches = matches.filter(m=>m.home_team===baseParams.team || m.away_team===baseParams.team);
  }
  const {combos, gridSummary, cappedNote} = buildSweepGrid(strategyDef);
  const supportsStaking = "stakingPlan" in (strategyDef.defaultParams||{});
  const stakingPlanIds = supportsStaking ? STAKING_PLANS.map(p=>p.id) : [null];

  const results = [];
  let bestQualifiedSeen = 0; // tracked across every combo tried, pass or fail, so we can tell the user how close they got
  let excludedByDrawdownCap = 0; // combos that had enough bets but were rejected for exceeding the risk cap below
  for(const combo of combos){
    for(const planId of stakingPlanIds){
      const merged = {...JSON.parse(JSON.stringify(strategyDef.defaultParams)), ...baseParams, ...combo};
      if(supportsStaking){ merged.stakingPlan = planId; merged.stakingParams = defaultStakingParamsForPlan(planId); }
      let res=null;
      try{ res = strategyDef.run(matches, merged); }catch(e){ res=null; }
      if(res && res.qualified>bestQualifiedSeen) bestQualifiedSeen = res.qualified;
      if(!res || !(res.qualified>=minSample)) continue;
      if(maxDrawdownUnits!==null && Math.abs(res.maxDrawdown||0) > maxDrawdownUnits){ excludedByDrawdownCap++; continue; }
      results.push({
        params: combo, stakingPlan: planId,
        result: {qualified:res.qualified, roi:res.roi, netPnl:res.netPnl, maxDrawdown:res.maxDrawdown, winRate:res.winRate},
      });
    }
  }
  // Ranking metric differs by strategy type: real-P&L strategies rank by Profit (units) — the
  // thing that actually matters, money in hand. Hit-rate-only strategies have no real P&L (no
  // market odds exist for what they bet), so they rank by real win rate % instead.
  results.sort((a,b)=> usesPnl ? (b.result.netPnl??-Infinity)-(a.result.netPnl??-Infinity) : (b.result.winRate??-Infinity)-(a.result.winRate??-Infinity));
  // De-duplicate before taking the top N: different parameter values can trigger on the exact
  // same set of real matches (e.g. widening a "max odds" ceiling that no real match's odds
  // actually fall past) — that's not a bug, but showing the identical real result 3 times as if
  // they were 3 different discoveries is confusing and looks broken. Keep only the first
  // (highest-ranked) combo per distinct real outcome, then keep filling from the ranked list
  // until we have real, meaningfully different results.
  const seenSignatures = new Set();
  const deduped = [];
  for(const r of results){
    const sig = `${r.result.qualified}|${r.result.roi}|${r.result.netPnl}|${r.result.winRate}|${r.result.maxDrawdown}|${r.stakingPlan||""}`;
    if(seenSignatures.has(sig)) continue;
    seenSignatures.add(sig);
    deduped.push(r);
  }
  const top = deduped.slice(0,5);
  return {
    gridSummary, cappedNote, supportsStaking, usesPnl, minSampleSize:minSample,
    maxDrawdownUnits, excludedByDrawdownCap,
    totalCombosEvaluated: combos.length*stakingPlanIds.length,
    totalPassingSampleGuard: results.length,
    bestQualifiedSeen,
    top, allResults: results,
  };
}

// The Research Engine's "Markets" (Back Home Win, Over 2.5 Goals, etc.) have no swept
// parameters like the 101 named Strategies do — a market rule is fixed. The only real lever
// left to optimize is WHICH STAKING PLAN sizes the bets, so this runs the same fixed rule once
// per staking plan (13 total, using each plan's own sensible default parameters), ranks them by
// real profit, and returns the Top 5 — same shape and same honesty as runOptimization above, just
// over a much smaller, market-appropriate search space. Markets with no historical odds column
// (usesOdds:false) have nothing to optimize, since a staking plan can't change a hit-rate-only
// result — callers should check that before calling this.
function runResearchOptimization(matches, marketId, baseConfig, options){
  const minSample = Number(options.minSampleSize)||10;
  const maxDrawdownUnits = (options.maxDrawdownUnits!==null && options.maxDrawdownUnits!==undefined && options.maxDrawdownUnits!=="" && !isNaN(Number(options.maxDrawdownUnits))) ? Number(options.maxDrawdownUnits) : null;
  const results = [];
  let bestQualifiedSeen = 0, excludedByDrawdownCap = 0;
  for(const plan of STAKING_PLANS){
    const config = {...baseConfig, market:marketId, stakingPlan:plan.id, stakingParams: defaultStakingParamsForPlan(plan.id)};
    let res=null;
    try{ res = runResearch(matches, config); }catch(e){ res=null; }
    if(res && res.qualified>bestQualifiedSeen) bestQualifiedSeen = res.qualified;
    if(!res || !(res.qualified>=minSample)) continue;
    if(maxDrawdownUnits!==null && Math.abs(res.maxDrawdown||0) > maxDrawdownUnits){ excludedByDrawdownCap++; continue; }
    const decided = res.wins+res.losses;
    const totalStaked = (res.ledger||[]).reduce((sum,l)=>sum+(l.stake_units||0), 0);
    results.push({
      stakingPlan: plan.id,
      result: {
        qualified: res.qualified,
        winRate: decided ? Number((res.wins/decided*100).toFixed(2)) : null,
        netPnl: res.finalUnits,
        roi: totalStaked ? Number((res.finalUnits/totalStaked*100).toFixed(2)) : null,
        maxDrawdown: res.maxDrawdown,
      },
    });
  }
  results.sort((a,b)=>(b.result.netPnl??-Infinity)-(a.result.netPnl??-Infinity));
  return {
    marketId, minSampleSize:minSample, maxDrawdownUnits, excludedByDrawdownCap,
    totalCombosEvaluated: STAKING_PLANS.length, totalPassingSampleGuard: results.length,
    bestQualifiedSeen, top: results.slice(0,5), allResults: results,
  };
}

/* ---------------- STRATEGY #2: TOP THREE TREBLE (and #4: reusable for N legs) ---------------- */
function evaluateTopNAccumulator(matches, params){
  const league = params.league, season = params.season;
  if(!league || league==="ALL" || !season || season==="ALL") return emptyStrategyResult("Select a single league and season — standings require one specific competition.");
  const leagueMatches = matches.filter(m=>m.league===league && m.season===season);
  const weeksMap = groupMatchesByWeek(leagueMatches);
  const weekKeys = Object.keys(weeksMap).sort();
  if(weekKeys.length===0) return emptyStrategyResult("No matches found for the selected league/season.");
  const coolOff = Number(params.coolOffWeeks)||10;
  const numLegs = Number(params.numLegs)||3;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);

  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;
  const weekMap={};

  weekKeys.forEach((wk,i)=>{
    const wkMatches = weeksMap[wk].slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const weekStart = wkMatches[0].date;
    if(i<coolOff){ ledger.push({week:wk, date:weekStart, legs:"—", combined_odds:"—", status:"COOL_OFF", pnl:0, cumulative_units:cumulative, notes:`Gameweek ${i+1} of ${coolOff}-week cool-off — no bet placed`}); return; }
    if(!weekStart){ missing++; ledger.push({week:wk, date:"—", legs:"—", combined_odds:"—", status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Match dates missing for this week"}); return; }
    const table = computeLeagueTable(matches, league, season, weekStart);
    if(table.length<numLegs){ missing++; ledger.push({week:wk, date:weekStart, legs:"—", combined_odds:"—", status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough completed matches yet to build a full table"}); return; }
    const ranked = rankTeams(table,"TOP").slice(0,numLegs);
    const legs=[]; let ok=true, reason="";
    for(const t of ranked){
      const fixture = wkMatches.find(m=>m.home_team===t.team || m.away_team===t.team);
      if(!fixture){ ok=false; reason=`${t.team} has no fixture this week`; break; }
      if(fixture.home_goals===null||fixture.away_goals===null||!fixture.full_time_result||fixture.invalid||fixture.result_conflict){ ok=false; reason=`${t.team}'s fixture result unavailable`; break; }
      const isHome = fixture.home_team===t.team;
      const odds = isHome ? fixture.odds_B365H : fixture.odds_B365A;
      if(odds===null){ ok=false; reason=`No odds for ${t.team}'s fixture`; break; }
      const won = isHome ? fixture.full_time_result==="H" : fixture.full_time_result==="A";
      legs.push({team:t.team, opponent:isHome?fixture.away_team:fixture.home_team, home:isHome, odds, won, score:`${fixture.home_goals}-${fixture.away_goals}`});
    }
    if(!ok){ notTriggered++; ledger.push({week:wk, date:weekStart, legs:ranked.map(t=>t.team).join(", "), combined_odds:"—", status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:reason}); return; }
    const combinedOdds = legs.reduce((p,l)=>p*l.odds,1);
    const allWon = legs.every(l=>l.won);
    const legsDesc = legs.map(l=>`${l.team} ${l.won?"✓":"✗"} (${l.home?"H":"A"} vs ${l.opponent}, ${l.score})`).join(" | ");
    if(!engine.eligible(combinedOdds)){ notTriggered++; ledger.push({week:wk, date:weekStart, legs:legsDesc, combined_odds:combinedOdds.toFixed(2), status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); return; }
    qualified++;
    const stake = engine.stakeFor(combinedOdds);
    const pnl = allWon ? (combinedOdds-1)*stake : -stake;
    engine.settle(allWon, pnl);
    if(allWon) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    weekMap[wk]=(weekMap[wk]||0)+1;
    ledger.push({week:wk, date:weekStart, legs:legsDesc, combined_odds:combinedOdds.toFixed(2), status:allWon?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)), notes:`Staked ${stake.toFixed(2)}u @ combined odds ${combinedOdds.toFixed(2)}`});
  });

  return finalizeStrategyResult({scopeCount:weekKeys.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap, fixedStake:stake});
}

/* ---------------- STRATEGY: SINKING FAST ---------------- */
function evaluateSinkingFast(matches, params){
  const league=params.league, season=params.season;
  if(!league||league==="ALL"||!season||season==="ALL") return emptyStrategyResult("Select a single league and season.");
  const leagueMatches = matches.filter(m=>m.league===league && m.season===season);
  const weeksMap = groupMatchesByWeek(leagueMatches);
  const weekKeys = Object.keys(weeksMap).sort();
  if(weekKeys.length===0) return emptyStrategyResult("No matches found for the selected league/season.");
  const coolOff = Number(params.coolOffWeeks)||10;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);

  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;
  const weekMap={};

  weekKeys.forEach((wk,i)=>{
    const wkMatches = weeksMap[wk].slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const weekStart = wkMatches[0].date;
    if(i<coolOff){ ledger.push({week:wk,date:weekStart,bottom_team:"—",opponent:"—",selection_odds:"—",status:"COOL_OFF",pnl:0,cumulative_units:cumulative,notes:`Gameweek ${i+1} of ${coolOff}-week cool-off`}); return; }
    if(!weekStart){ missing++; ledger.push({week:wk,date:"—",bottom_team:"—",opponent:"—",selection_odds:"—",status:"MISSING_DATA",pnl:0,cumulative_units:cumulative,notes:"Missing dates"}); return; }
    const table = computeLeagueTable(matches, league, season, weekStart);
    if(table.length===0){ missing++; ledger.push({week:wk,date:weekStart,bottom_team:"—",opponent:"—",selection_odds:"—",status:"MISSING_DATA",pnl:0,cumulative_units:cumulative,notes:"Table not yet available"}); return; }
    const bottom = rankTeams(table,"BOTTOM")[0];
    const fixture = wkMatches.find(m=>m.home_team===bottom.team || m.away_team===bottom.team);
    if(!fixture){ notTriggered++; ledger.push({week:wk,date:weekStart,bottom_team:bottom.team,opponent:"—",selection_odds:"—",status:"NOT_TRIGGERED",pnl:0,cumulative_units:cumulative,notes:`${bottom.team} has no fixture this week`}); return; }
    if(fixture.home_goals===null||fixture.away_goals===null||!fixture.full_time_result||fixture.invalid||fixture.result_conflict){ missing++; ledger.push({week:wk,date:weekStart,bottom_team:bottom.team,opponent:"—",selection_odds:"—",status:"MISSING_DATA",pnl:0,cumulative_units:cumulative,notes:"Fixture result unavailable"}); return; }
    const bottomIsHome = fixture.home_team===bottom.team;
    const opponent = bottomIsHome?fixture.away_team:fixture.home_team;
    const odds = bottomIsHome ? fixture.odds_B365A : fixture.odds_B365H;
    if(odds===null){ notTriggered++; ledger.push({week:wk,date:weekStart,bottom_team:bottom.team,opponent,selection_odds:"—",status:"NOT_TRIGGERED",pnl:0,cumulative_units:cumulative,notes:"No odds for opponent"}); return; }
    if(!engine.eligible(odds)){ notTriggered++; ledger.push({week:wk,date:weekStart,bottom_team:bottom.team,opponent,selection_odds:odds,status:"NOT_TRIGGERED",pnl:0,cumulative_units:cumulative,notes:"Staking plan odds requirement not met"}); return; }
    const won = bottomIsHome ? fixture.full_time_result==="A" : fixture.full_time_result==="H";
    qualified++;
    const stake = engine.stakeFor(odds);
    const pnl = won ? (odds-1)*stake : -stake;
    engine.settle(won,pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    weekMap[wk]=(weekMap[wk]||0)+1;
    ledger.push({week:wk,date:weekStart,bottom_team:bottom.team,opponent,selection_odds:odds,status:won?"WIN":"LOSS",stake_units:Number(stake.toFixed(4)),pnl:Number(pnl.toFixed(4)),cumulative_units:Number(cumulative.toFixed(4)),bankroll:Number(engine.getBankroll().toFixed(4)),notes:`${opponent} to beat ${bottom.team} (bottom, ${bottom.pts}pts) — staked ${stake.toFixed(2)}u @ ${odds}`});
  });

  return finalizeStrategyResult({scopeCount:weekKeys.length,qualified,notTriggered,missing,wins,losses,pushes:0,cumulative,maxDrawdown,peak,ledger,weekMap});
}

/* ---------------- STRATEGY: OUT IN FRONT (multi-league leaders) ---------------- */
function evaluateMultiLeagueLeaders(matches, params){
  const leagues = (params.leagues||[]).filter(Boolean);
  const season = params.season;
  if(leagues.length<2) return emptyStrategyResult("Select at least 2 leagues to form a multi-league accumulator (up to 5).");
  if(!season||season==="ALL") return emptyStrategyResult("Select a single season — mixing seasons across leagues isn't supported yet.");
  const baseUnit = Number(params.baseUnit)||1;
  const coolOff = Number(params.coolOffWeeks)||10;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);

  const perLeagueWeeks={}, leagueWeekIndex={};
  leagues.forEach(lg=>{ const lm=matches.filter(m=>m.league===lg && m.season===season); perLeagueWeeks[lg]=groupMatchesByWeek(lm); leagueWeekIndex[lg]=Object.keys(perLeagueWeeks[lg]).sort(); });
  const allWeekKeys = [...new Set(leagues.flatMap(lg=>Object.keys(perLeagueWeeks[lg])))].sort();
  if(allWeekKeys.length===0) return emptyStrategyResult("No matches found for the selected leagues/season.");

  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;
  const weekMap={};

  allWeekKeys.forEach(wk=>{
    const legs=[]; let ok=true, reason="", weekStart=null;
    for(const lg of leagues){
      const idx = leagueWeekIndex[lg].indexOf(wk);
      if(idx===-1){ ok=false; reason=`${lg} has no fixtures this week`; break; }
      if(idx<coolOff){ ok=false; reason=`${lg} still in its ${coolOff}-week cool-off (week ${idx+1})`; break; }
      const wkMatches = perLeagueWeeks[lg][wk].slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
      const ws = wkMatches[0].date;
      if(!ws){ ok=false; reason=`${lg} missing match dates`; break; }
      if(!weekStart || ws<weekStart) weekStart = ws;
      const table = computeLeagueTable(matches, lg, season, ws);
      if(table.length===0){ ok=false; reason=`${lg} table not yet available`; break; }
      const leader = rankTeams(table,"TOP")[0];
      const fixture = wkMatches.find(m=>m.home_team===leader.team || m.away_team===leader.team);
      if(!fixture){ ok=false; reason=`${lg} leader (${leader.team}) has no fixture this week`; break; }
      if(fixture.home_goals===null||fixture.away_goals===null||!fixture.full_time_result||fixture.invalid||fixture.result_conflict){ ok=false; reason=`${lg} leader's result unavailable`; break; }
      const isHome = fixture.home_team===leader.team;
      const odds = isHome?fixture.odds_B365H:fixture.odds_B365A;
      if(odds===null){ ok=false; reason=`No odds for ${lg} leader's fixture`; break; }
      const won = isHome?fixture.full_time_result==="H":fixture.full_time_result==="A";
      legs.push({league:lg, team:leader.team, opponent:isHome?fixture.away_team:fixture.home_team, home:isHome, odds, won, score:`${fixture.home_goals}-${fixture.away_goals}`});
    }
    if(!ok){ notTriggered++; ledger.push({week:wk, date:weekStart||"—", legs:"—", combined_odds:"—", status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:reason}); return; }
    const combinedOdds = legs.reduce((p,l)=>p*l.odds,1);
    const allWon = legs.every(l=>l.won);
    const legsDesc = legs.map(l=>`${l.league}: ${l.team} ${l.won?"✓":"✗"} (${l.home?"H":"A"}, ${l.score})`).join(" | ");
    if(!engine.eligible(combinedOdds)){ notTriggered++; ledger.push({week:wk, date:weekStart, legs:legsDesc, combined_odds:combinedOdds.toFixed(2), status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); return; }
    qualified++;
    const stake = engine.stakeFor(combinedOdds);
    const pnl = allWon ? (combinedOdds-1)*stake : -stake;
    engine.settle(allWon, pnl);
    if(allWon) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    weekMap[wk]=(weekMap[wk]||0)+1;
    ledger.push({week:wk, date:weekStart, legs:legsDesc, combined_odds:combinedOdds.toFixed(2), status:allWon?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)), notes:`Staked ${stake.toFixed(2)}u @ combined odds ${combinedOdds.toFixed(2)}`});
  });

  return finalizeStrategyResult({scopeCount:allWeekKeys.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap});
}

/* ---------------- STRATEGY: FOOTBALL DRAW SYSTEM ---------------- */
function evaluateDrawStreak(matches, params){
  const team = params.team;
  if(!team) return emptyStrategyResult("Select a team to track.");
  let teamMatches = matches.filter(m=> m.home_team===team || m.away_team===team);
  if(params.league && params.league!=="ALL") teamMatches = teamMatches.filter(m=>m.league===params.league);
  if(params.season && params.season!=="ALL") teamMatches = teamMatches.filter(m=>m.season===params.season);
  teamMatches = teamMatches.filter(m=>m.date).sort((a,b)=>a.date.localeCompare(b.date));
  if(teamMatches.length===0) return emptyStrategyResult(`No matches found for ${team} with the selected filters.`);

  const delayedEntry = Number(params.delayedEntry)||0;
  const minDrawOdds = Number(params.minDrawOdds)||3.5;
  const stopLossGames = Number(params.stopLossGames)||0;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);

  let active = delayedEntry===0, nonDrawStreak=0, lossesInCycle=0;
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,waiting=0,missing=0,wins=0,losses=0;
  const weekMap={};

  for(const m of teamMatches){
    const base = {date:m.date, opponent: m.home_team===team?m.away_team:m.home_team, home: m.home_team===team?"H":"A", score:(m.home_goals!==null&&m.away_goals!==null)?`${m.home_goals}-${m.away_goals}`:"N/A"};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, draw_odds:"—", streak:nonDrawStreak, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable"});
      continue;
    }
    const isDraw = m.full_time_result==="D";
    if(!active){
      waiting++;
      if(isDraw) nonDrawStreak=0; else { nonDrawStreak++; if(nonDrawStreak>=delayedEntry) active=true; }
      ledger.push({...base, draw_odds: m.odds_B365D??"—", streak:nonDrawStreak, status:"WAITING", pnl:0, cumulative_units:cumulative, notes:`Waiting for ${delayedEntry} non-draws in a row (currently ${nonDrawStreak})`});
      continue;
    }
    const drawOdds = m.odds_B365D;
    if(drawOdds===null){ missing++; ledger.push({...base, draw_odds:"—", streak:nonDrawStreak, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"No draw odds for this match"}); continue; }
    if(drawOdds<minDrawOdds){ ledger.push({...base, draw_odds:drawOdds, streak:nonDrawStreak, status:"BELOW_PRICE_FLOOR", pnl:0, cumulative_units:cumulative, notes:`Draw odds ${drawOdds} below baseline of ${minDrawOdds} — skipped, not bet`}); continue; }

    qualified++;
    const stake = engine.stakeFor(drawOdds);
    const pnl = isDraw ? (drawOdds-1)*stake : -stake;
    engine.settle(isDraw, pnl);
    if(isDraw) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    if(m.date){ const wk=isoWeekKey(m.date); weekMap[wk]=(weekMap[wk]||0)+1; }

    if(isDraw){
      nonDrawStreak=0; lossesInCycle=0; active = delayedEntry===0;
      ledger.push({...base, draw_odds:drawOdds, streak:nonDrawStreak, status:"WIN", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)), notes:`Draw hit — staked ${stake.toFixed(2)}u @ ${drawOdds}. Cycle reset.`});
    } else {
      lossesInCycle++;
      let note = `Staked ${stake.toFixed(2)}u @ ${drawOdds} — lost`;
      if(stopLossGames>0 && lossesInCycle>=stopLossGames){
        note += ` | STOP-LOSS: ${lossesInCycle} losses this cycle — accepting loss, cycle reset`;
        lossesInCycle=0; nonDrawStreak=0; active = delayedEntry===0;
      }
      ledger.push({...base, draw_odds:drawOdds, streak:nonDrawStreak, status:"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)), notes:note});
    }
  }

  return finalizeStrategyResult({scopeCount:teamMatches.length,qualified,notTriggered:waiting,missing,wins,losses,pushes:0,cumulative,maxDrawdown,peak,ledger,weekMap});
}

/* ============================================================================
   CORRECT-SCORE / HT-FT TRIGGER + HIT-RATE ENGINE
   Football-Data.co.uk has no correct-score or HT/FT market odds at all, so
   P&L for these 8 strategies is NOT computable from this data source — this
   is a hard data wall, not a missing-column gap. What IS real and computable:
   pre-match trigger conditions (favourite band, Over/Under 2.5 odds where the
   extended CSV has them) and hit-rate (does the actual recorded final score
   match the strategy's target scores). Every ledger row is traceable to a
   real imported row; nothing here is fabricated, but no unit P&L is produced.
============================================================================ */
function getFavourite(m){
  const H = m.odds_open.H, A = m.odds_open.A;
  if(H===null || A===null) return null;
  if(H===A) return {side:null, favOdds:H, dogOdds:A, favLabel:"No clear favourite (odds equal)"};
  const side = H<A ? "H" : "A";
  const favOdds = side==="H" ? H : A, dogOdds = side==="H" ? A : H;
  const favLabel = `${side==="H"?m.home_team:m.away_team} (${side})`;
  return {side, favOdds, dogOdds, favLabel};
}
function favScorePairs(favSide, pairs){
  // pairs given as [favouriteGoals, underdogGoals]; mapped to [home,away] by actual favourite side
  return pairs.map(([fg,dg]) => favSide==="H" ? [fg,dg] : [dg,fg]);
}
function htFtFlipFlag(m){
  if(!m.half_time_result || !m.full_time_result) return null;
  const htr = String(m.half_time_result).trim().toUpperCase(), ftr = m.full_time_result;
  if(htr==="H" && ftr==="A") return "Away came back from HT deficit";
  if(htr==="A" && ftr==="H") return "Home came back from HT deficit";
  return null;
}
function htGoalsSum(m){
  if(!m.half_time_goals) return null;
  const parts = m.half_time_goals.split("-").map(Number);
  if(parts.length!==2 || parts.some(isNaN)) return null;
  return parts[0]+parts[1];
}
function scopeFilterSortMatches(matches, params){
  return matches.filter(m=>{
    if(params.league && params.league!=="ALL" && m.league!==params.league) return false;
    if(params.season && params.season!=="ALL" && m.season!==params.season) return false;
    if(params.dateFrom && m.date && m.date<params.dateFrom) return false;
    if(params.dateTo && m.date && m.date>params.dateTo) return false;
    return true;
  }).slice().sort((a,b)=>(a.date||"9999-99-99").localeCompare(b.date||"9999-99-99"));
}
// Generic engine shared by all 8 correct-score / HT-FT strategies. `spec` supplies
// trigger(m,params) -> {dataMissing?,reason?,ok,side?,favOdds?,favLabel?}
// targetScores(m,trig,params) -> [[homeGoals,awayGoals], ...]
// extraCols(m,trig,hit) -> {...extra real, non-fabricated informational columns}
function evaluateCorrectScoreStrategy(matches, params, spec){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const ledger=[]; let qualified=0, notTriggered=0, missing=0, wins=0, losses=0;
  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null || m.away_goals===null || !m.full_time_result || m.invalid || m.result_conflict){
      missing++;
      ledger.push({...base, favourite:"—", fav_odds:"—", target_scores:"—", actual_score:"—", status:"MISSING_DATA", notes:"Result unavailable, invalid, or FTR/goals conflict on this row"});
      continue;
    }
    const trig = spec.trigger(m, params);
    if(trig.dataMissing){
      missing++;
      ledger.push({...base, favourite:"—", fav_odds:"—", target_scores:"—", actual_score:`${m.home_goals}-${m.away_goals}`, status:"ODDS_UNAVAILABLE", notes:trig.reason});
      continue;
    }
    if(!trig.ok){
      notTriggered++;
      ledger.push({...base, favourite:trig.favLabel||"—", fav_odds:trig.favOdds??"—", target_scores:"—", actual_score:`${m.home_goals}-${m.away_goals}`, status:"NOT_TRIGGERED", notes:trig.reason});
      continue;
    }
    qualified++;
    const targets = spec.targetScores(m, trig, params);
    const actual = [m.home_goals, m.away_goals];
    const hit = targets.some(([h,a])=>h===actual[0] && a===actual[1]);
    if(hit) wins++; else losses++;
    const extra = spec.extraCols ? spec.extraCols(m, trig, hit) : {};
    ledger.push({
      ...base,
      favourite: trig.favLabel||"—", fav_odds: trig.favOdds??"—",
      target_scores: targets.map(([h,a])=>`${h}-${a}`).join(", "),
      actual_score: `${actual[0]}-${actual[1]}`,
      status: hit ? "HIT" : "MISS",
      stake_units:0, pnl:0, cumulative_units:0,
      notes: (hit ? "Target score hit. " : "Target score missed. ") + "P&L not computable — no correct-score/HT-FT odds in source data; hit-rate only.",
      ...extra,
    });
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative:0, maxDrawdown:0, peak:0, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: OVER 2.5 & BTTS (correct score) ---------------- */
function evaluateOver25BttsCS(matches, params){
  return evaluateCorrectScoreStrategy(matches, params, {
    trigger(m, p){
      const H=m.odds_open.H, A=m.odds_open.A;
      if(H===null||A===null) return {dataMissing:true, reason:"Home/Away odds not available in source data"};
      const lo=Number(p.evenLo)||1.8, hi=Number(p.evenHi)||4.5;
      const ok = H>=lo && H<=hi && A>=lo && A<=hi;
      return {ok, reason: ok?"":`Not evenly matched by pre-match odds (H ${H}, A ${A}) — outside ${lo}–${hi} band used as a proxy for "high-scoring draw / narrow win expected" since no separate goal-expectation market exists`, favLabel: H<A?`${m.home_team} (H)`:A<H?`${m.away_team} (A)`:"Even odds", favOdds: Math.min(H,A)};
    },
    targetScores(m, trig, p){
      const base=[[3,1],[2,2],[1,3]];
      const optional = String(p.includeOptional)!=="false" ? [[2,3],[3,2]] : [];
      return [...base, ...optional];
    },
    extraCols(m){
      return { ht_score:m.half_time_goals||"—", ht_ft_flip: htFtFlipFlag(m)||"No", insurance_leg:"Lay Over 1.5 / Back Draw-Draw HT-FT" };
    },
  });
}
/* ---------------- STRATEGY: UNDER 2.5 GOALS LIKELY (correct score) ---------------- */
function evaluateUnder25LikelyCS(matches, params){
  return evaluateCorrectScoreStrategy(matches, params, {
    trigger(m, p){
      const u = m.odds_open.Under25;
      if(u===null) return {dataMissing:true, reason:"Under 2.5 Goals odds not in source data (requires football-data.co.uk extended odds file)"};
      const lo=Number(p.underLo)||1.55, hi=Number(p.underHi)||2.10;
      const ok = u>=lo && u<=hi;
      return {ok, reason: ok?"":`Under 2.5 odds ${u} outside configured ${lo}–${hi} band`, favOdds:u, favLabel:`Under 2.5 @ ${u}`};
    },
    targetScores(m, trig, p){ return p.variant==="B" ? [[1,1],[2,1],[1,2]] : [[0,2],[1,1],[2,0]]; },
    extraCols(m){
      const htg = htGoalsSum(m);
      return { ht_score:m.half_time_goals||"—", over15_ht_actual: htg!==null?(htg>1.5?"Yes":"No"):"—", insurance_leg:"Lay Under 3.5/4.5 / Back Over 1.5 First Half Goals" };
    },
  });
}
/* ---------------- STRATEGY: STRONG FAVOURITE 1 (Dominant, opponent competes) ---------------- */
function evaluateStrongFav1CS(matches, params){
  return evaluateCorrectScoreStrategy(matches, params, {
    trigger(m, p){
      const fav = getFavourite(m);
      if(!fav) return {dataMissing:true, reason:"Home/Away odds not available"};
      if(fav.side===null) return {ok:false, reason:"No clear favourite (odds equal)", favLabel:fav.favLabel, favOdds:fav.favOdds};
      const lo=Number(p.favLo)||1.45, hi=Number(p.favHi)||1.50;
      const ok = fav.favOdds>=lo && fav.favOdds<=hi;
      return {ok, reason: ok?"":`Favourite odds ${fav.favOdds} outside ${lo}–${hi} band`, side:fav.side, favOdds:fav.favOdds, favLabel:fav.favLabel};
    },
    targetScores(m, trig, p){
      const base=[[3,0],[3,1]]; const optional = p.includeDraw ? [[2,2]] : [];
      return favScorePairs(trig.side, base).concat(optional);
    },
    extraCols(m){ return { insurance_leg:"Lay Over 2.5 Match Goals / Lay favourite Half-Time" }; },
  });
}
/* ---------------- STRATEGY: STRONG FAVOURITE 2 (Favourite to rout) ---------------- */
function evaluateStrongFav2CS(matches, params){
  return evaluateCorrectScoreStrategy(matches, params, {
    trigger(m, p){
      const fav = getFavourite(m);
      if(!fav) return {dataMissing:true, reason:"Home/Away odds not available"};
      if(fav.side===null) return {ok:false, reason:"No clear favourite (odds equal)", favLabel:fav.favLabel, favOdds:fav.favOdds};
      const lo=Number(p.favLo)||1.45, hi=Number(p.favHi)||1.50;
      const favOk = fav.favOdds>=lo && fav.favOdds<=hi;
      const o = m.odds_open.Over25;
      if(o===null) return {dataMissing:true, reason:"Over 2.5 Goals odds not in source data (extended odds file required) — needed to verify the 'high total goals expected' leg"};
      const overMax = Number(p.overMax)||2.00;
      const overOk = o<=overMax;
      const ok = favOk && overOk;
      const reason = !favOk ? `Favourite odds ${fav.favOdds} outside ${lo}–${hi} band` : !overOk ? `Over 2.5 odds ${o} above ${overMax} threshold` : "";
      return {ok, reason, side:fav.side, favOdds:fav.favOdds, favLabel:fav.favLabel};
    },
    targetScores(m, trig){ return favScorePairs(trig.side, [[2,0],[3,1]]); },
    extraCols(m){ const total=(m.home_goals??0)+(m.away_goals??0); return { total_goals: total, over35_actual: total>3.5?"Yes":"No", insurance_leg:"Lay favourite on Match Odds" }; },
  });
}

function evaluateStrongFav3CS(matches, params){

      const lo=Number(p.favLo)||1.45, hi=Number(p.favHi)||1.50;
      const ok = fav.favOdds>=lo && fav.favOdds<=hi;
      return {ok, reason: ok?"":`Favourite odds ${fav.favOdds} outside ${lo}–${hi} band`, side:fav.side, favOdds:fav.favOdds, favLabel:fav.favLabel};
    },

/* ============================================================================
   DUTCHING STAKE CALCULATOR — pure math, no historical data dependency.
   Standard inverse-odds-weighting dutching: stake_i = S * (1/odds_i) / sum(1/odds_j)
   gives an equal payout (and therefore equal profit) whichever selection wins.
============================================================================ */
function calcDutching(totalStake, selections){
  const valid = selections.filter(s=>Number(s.odds)>1);
  const invSum = valid.reduce((s,v)=>s + 1/Number(v.odds), 0);
  const impliedProb = invSum; // sum of 1/odds across selections = implied probability "used up"
  const rows = selections.map(s=>{
    const odds = Number(s.odds);
    if(!(odds>1)) return {...s, stake:0, payout:0, profit:-Number(totalStake)||0, valid:false};
    const stake = invSum>0 ? (Number(totalStake)||0) * (1/odds) / invSum : 0;
    const payout = stake*odds;
    const profit = payout - (Number(totalStake)||0);
    return {...s, stake:Number(stake.toFixed(4)), payout:Number(payout.toFixed(4)), profit:Number(profit.toFixed(4)), valid:true};
  });
  const anyHitProfit = rows.find(r=>r.valid)?.profit ?? 0;
  return { rows, impliedProbPct: Number((impliedProb*100).toFixed(2)), overround: impliedProb>1, profitIfAnyHit: anyHitProfit, lossIfNoneHit: -(Number(totalStake)||0) };
}

// Compounding profit calculator — pure math, assumes every bet in the sequence wins
// and a configurable fraction of the bank is reinvested as the stake each time.
function calcCompounding(startBank, odds, numBets, reinvestPct){
  const o = Number(odds), n = Math.max(0, Math.round(Number(numBets)||0)), bank0 = Number(startBank)||0;
  const frac = Math.min(1, Math.max(0, (Number(reinvestPct)||0)/100));
  const rows = []; let bank = bank0;
  for(let i=1;i<=n;i++){
    const stake = bank*frac;
    const profit = o>1 ? stake*(o-1) : 0;
    bank = bank + profit;
    rows.push({ bet:i, stake:Number(stake.toFixed(2)), profit:Number(profit.toFixed(2)), bank:Number(bank.toFixed(2)) });
  }
  return { rows, finalBank:Number(bank.toFixed(2)), totalProfit:Number((bank-bank0).toFixed(2)), growthPct: bank0>0 ? Number((((bank-bank0)/bank0)*100).toFixed(1)) : null };
}

// Back-then-lay lock-in calculator — standard exchange "green-up" formula:
// layStake = (backOdds * backStake) / layOdds, which equalises profit whichever way the market settles.
function calcLockIn(backOdds, backStake, layOdds){
  const bo=Number(backOdds), bs=Number(backStake), lo=Number(layOdds);
  if(!(bo>1) || !(bs>0) || !(lo>1)) return null;
  const layStake = (bo*bs)/lo;
  const liability = layStake*(lo-1);
  const profitIfSelectionWins = bs*(bo-1) - liability; // back wins, lay loses (pays liability)
  const profitIfSelectionLoses = layStake - bs; // lay wins (nets layStake), back stake lost
  return { layStake:Number(layStake.toFixed(2)), liability:Number(liability.toFixed(2)), profitIfSelectionWins:Number(profitIfSelectionWins.toFixed(2)), profitIfSelectionLoses:Number(profitIfSelectionLoses.toFixed(2)) };
}

/* ============================================================================
   FORM / H2H / VENUE / CORNER STAT HELPERS — all computed strictly from
   matches with date < the match being evaluated (no lookahead bias), same
   convention as computeLeagueTable. These back the new batch of strategies.
   Explicitly NOT available anywhere in football-data.co.uk and therefore
   NEVER approximated: playing style/possession, weather, manager-change
   history, team news/injuries, coach tactics, player attributes, derby
   detection, relegation/title context, in-play goal-timing, exchange
   liquidity. Strategies below document these gaps in their dataNote rather
   than substituting a guess.
============================================================================ */
function matchesInvolving(matches, team){
  return matches.filter(m=> team && (m.home_team===team||m.away_team===team) && m.home_goals!==null && m.away_goals!==null && m.full_time_result && !m.invalid && !m.result_conflict);
}
function resultFor(m, team){
  const isHome = m.home_team===team;
  const gf = isHome?m.home_goals:m.away_goals, ga = isHome?m.away_goals:m.home_goals;
  return gf>ga?"W":gf<ga?"L":"D";
}
function recentFormBefore(matches, team, beforeDateExclusive, n){
  const tm = matchesInvolving(matches, team).filter(m=>m.date && m.date<beforeDateExclusive).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(tm.length===0) return {played:0, ppg:null, gfAvg:null, gaAvg:null, noLossStreak:0, lastResult:null};
  let wins=0,draws=0,losses=0,gf=0,ga=0,noLossStreak=0,streakBroken=false;
  for(const m of tm){
    const isHome=m.home_team===team;
    const gfm=isHome?m.home_goals:m.away_goals, gam=isHome?m.away_goals:m.home_goals;
    gf+=gfm; ga+=gam;
    const res = gfm>gam?"W":gfm<gam?"L":"D";
    if(res==="W") wins++; else if(res==="D") draws++; else losses++;
    if(!streakBroken){ if(res!=="L") noLossStreak++; else streakBroken=true; }
  }
  return { played:tm.length, ppg:Number(((wins*3+draws)/tm.length).toFixed(2)), gfAvg:Number((gf/tm.length).toFixed(2)), gaAvg:Number((ga/tm.length).toFixed(2)), noLossStreak, lastResult: resultFor(tm[0], team) };
}
function bounceBackRatePct(matches, team, beforeDateExclusive){
  const tm = matchesInvolving(matches, team).filter(m=>m.date && m.date<beforeDateExclusive).sort((a,b)=>a.date.localeCompare(b.date));
  let afterLoss=0, wonAfterLoss=0;
  for(let i=1;i<tm.length;i++){
    if(resultFor(tm[i-1], team)==="L"){ afterLoss++; if(resultFor(tm[i], team)==="W") wonAfterLoss++; }
  }
  return afterLoss>0 ? Number((wonAfterLoss/afterLoss*100).toFixed(1)) : null;
}
function venueFormBefore(matches, team, venue, beforeDateExclusive){
  const vm = matches.filter(m=>m.date && m.date<beforeDateExclusive && m.home_goals!==null && m.away_goals!==null && m.full_time_result && !m.invalid && !m.result_conflict && ((venue==="H"&&m.home_team===team)||(venue==="A"&&m.away_team===team)));
  if(vm.length===0) return {played:0, winPct:null};
  const wins = vm.filter(m=> venue==="H" ? m.full_time_result==="H" : m.full_time_result==="A").length;
  return {played:vm.length, winPct:Number((wins/vm.length*100).toFixed(1))};
}
function venueGoalStatsBefore(matches, team, venue, beforeDateExclusive, n){
  const vm = matches.filter(m=>m.date && m.date<beforeDateExclusive && m.home_goals!==null && m.away_goals!==null && !m.invalid && !m.result_conflict && ((venue==="H"&&m.home_team===team)||(venue==="A"&&m.away_team===team))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(vm.length===0) return {played:0, gfAvg:null, gaAvg:null};
  let gf=0, ga=0;
  vm.forEach(m=>{ gf += venue==="H"?m.home_goals:m.away_goals; ga += venue==="H"?m.away_goals:m.home_goals; });
  return {played:vm.length, gfAvg:Number((gf/vm.length).toFixed(2)), gaAvg:Number((ga/vm.length).toFixed(2))};
}
function h2hBefore(matches, teamA, teamB, beforeDateExclusive){
  const hh = matches.filter(m=>m.date && m.date<beforeDateExclusive && m.home_goals!==null && m.away_goals!==null && m.full_time_result && !m.invalid && !m.result_conflict && ((m.home_team===teamA&&m.away_team===teamB)||(m.home_team===teamB&&m.away_team===teamA)));
  let aWins=0,bWins=0,draws=0,goalsTotal=0;
  hh.forEach(m=>{
    goalsTotal += (m.home_goals+m.away_goals);
    if(m.full_time_result==="D") draws++;
    else{ const winner = m.full_time_result==="H"?m.home_team:m.away_team; if(winner===teamA) aWins++; else bWins++; }
  });
  return {played:hh.length, aWins, bWins, draws, avgGoals: hh.length ? Number((goalsTotal/hh.length).toFixed(2)) : null};
}
function leagueGoalStatsBefore(matches, league, season, beforeDateExclusive){
  const lm = matches.filter(m=>m.league===league && m.season===season && m.date && m.date<beforeDateExclusive && m.home_goals!==null && m.away_goals!==null && !m.invalid && !m.result_conflict);
  if(lm.length===0) return {played:0, avgGoals:null, overPct:null, underPct:null};
  let total=0, over=0;
  lm.forEach(m=>{ const g=m.home_goals+m.away_goals; total+=g; if(g>2.5) over++; });
  return {played:lm.length, avgGoals:Number((total/lm.length).toFixed(2)), overPct:Number((over/lm.length*100).toFixed(1)), underPct:Number((100-(over/lm.length*100)).toFixed(1))};
}
function leagueGoalLineStatsBefore(matches, league, season, beforeDateExclusive, line){
  const lm = matches.filter(m=>m.league===league && m.season===season && m.date && m.date<beforeDateExclusive && m.home_goals!==null && m.away_goals!==null && !m.invalid && !m.result_conflict);
  if(lm.length===0) return {played:0, avgGoals:null, overPct:null, underPct:null};
  let total=0, over=0;
  lm.forEach(m=>{ const g=m.home_goals+m.away_goals; total+=g; if(g>line) over++; });
  return {played:lm.length, avgGoals:Number((total/lm.length).toFixed(2)), overPct:Number((over/lm.length*100).toFixed(1)), underPct:Number((100-(over/lm.length*100)).toFixed(1))};
}
function cornerFormBefore(matches, team, beforeDateExclusive, n){
  const vm = matches.filter(m=>m.date && m.date<beforeDateExclusive && ((m.home_team===team&&m.home_corners!==null&&m.away_corners!==null)||(m.away_team===team&&m.home_corners!==null&&m.away_corners!==null))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(vm.length===0) return {played:0, avgFor:null, avgAgainst:null};
  let cf=0,ca=0;
  vm.forEach(m=>{ const isHome=m.home_team===team; cf += isHome?m.home_corners:m.away_corners; ca += isHome?m.away_corners:m.home_corners; });
  return {played:vm.length, avgFor:Number((cf/vm.length).toFixed(2)), avgAgainst:Number((ca/vm.length).toFixed(2))};
}

// Generic qualification-only (no market odds) engine — trigger + real hit-rate,
// reused by BTTS Stats, Corner Kick, and the two exchange-trading strategies.
function evaluateHitRateStrategy(matches, params, spec){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const ledger=[]; let qualified=0, notTriggered=0, missing=0, wins=0, losses=0;
  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null || m.away_goals===null || !m.full_time_result || m.invalid || m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", notes:"Result unavailable, invalid, or FTR/goals conflict on this row"}); continue;
    }
    const trig = spec.trigger(m, matches, params);
    if(trig.dataMissing){ missing++; ledger.push({...base, status:"MISSING_DATA", notes:trig.reason, ...(trig.cols||{})}); continue; }
    if(!trig.ok){ notTriggered++; ledger.push({...base, status:"NOT_TRIGGERED", notes:trig.reason, ...(trig.cols||{})}); continue; }
    qualified++;
    const res = spec.hitCheck(m, trig, matches, params);
    if(res.hit) wins++; else losses++;
    ledger.push({...base, status: res.hit?"HIT":"MISS", stake_units:0, pnl:0, cumulative_units:0,
      notes: (res.notes || (res.hit?"Prediction correct.":"Prediction incorrect.")) + " P&L not computable — no market odds for this bet type in source data; hit-rate only.",
      ...(trig.cols||{}), ...(res.cols||{})});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative:0, maxDrawdown:0, peak:0, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: HOME/AWAY WIN PREDICTION (real staking) ---------------- */
function evaluateHomeAwayFormPredict(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const nForm = Number(params.formWindow)||6;
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const fav = getFavourite(m);
    if(!fav || fav.side===null){ missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes: fav?"No clear favourite (H/A odds equal)":"Home/Away odds not available — used as objective proxy for 'superior team' since no independent quality rating exists in source data"}); continue; }
    const favTeam = fav.side==="H"?m.home_team:m.away_team, dogTeam = fav.side==="H"?m.away_team:m.home_team;
    const h2h = h2hBefore(matches, favTeam, dogTeam, m.date);
    const favDominatesH2H = h2h.played>0 ? h2h.aWins>h2h.bWins : null; // null = no history, treated as neutral, not a blocker
    const favForm = recentFormBefore(matches, favTeam, m.date, nForm);
    const dogForm = recentFormBefore(matches, dogTeam, m.date, nForm);
    const ppgThresh = Number(params.formPpgThreshold)||1.5;
    const favInForm = favForm.played>0 && favForm.ppg>=ppgThresh;
    const bounceBack = favForm.lastResult!=="L" ? true : (()=>{ const r=bounceBackRatePct(matches,favTeam,m.date); return r!==null && r>=(Number(params.bounceBackThreshold)||50); })();
    const favVenueForm = venueFormBefore(matches, favTeam, fav.side, m.date);
    const minVenueSample = Number(params.minVenueSample)||5;
    const favStrongAtVenue = favVenueForm.played>=minVenueSample && favVenueForm.winPct>=(Number(params.venueWinPctThreshold)||55);
    const dogInForm = dogForm.played>0 && dogForm.ppg>=ppgThresh;

    let ok = favDominatesH2H!==false && favInForm && bounceBack && favStrongAtVenue && !dogInForm;
    let reason = "";
    if(!ok){
      if(favDominatesH2H===false) reason = `Head-to-head favours ${dogTeam} historically (${h2h.bWins}-${h2h.aWins} in last ${h2h.played})`;
      else if(!favInForm) reason = `Favourite ${favTeam} not in form (${favForm.played?favForm.ppg+' ppg over last '+favForm.played:'no recent matches'}, need ≥${ppgThresh})`;
      else if(!bounceBack) reason = `${favTeam} lost last match and has a weak historical bounce-back rate`;
      else if(!favStrongAtVenue) reason = `${favTeam} doesn't have a strong ${fav.side==="H"?"home":"away"} record (${favVenueForm.played} matches, ${favVenueForm.winPct??"—"}% win)`;
      else if(dogInForm) reason = `Underdog ${dogTeam} currently in form (${dogForm.ppg} ppg) — upset risk flagged`;
    }
    if(!ok){
      notTriggered++;
      ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_odds:fav.favOdds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes: reason + " | Match-importance (relegation/title context) is not available in this data source and is not part of this decision."});
      continue;
    }
    const odds = fav.side==="H" ? m.odds_B365H : m.odds_B365A;
    if(odds===null){ missing++; ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_odds:fav.favOdds, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"No 1X2 odds recorded for this match"}); continue; }
    if(!engine.eligible(odds)){ notTriggered++; ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_odds:odds, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    const won = fav.side==="H" ? m.full_time_result==="H" : m.full_time_result==="A";
    qualified++;
    const stake = engine.stakeFor(odds);
    const pnl = won ? (odds-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_odds:odds, score:`${m.home_goals}-${m.away_goals}`, status:won?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)), notes:`H2H ${h2h.aWins}-${h2h.bWins}-${h2h.draws}, form ${favForm.ppg}ppg, ${fav.side==="H"?"home":"away"} win% ${favVenueForm.winPct} — staked ${stake.toFixed(2)}u @ ${odds}`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: OVER/UNDER 2.5 STATS (real staking where extended odds exist) ---------------- */
function evaluateOU25StatsPredict(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);

  const baseUnit = Number(params.baseUnit)||1;

  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;

    const awayGF = venueGoalStatsBefore(matches, m.away_team, "A", m.date, nForm).gfAvg;
    const combined = (homeGF!==null && awayGF!==null) ? Number((homeGF+awayGF).toFixed(2)) : null;
    const leagueStats = useLeagueFilter ? leagueGoalStatsBefore(matches, m.league, m.season, m.date) : {played:0, overPct:null, underPct:null};
    if(combined===null){ missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Not enough prior home/away matches yet to compute goal averages"}); continue; }
    const overOk = combined>2.5 && (leagueStats.overPct===null || leagueStats.overPct>50);
    const underOk = combined<2.0 && (leagueStats.overPct===null || leagueStats.underPct>50);
    if(!overOk && !underOk){
      notTriggered++;
      ledger.push({...base, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Combined avg goals ${combined} doesn't clear the Over (>2.5) or Under (<2.0) threshold, or league Over/Under % doesn't confirm`});
      continue;
    }
    const market = overOk ? "OVER_2_5" : "UNDER_2_5";
    const odds = overOk ? m.odds_open.Over25 : m.odds_open.Under25;
    if(odds===null){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:`${overOk?"Over":"Under"} 2.5 odds not in source data (extended odds file required)`}); continue; }
    if(!engine.eligible(odds)){ notTriggered++; ledger.push({...base, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    const totalGoals = m.home_goals+m.away_goals;
    const won = overOk ? totalGoals>2.5 : totalGoals<2.5;
    qualified++;
    const stake = engine.stakeFor(odds);
    const pnl = won ? (odds-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, market, combined_avg:combined, score:`${m.home_goals}-${m.away_goals}`, status:won?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)), notes:`Home GF@home ${homeGF}, Away GF@away ${awayGF}${useLeagueFilter?`, league Over% ${leagueStats.overPct}`:""} — staked ${stake.toFixed(2)}u @ ${odds}`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: BTTS STATS (hit-rate only — no BTTS odds in source data) ---------------- */
function evaluateBttsStatsPredict(matches, params){
  const nForm = Number(params.formWindow)||6;
  return evaluateHitRateStrategy(matches, params, {
    trigger(m, allMatches, p){
      const homeGF = venueGoalStatsBefore(allMatches, m.home_team, "H", m.date, nForm);
      const awayGF = venueGoalStatsBefore(allMatches, m.away_team, "A", m.date, nForm);
      if(homeGF.gfAvg===null || awayGF.gfAvg===null) return {dataMissing:true, reason:"Not enough prior home/away matches yet to compute goal averages"};
      const gfThresh = Number(p.gfThreshold)||1.2, gaThresh = Number(p.gaThreshold)||1.0;
      const bothScore = homeGF.gfAvg>=gfThresh && awayGF.gfAvg>=gfThresh;
      const bothConcede = homeGF.gaAvg>=gaThresh && awayGF.gaAvg>=gaThresh;
      const h2h = h2hBefore(allMatches, m.home_team, m.away_team, m.date);
      const h2hOk = h2h.played===0 || h2h.avgGoals>=1.5;
      const ok = bothScore && bothConcede && h2hOk;
      return {ok, reason: ok?"":`Doesn't clear scoring/conceding thresholds (home GF ${homeGF.gfAvg}/GA ${homeGF.gaAvg}, away GF ${awayGF.gfAvg}/GA ${awayGF.gaAvg}) or weak H2H goal history`,
        cols:{ home_gf:homeGF.gfAvg, home_ga:homeGF.gaAvg, away_gf:awayGF.gfAvg, away_ga:awayGF.gaAvg }};
    },
    hitCheck(m){
      const hit = m.home_goals>0 && m.away_goals>0;
      return {hit, cols:{ actual_score:`${m.home_goals}-${m.away_goals}` }, notes: (hit?"BTTS Yes hit.":"BTTS did not occur.") + " Team news/injury data (e.g. missing star striker) is not available in this data source and is excluded from this trigger."};
    },
  });
}

/* ---------------- STRATEGY: CORNER KICK PREDICTION (hit-rate only — real HC/AC data, no corner-market odds) ---------------- */
function evaluateCornerKickPredict(matches, params){
  const nForm = Number(params.formWindow)||8;
  const minSample = Number(params.minSample)||5;
  const cornersLine = Number(params.cornersLine)||9.5;
  return evaluateHitRateStrategy(matches, params, {
    trigger(m, allMatches){
      if(m.home_corners===null || m.away_corners===null) return {dataMissing:true, reason:"This match row has no recorded corner counts (HC/AC columns) — cannot verify actual outcome"};
      const homeC = cornerFormBefore(allMatches, m.home_team, m.date, nForm);
      const awayC = cornerFormBefore(allMatches, m.away_team, m.date, nForm);
      if(homeC.avgFor===null || awayC.avgFor===null || homeC.played<minSample || awayC.played<minSample)
        return {dataMissing:true, reason:`Not enough prior matches with recorded corner data yet (need ≥${minSample} each; have home ${homeC.played}, away ${awayC.played})`};
      const predictedSide = homeC.avgFor>awayC.avgFor ? "H" : awayC.avgFor>homeC.avgFor ? "A" : null;
      const ok = predictedSide!==null;
      return {ok, reason: ok?"":"Prior corner-form averages are tied — no clear favourite for most corners", side:predictedSide,
        cols:{ home_corner_avg:homeC.avgFor, away_corner_avg:awayC.avgFor, predicted_team: predictedSide ? (predictedSide==="H"?m.home_team:m.away_team) : "—" }};
    },
    hitCheck(m, trig){
      const actualMore = m.home_corners>m.away_corners ? "H" : m.away_corners>m.home_corners ? "A" : "EQUAL";
      const hit = actualMore===trig.side;
      const totalCorners = m.home_corners+m.away_corners;
      return {hit, cols:{ actual_corners:`${m.home_corners}-${m.away_corners}`, total_corners:totalCorners, over_corners_actual: totalCorners>cornersLine?"Yes":"No" },
        notes: (hit?"Predicted team had the most corners.":"Predicted team did not have the most corners.") + " Coach tactics (long-ball/crossing tendency) and player attributes (height, aerial ability) are not available in this data source and are excluded from this trigger — only actual recorded corner form and outcomes are used."};
    },
  });
}

/* ---------------- STRATEGY: LAY THE DRAW — PRE-MATCH SYSTEM (real P&L, dutched bookmaker equivalent) ---------------- */
/* ============================================================================
   Generic real-P&L evaluator for strategies that "lay" one specific side each
   match (the side is picked dynamically per match by spec.pickSide). Prices
   the lay position using the real, bookmaker-achievable dutching equivalent —
   backing the other two real outcomes together — the same technique already
   used by Research Engine's Lay Draw / Lay Favourite markets, since this data
   source has no genuine exchange lay-odds column. Wins if the laid side does
   NOT occur. spec.pickSide(m, allMatches, params) returns:
     {dataMissing:true, reason}  — required data not available
     {ok:false, reason}          — trigger conditions not met
     {ok:true, side:"H"|"D"|"A", cols?} — lay this side
============================================================================ */
function evaluateLaySideStrategy(matches, params, spec){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const pick = spec.pickSide(m, matches, params);
    if(pick.dataMissing){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:pick.reason}); continue; }
    if(!pick.ok){ notTriggered++; ledger.push({...base, ...(pick.cols||{}), status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:pick.reason||"Trigger conditions not met"}); continue; }
    const side = pick.side;
    const oddsMap = {H:m.odds_B365H, D:m.odds_B365D, A:m.odds_B365A};
    const others = ["H","D","A"].filter(s=>s!==side);
    const combined = dutchTwoOutcomes(oddsMap[others[0]], oddsMap[others[1]]);
    if(combined===null){ missing++; ledger.push({...base, ...(pick.cols||{}), status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Missing one or more real bookmaker prices needed to dutch the non-laid outcomes"}); continue; }
    if(!engine.eligible(combined)){ notTriggered++; ledger.push({...base, ...(pick.cols||{}), status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    const won = m.full_time_result !== side;
    qualified++;
    const stake = engine.stakeFor(combined);
    const pnl = won ? (combined-1)*stake : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, ...(pick.cols||{}), lay_side:side, dutched_odds:Number(combined.toFixed(3)), final_score:`${m.home_goals}-${m.away_goals}`, status: won?"WIN":"LOSS", stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`Priced as the real, bookmaker-achievable dutching equivalent of laying ${side==="D"?"the Draw":side==="H"?"Home":"Away"} — backing the other two real outcomes together at their real bookmaker prices. Staked ${stake.toFixed(2)}u @ ${combined.toFixed(3)} combined.`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: LAY THE DRAW — PRE-MATCH (real staking via dutching) ---------------- */
function evaluateLayDrawPrematch(matches, params){
  return evaluateLaySideStrategy(matches, params, {
    pickSide(m, allMatches, p){
      const D = m.odds_open.D;
      if(D===null) return {dataMissing:true, reason:"Draw odds not available in source data"};
      const threshold = Number(p.layThreshold)||4.2;
      if(D>threshold) return {ok:false, reason:`Draw odds ${D} above the ${threshold} threshold`, cols:{draw_odds:D}};
      return {ok:true, side:"D", cols:{draw_odds:D}};
    },
  });
}

/* ---------------- STRATEGY: HALF-TIME DRAW — REAL MARKET BACKING (real P&L, bookmaker HT market) ---------------- */
function evaluateHalftimeDrawLay(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const favMax = Number(params.favMax)||2.2;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(!m.half_time_result || m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Half-time or full-time result unavailable, invalid, or conflicting row"}); continue;
    }
    const fav = getFavourite(m);
    if(!fav){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Home/Away odds not available"}); continue; }
    if(fav.side===null || fav.favOdds>favMax){ notTriggered++; ledger.push({...base, favourite:"—", status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`No strong favourite ≤${favMax} (proxy for 'match likely to be cagey early')`}); continue; }
    const favTeam = fav.side==="H"?m.home_team:m.away_team;
    // Real Half-Time market odds. This field does not exist in football-data.co.uk imports (a 1X2-only,
    // full-time-only source) — it requires a source like API-Football's dedicated Half Time (HT) market.
    // Until that import pipeline exists, this will correctly read as unavailable for every real row.
    const htd = m.odds_open.HTD ?? null;
    if(htd===null){ missing++; ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_odds:fav.favOdds, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Real Half-Time Draw market odds not available in the currently imported data — needs a data source that carries the HT market (e.g. API-Football), not yet wired in"}); continue; }
    if(!engine.eligible(htd)){ notTriggered++; ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_odds:fav.favOdds, ht_draw_odds:htd, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    qualified++;
    const stake = engine.stakeFor(htd);
    const won = m.half_time_result==="D";
    const pnl = won ? stake*(htd-1) : -stake;
    engine.settle(won, pnl);
    if(won) wins++; else losses++;
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, favourite:`${favTeam} (${fav.side})`, fav_odds:fav.favOdds, ht_draw_odds:htd, ht_score:m.half_time_goals||"—", status:won?"WIN":"LOSS",
      stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes:`Backed the real Half-Time Draw market at ${htd} — ${won?"won":"lost"}.`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes:0, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

/* ---------------- STRATEGY: FAVOURITES vs OUTSIDERS (in-play system, hit-rate only) ---------------- */
function firstGoalSide(m){
  if(!m.half_time_goals) return {side:null, note:"Half-time score not available — first-goal side not determinable"};
  const parts = m.half_time_goals.split("-").map(Number);
  if(parts.length!==2 || parts.some(isNaN)) return {side:null, note:"Half-time score not parseable — first-goal side not determinable"};
  const [hthg, htag] = parts;
  const fthg = m.home_goals, ftag = m.away_goals;
  if(hthg===0 && htag===0){
    if(fthg===0 && ftag===0) return {side:null, note:"No goals scored (0-0)"};
    if(fthg>0 && ftag===0) return {side:"H", note:"Only the home team scored, in the second half"};
    if(ftag>0 && fthg===0) return {side:"A", note:"Only the away team scored, in the second half"};
    return {side:null, note:"Both teams scored in the second half — exact order not recorded in this data"};
  }
  if(hthg>0 && htag===0) return {side:"H", note:"Home team scored first, in the first half"};
  if(htag>0 && hthg===0) return {side:"A", note:"Away team scored first, in the first half"};
  return {side:null, note:"Both teams scored in the first half — exact order not recorded in this data"};
}
/* ---------------- STRATEGY: UNDER 4.5 GOALS — LOW-SCORING MATCH SELECTOR (hit-rate only) ---------------- */
function evaluateUnder45LowScoreSelector(matches, params){
  const nForm = Number(params.formWindow)||8;
  const useLeagueFilter = params.league && params.league!=="ALL" && params.season && params.season!=="ALL";
  return evaluateHitRateStrategy(matches, params, {
    trigger(m, allMatches, p){
      const homeStats = venueGoalStatsBefore(allMatches, m.home_team, "H", m.date, nForm);
      const awayStats = venueGoalStatsBefore(allMatches, m.away_team, "A", m.date, nForm);
      if(homeStats.gfAvg===null || awayStats.gfAvg===null) return {dataMissing:true, reason:"Not enough prior home/away matches yet to compute goal averages"};
      const homeTotalAvg = Number((homeStats.gfAvg+homeStats.gaAvg).toFixed(2));
      const awayTotalAvg = Number((awayStats.gfAvg+awayStats.gaAvg).toFixed(2));
      const expectedTotal = Number(((homeTotalAvg+awayTotalAvg)/2).toFixed(2));
      const maxExpected = Number(p.maxExpectedGoals)||2.6;
      const expectedOk = expectedTotal<=maxExpected;
      let leagueOk = true, leagueStats = null;
      if(useLeagueFilter){
        leagueStats = leagueGoalLineStatsBefore(allMatches, m.league, m.season, m.date, 4.5);
        const minUnderPct = Number(p.leagueUnder45PctMin)||85;
        leagueOk = leagueStats.played>0 ? leagueStats.underPct>=minUnderPct : true;
      }
      const ok = expectedOk && leagueOk;
      const reason = !expectedOk ? `Expected total goals ${expectedTotal} above the ${maxExpected} threshold (home ${homeTotalAvg}, away ${awayTotalAvg})`
        : !leagueOk ? `League's historical Under 4.5 rate (${leagueStats.underPct}%) below the ${Number(p.leagueUnder45PctMin)||85}% threshold` : "";
      return {ok, reason, cols:{ expected_total_goals:expectedTotal, home_total_avg:homeTotalAvg, away_total_avg:awayTotalAvg, league_under45_pct: leagueStats ? leagueStats.underPct : "— (select league+season)" }};
    },
    hitCheck(m){
      const total = m.home_goals+m.away_goals;
      const hit = total<4.5;
      return {hit, cols:{ actual_total_goals: total },
        notes:(hit?"4 or fewer goals — Under 4.5 would have held.":"5+ goals — Under 4.5 would have lost.")+
          " Liquidity, 'second league'/low-scoring-team manual selection, and live in-play back-then-lay trading (monitoring odds, locking in profit as time passes) all require live exchange data and match-tracking this app doesn't have, so only the pre-match selection criteria and the real final goal count are checked here — no P&L. Use the Trading Calculators tab to work out lock-in stakes and compounding math by hand with your own live odds."};
    },
  });
}

/* ---------------- STRATEGY: DRAW NO BET METHOD (real staking, priced from real 1X2 odds) ---------------- */
function evaluateDrawNoBetMethod(matches, params){
  const inScope = scopeFilterSortMatches(matches, params);
  if(inScope.length===0) return emptyStrategyResult("No matches in the selected scope.");
  const dLo=Number(params.drawOddsLo)||3.0, dHi=Number(params.drawOddsHi)||6.0, hLo=Number(params.homeOddsLo)||1.60, hHi=Number(params.homeOddsHi)||2.40;
  const baseUnit = Number(params.baseUnit)||1;
  const engine = createStakingEngine(params.stakingPlan||"FLAT", params.stakingParams||{}, baseUnit);
  const ledger=[]; let cumulative=0,peak=0,trough=0,maxDrawdown=0,qualified=0,notTriggered=0,missing=0,wins=0,losses=0,pushes=0;

  for(const m of inScope){
    const base = {date:m.date, home_team:m.home_team, away_team:m.away_team, source_file:m.source_file, source_row:m.source_row};
    if(m.home_goals===null||m.away_goals===null||!m.full_time_result||m.invalid||m.result_conflict){
      missing++; ledger.push({...base, status:"MISSING_DATA", pnl:0, cumulative_units:cumulative, notes:"Result unavailable, invalid, or conflicting row"}); continue;
    }
    const D=m.odds_B365D, H=m.odds_B365H, A=m.odds_B365A;
    if(D===null||H===null||A===null){ missing++; ledger.push({...base, status:"ODDS_UNAVAILABLE", pnl:0, cumulative_units:cumulative, notes:"Home/Draw/Away odds not all available"}); continue; }
    if(!(D>=dLo && D<=dHi && H>=hLo && H<=hHi)){ notTriggered++; ledger.push({...base, draw_odds:D, home_odds:H, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:`Draw odds ${D} or Home odds ${H} outside the configured bands (Draw ${dLo}-${dHi}, Home ${hLo}-${hHi})`}); continue; }
    // Real "Draw No Bet on Home" price, derived from the real quoted Home/Away odds by
    // removing the draw's probability mass from the book: DNB_odds = 1 + H/A. This is a
    // standard, textbook derivation (not a fabricated number) — the same category of
    // technique as the dutching formula used elsewhere in this app.
    const dnbOdds = 1 + H/A;
    if(!engine.eligible(dnbOdds)){ notTriggered++; ledger.push({...base, draw_odds:D, home_odds:H, status:"NOT_TRIGGERED", pnl:0, cumulative_units:cumulative, notes:"Staking plan odds requirement not met"}); continue; }
    qualified++;
    const stake = engine.stakeFor(dnbOdds);
    let pnl, status;
    if(m.full_time_result==="D"){ pnl=0; status="PUSH"; pushes++; }
    else if(m.full_time_result==="H"){ pnl=(dnbOdds-1)*stake; status="WIN"; wins++; engine.settle(true, pnl); }
    else { pnl=-stake; status="LOSS"; losses++; engine.settle(false, pnl); }
    cumulative+=pnl; peak=Math.max(peak,cumulative); trough=Math.min(trough,cumulative); maxDrawdown=Math.min(maxDrawdown,cumulative-peak);
    ledger.push({...base, draw_odds:D, home_odds:H, dnb_odds:Number(dnbOdds.toFixed(3)), final_score:`${m.home_goals}-${m.away_goals}`, status, stake_units:Number(stake.toFixed(4)), pnl:Number(pnl.toFixed(4)), cumulative_units:Number(cumulative.toFixed(4)), bankroll:Number(engine.getBankroll().toFixed(4)),
      notes: status==="PUSH" ? `Match drawn — Draw No Bet stake returned (staked ${stake.toFixed(2)}u).` : `Draw No Bet on Home, priced from real Home/Away odds (fair DNB price ${dnbOdds.toFixed(3)}) — the original method's in-play trade-out-after-first-goal isn't modeled (needs live prices this app doesn't have). Staked ${stake.toFixed(2)}u.`});
  }
  return finalizeStrategyResult({scopeCount:inScope.length, qualified, notTriggered, missing, wins, losses, pushes, cumulative, maxDrawdown, peak, ledger, weekMap:{}});
}

      notes:`Simple back-Home-to-win at the real pre-match odds, held to full time — the original method's in-play trade-out-after-first-goal isn't modeled (needs live prices this app doesn't have). Staked ${stake.toFixed(2)}u @ ${H}.`});
  }
